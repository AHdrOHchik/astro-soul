# Локальная и базовая конфигурация контейнеров.
# Секретов здесь нет — значения подставляются из .env (см. .env.example).
# Примечание: отдельного приложения apps/bot в репозитории пока нет —
# вебхук Telegram Bot API и клиент Bot API работают внутри apps/api,
# а astro-движок (packages/astro) выделен в отдельный сайдкар-контейнер.
name: astro-soul

services:
  postgres:
    image: postgres:16-alpine
    container_name: astro-soul-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-astro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-astro_local_only}
      POSTGRES_DB: ${POSTGRES_DB:-astro_soul}
      # Стабильная сортировка для UUID/JSONB не нужна, но фиксируем локаль для одинаковых ORDER BY.
      LANG: C.UTF-8
      TZ: UTC
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    command:
      - postgres
      - '-c'
      - 'log_min_duration_statement=300'
      - '-c'
      - 'timezone=UTC'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-astro} -d ${POSTGRES_DB:-astro_soul}']
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Отдельная БД для интеграционных тестов (создаётся один раз при инициализации тома).
      - ./infra/postgres/init-test-db.sql:/docker-entrypoint-initdb.d/10-init-test-db.sql:ro

  redis:
    image: redis:7-alpine
    container_name: astro-soul-redis
    restart: unless-stopped
    environment:
      TZ: UTC
    command: ['redis-server', '--appendonly', 'no', '--save', '']
    ports:
      - '${REDIS_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  astro:
    build:
      context: .
      dockerfile: docker/astro.Dockerfile
    image: astro-soul/astro:${IMAGE_TAG:-local}
    container_name: astro-soul-astro
    restart: unless-stopped
    environment:
      TZ: UTC
      ASTRO_HOST: 0.0.0.0
      ASTRO_PORT: ${ASTRO_PORT:-8001}
      ASTRO_ENGINE: ${ASTRO_ENGINE:-fallback}
      ASTRO_LOG_LEVEL: ${LOG_LEVEL:-info}
      SE_EPHE_PATH: ${SE_EPHE_PATH:-}
    expose:
      - '${ASTRO_PORT:-8001}'
    healthcheck:
      test:
        [
          'CMD',
          'python3',
          '-c',
          'import os, urllib.request; urllib.request.urlopen("http://127.0.0.1:" + os.environ.get("ASTRO_PORT", "8001") + "/health", timeout=2).read()',
        ]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 5

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    image: astro-soul/api:${IMAGE_TAG:-local}
    container_name: astro-soul-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      astro:
        condition: service_healthy
    environment:
      TZ: UTC
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${PORT:-8080}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      APPLICATION_VERSION: ${APPLICATION_VERSION:-0.1.0}
      # Внутри сети compose ходим на сервисы postgres/redis/astro, даже если в .env указан localhost.
      DATABASE_URL: ${DOCKER_DATABASE_URL:-postgres://${POSTGRES_USER:-astro}:${POSTGRES_PASSWORD:-astro_local_only}@postgres:5432/${POSTGRES_DB:-astro_soul}}
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
      REDIS_URL: ${DOCKER_REDIS_URL:-redis://redis:6379/0}
      ASTRO_ENGINE: ${ASTRO_ENGINE:-fallback}
      ASTRO_SERVICE_URL: http://astro:${ASTRO_PORT:-8001}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      TELEGRAM_API_BASE_URL: ${TELEGRAM_API_BASE_URL:-}
      BOT_USERNAME: ${BOT_USERNAME:-}
      MINI_APP_URL: ${MINI_APP_URL:-}
      ADMIN_TG_ID: ${ADMIN_TG_ID:-}
      INTERNAL_JOB_SECRET: ${INTERNAL_JOB_SECRET:-}
      SUPPORT_CONTACT: ${SUPPORT_CONTACT:-}
      PSEUDONYM_PEPPER: ${PSEUDONYM_PEPPER:-}
      GEO_PROVIDER: ${GEO_PROVIDER:-bundled}
      GEO_NOMINATIM_URL: ${GEO_NOMINATIM_URL:-https://nominatim.openstreetmap.org}
      GEO_CONTACT_EMAIL: ${GEO_CONTACT_EMAIL:-}
      CONSENT_VERSION: ${CONSENT_VERSION:-2026-11-10}
      RATE_LIMIT_PER_MIN: ${RATE_LIMIT_PER_MIN:-60}
      RATE_LIMIT_CHARTS_PER_MIN: ${RATE_LIMIT_CHARTS_PER_MIN:-10}
      RATE_LIMIT_GEO_PER_MIN: ${RATE_LIMIT_GEO_PER_MIN:-120}
      GIGACHAT_AUTH_KEY: ${GIGACHAT_AUTH_KEY:-}
      GIGACHAT_OAUTH_URL: ${GIGACHAT_OAUTH_URL:-https://ngw.devices.sberbank.ru:9443/api/v2/oauth}
      GIGACHAT_BASE_URL: ${GIGACHAT_BASE_URL:-https://gigachat.devices.sberbank.ru/api/v1}
      GIGACHAT_SCOPE: ${GIGACHAT_SCOPE:-GIGACHAT_API_PERS}
      GIGACHAT_CA_BUNDLE: ${GIGACHAT_CA_BUNDLE:-/etc/astro-soul/certs/russian_trusted_root_ca.cer}
      LLM_MODEL: ${LLM_MODEL:-GigaChat-3-Ultra}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.7}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-1400}
      LLM_TIMEOUT_MS: ${LLM_TIMEOUT_MS:-60000}
      LLM_REPORT_CAP_RUB: ${LLM_REPORT_CAP_RUB:-80}
      # Потолок на одну совместимость: товар за 249 ⭐, ~треть разбора.
      LLM_COMPAT_CAP_RUB: ${LLM_COMPAT_CAP_RUB:-25}
      LLM_MONTHLY_CAP_RUB_REPORT: ${LLM_MONTHLY_CAP_RUB_REPORT:-2000}
      LLM_MONTHLY_CAP_RUB_FORECAST: ${LLM_MONTHLY_CAP_RUB_FORECAST:-2000}
      LLM_FAKE: ${LLM_FAKE:-0}
      # Circuit breaker разборов: на стенде можно выключить для ручных прогонов.
      REPORT_BREAKER_ENABLED: ${REPORT_BREAKER_ENABLED:-1}
      # Брейкер совместимости — отдельный: свой счётчик, свой флаг.
      COMPAT_BREAKER_ENABLED: ${COMPAT_BREAKER_ENABLED:-1}
      # Автовозврат звёзд за неудавшийся разбор (джоб report_refund).
      # По умолчанию 0 — решение владельца: возврата нет. Строка нужна здесь,
      # потому что compose подставляет из .env только перечисленные переменные.
      REFUND_ON_REPORT_FAILED: ${REFUND_ON_REPORT_FAILED:-0}
      # Тестовые тарифы за 1 ⭐ (test_1, test_report_1): по умолчанию пусто —
      # флага нет в .env.example, и без явной строки в .env он выключен.
      # Строка нужна, потому что compose подставляет из .env только те
      # переменные, которые перечислены здесь: без неё флаг из .env не доедет
      # до контейнера (и «ничего не изменилось» — не баг приложения).
      PAYMENTS_TEST_PLANS: ${PAYMENTS_TEST_PLANS:-}
    volumes:
      - ./docker/certs/russian_trusted_root_ca.cer:/etc/astro-soul/certs/russian_trusted_root_ca.cer:ro
    expose:
      - '${PORT:-8080}'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:' + (process.env.PORT || 8080) + '/api/v1/health').then(async (r) => { if (!r.ok) process.exit(1); const b = await r.json(); process.exit(b.db === 'ok' ? 0 : 1); }).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 5

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
        VITE_BOT_USERNAME: ${VITE_BOT_USERNAME:-}
        VITE_SUPPORT_CONTACT: ${VITE_SUPPORT_CONTACT:-}
        VITE_SUBSCRIPTIONS: ${VITE_SUBSCRIPTIONS:-}
    image: astro-soul/web:${IMAGE_TAG:-local}
    container_name: astro-soul-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      TZ: UTC
    ports:
      - '${WEB_HTTP_PORT:-80}:8080'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8080/']
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 5

  # Отдельный одноразовый шаг миграций и сида планов (`make migrate`).
  # Автоприменение на старте API запрещено (гонка при нескольких репликах).
  migrate:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    image: astro-soul/api:${IMAGE_TAG:-local}
    container_name: astro-soul-migrate
    profiles: ['tools']
    restart: 'no'
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TZ: UTC
      DATABASE_URL: ${DOCKER_DATABASE_URL:-postgres://${POSTGRES_USER:-astro}:${POSTGRES_PASSWORD:-astro_local_only}@postgres:5432/${POSTGRES_DB:-astro_soul}}
    entrypoint: ['/usr/local/bin/migrate-run.sh']
    command: []

volumes:
  postgres-data:
