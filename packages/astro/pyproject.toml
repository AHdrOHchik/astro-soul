[project]
name = "astro-soul-astro"
version = "0.1.0"
description = "Астро-движок «Разбор личности»: натальная карта, транзиты, SVG-колесо, контекст для LLM"
requires-python = ">=3.11"
# pyswisseph — AGPL-3.0 (Swiss Ephemeris). До покупки коммерческой лицензии
# движок работает в режиме ASTRO_ENGINE=fallback (встроенная эфемерида Moshier,
# без файлов .se1). Подробности — README пакета.
dependencies = [
    "pyswisseph==2.10.3.2",
    # HTTP-сайдкар для API (NestJS): POST /chart, /transits, /wheel, GET /health
    "fastapi>=0.115,<1",
    "uvicorn>=0.32,<1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "ruff==0.7.4",
    # проверка вывода движка по контракту (tests/test_contract.py)
    "jsonschema==4.23.0",
    "pyyaml==6.0.2",
    # тесты сайдкара через ASGI-транспорт, без запуска сервера
    "httpx>=0.27,<1",
]

[project.scripts]
astro-engine = "astro.cli:main"
astro-service = "astro.service:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["astro*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]
# Публичный API пакета назван так же, как в SPEC и в задаче:
# calcChart / transitsFor / llmContext / renderWheel / hashInput.
ignore = ["N802"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
# Контуры глифов — сгенерированные строки фиксированной длины (см. tools/build_glyphs.py).
"astro/glyphs.py" = ["E501"]
