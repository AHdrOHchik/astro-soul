openapi: 3.1.0
info:
  title: Astro Soul API
  version: 1.4.0
  description: |
    API мини-приложения «Разбор личности» (Telegram Mini App).
    Контракт — единственный источник правды. Любое поле, которого здесь нет,
    считается несуществующим: фронт не имеет права на него рассчитывать,
    бэк не имеет права его отдавать без обновления этого файла и версии.

    1.1.0 — `Chart.asc`, `Chart.mc` и `Chart.houses` могут быть `null`:
    при неизвестном времени рождения дома и Асцендент не рассчитываются
    (SPEC, раздел «Астро-движок»). Уточнены семантика `Aspect.a`/`Aspect.b`
    (ключи планет) и единицы `Chart.balances` (проценты).

    1.2.0 — `nullable: true` заменён на канонический для JSON Schema 2020-12
    вид `type: [X, 'null']` (в OpenAPI 3.1 ключ `nullable` не определён и
    игнорируется генераторами); добавлен код `CONFLICT` (409 при удалении
    профиля с незавершёнными платежами); добавлено `Chart.omitted_planets`
    (планеты, которые движок не смог рассчитать); в `/health` добавлено
    состояние астро-движка `astro`.

    1.2.1 — уточнения по отчёту фронта (PR #2):
      • `VALIDATION_FAILED` всегда 422 (400 в контракте не используется),
        `CONFLICT` — 409; у `VALIDATION_FAILED` есть `details.field_errors`
        `[{field, message}]`, чтобы фронт подсвечивал конкретное поле;
      • `message` в `Problem` — готовый текст на «ты», его можно показывать как есть;
        неизвестный маршрут тоже отдаёт `Problem` (`NOT_FOUND`, русский текст);
      • `POST /geo/resolve` всегда отвечает 200 и массивом (пустой массив =
        «города нет»); `GEO_NOT_FOUND` (503) — только когда недоступен сам
        провайдер геоданных; лимит маршрута — 120 запросов в минуту;
      • `POST /charts`: обязательные `consent {accepted, version}` и
        `time_precision` (exact | approximate | unknown), `Chart.birth.time_precision`
        в ответе, проверка 18+ и даты не раньше 1900 на сервере;
      • `GET /charts/{chart_id}` отвечает тем же конвертом, что и `POST /charts`:
        `{chart, mini_reading, wheel_url}`.

    1.3.0 — по отчёту фронта (PR #12) и решениям владельца продукта:
      • `POST /geo/resolve`: `query` — минимум 2 символа; короче — `422`
        `VALIDATION_FAILED` с `field_errors[{field: "query"}]`. Пустой массив
        означает только «города нет»;
      • `503 GEO_NOT_FOUND` описывает машинную причину в `details.reason`:
        `provider_timeout | provider_unavailable | not_configured`; текст ошибки
        больше не предлагает «ввести координаты вручную»;
      • возраст: 18 лет исполняется в 00:00 UTC дня рождения; для рождённых
        29 февраля в невисокосный год — 1 марта. Фронт повторяет это правило;
      • согласие принимается только в актуальной редакции (`CONSENT_VERSION`
        сервера, сейчас `2026-11-10`). Устаревшая версия — `422` с
        `field_errors[{field: "consent.version"}]`, по нему фронт сбрасывает галочку;
      • `POST /api/v1/events` — события продукта батчем до 20 штук, ответ `202`;
        список событий — `x-analytics-events`;
      • `GET /api/v1/charts/{chart_id}/wheel.png` — растр колеса для шаринга;
        в `ChartResponse` добавлен `wheel_png_url`;
      • колесо SVG больше не использует `<text>` и `font-family`: все подписи —
        векторные контуры, поэтому глифы планет рисуются в любом WebView.

    1.4.0 — единый конверт карты, предупреждения и «текущая карта»:
      • `ChartResponse` — один и тот же объект из `POST /charts` (201 и 200),
        `GET /charts/{chart_id}` и `GET /charts/current`:
        `{chart, mini_reading, warnings, wheel_url, wheel_png_url, is_restored}`.
        Никаких конвертов под конкретный метод;
      • `GET /api/v1/charts/current` — карта пользователя либо `404`
        (`NOT_FOUND`), по которому клиент уходит в онбординг. Ответ тот же
        `ChartResponse`, `is_restored: true`;
      • `POST /charts` отвечает `200`, когда такая карта уже есть (совпал хэш
        входа), и `201`, когда создана. В обоих случаях `is_restored` в теле
        говорит правду, поэтому клиент различает `chart_created` и
        `chart_restored` по телу ответа, а не по коду;
      • `ChartResponse.warnings` — обязательный массив верхнего уровня, `[]`
        допустим. Коды: `no_birth_time` (время неизвестно),
        `approximate_time` (время приблизительное), `approximate_place`
        (города нет в справочнике либо часовой пояс восстановлен по
        ближайшему крупному городу). Список расширяемый: неизвестные коды
        клиент пропускает. Карты, созданные до появления поля, отдают `[]`;
      • `GET /charts/{chart_id}/wheel.png` — `size=1080|1600`; любое другое
        значение — `422` (не подменяем размер молча);
      • `POST /geo/resolve`: `limit` вне 1…10 — `422`, а не обрезка до
        границы: клиент не должен получать другой ответ, чем просил;
      • `Me.entitlements` (`Entitlements`) и `Me.chart_id` — реальные значения,
        а не заглушки. Удаление профиля с незавершённым платежом по-прежнему
        `409 CONFLICT`;
      • запрещённые ключи в `props` событий перечислены в контракте
        (`x-events-forbidden-prop-keys`) и совпадают с кодом; `POST /events`
        отвечает `202 {accepted}`, где `accepted` может быть меньше размера
        батча — события с ПДн отбрасываются;
      • `x-bot.share_link_template` — ссылка шаринга на конкретную карту:
        `https://t.me/{username}?startapp=chart_{chart_id}`. Бот открывает
        мини-апп, а карта поднимается через `GET /charts/current`;
      • `GET /admin/metrics`: агрегаты по воронке считаются по
        `events.occurred_at` (клиентское время), а не по `created_at`.

    Аутентификация: каждый запрос из мини-аппа передаёт заголовок
    `X-Telegram-Init-Data` с сырой строкой `Telegram.WebApp.initData`.
    Сервер валидирует подпись HMAC-SHA256 по ключу бота и проверяет auth_date (<= 24 ч).
    Других способов авторизации нет (никаких JWT в localStorage — их нельзя защитить).
servers:
  - url: https://api.astro-soul.example.com
    description: production
  - url: http://localhost:8080
    description: local

tags:
  - name: system
  - name: profile
  - name: charts
  - name: reports
  - name: engagement
  - name: billing
  - name: internal

components:
  securitySchemes:
    TelegramInitData:
      type: apiKey
      in: header
      name: X-Telegram-Init-Data
      description: Сырая строка initData из Telegram.WebApp

  headers:
    RateLimit-Remaining:
      schema: { type: integer }
      description: Остаток квоты в текущем окне
    RateLimit-Reset:
      schema: { type: integer }
      description: Unix-время сброса окна

  schemas:
    FieldError:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
          description: Имя поля из запроса (birth_date, birth_time, birth_place, consent, plan_code)
          example: birth_date
        message:
          type: string
          description: Короткий текст ошибки для этого поля (ru, на «ты»)
          example: Дата рождения должна быть в прошлом

    Problem:
      type: object
      required: [code, message, request_id]
      description: |
        Единый формат ошибок, `application/problem+json`.

        Соответствие кода и статуса жёсткое: `VALIDATION_FAILED` — **всегда 422**
        (400 в API не используется), `CONFLICT` — 409, `UNAUTHORIZED` — 401,
        `FORBIDDEN` — 403, `NOT_FOUND` — 404, `RATE_LIMITED` — 429,
        `INTERNAL`/`GEO_NOT_FOUND`/`UPSTREAM_LLM` — 503/502.

        `message` — готовый текст для экрана, обращение на «ты». Фронт может
        показывать его без переписывания. Неизвестный маршрут тоже возвращает
        `Problem` (`NOT_FOUND`, «Такой страницы нет. Обнови приложение»),
        а не текст фреймворка.
      properties:
        code:
          type: string
          enum: [UNAUTHORIZED, FORBIDDEN, NOT_FOUND, CONFLICT, VALIDATION_FAILED, QUOTA_EXCEEDED, PAYMENT_REQUIRED, RATE_LIMITED, INTERNAL, UPSTREAM_LLM, GEO_NOT_FOUND]
        message: { type: string, description: Готовый текст для показа пользователю (ru, на «ты») }
        request_id: { type: string, description: Для поиска в логах }
        details:
          type: object
          additionalProperties: true
          properties:
            field_errors:
              type: array
              description: |
                Заполняется для `VALIDATION_FAILED`: список полей с ошибками.
                Порядок отражает порядок проверки, дубликатов по `field` нет.
              items: { $ref: '#/components/schemas/FieldError' }

    SubscriptionState:
      type: object
      required: [plan, is_active, expires_at, auto_renew]
      properties:
        plan:
          type: string
          enum: [none, trial, week, month, year]
        is_active: { type: boolean }
        expires_at:
          type: [string, 'null']
          format: date-time
        auto_renew:
          type: boolean
          description: Управляется пользователем в настройках Telegram, только для чтения
        stars_paid_total:
          type: integer
          description: Сколько звёзд пользователь заплатил суммарно

    Quota:
      type: object
      required: [code, used, limit, reset_at]
      properties:
        code:
          type: string
          enum: [forecast_daily, ask_daily, report_month, compat_month]
        used: { type: integer }
        limit: { type: integer, description: -1 = безлимит }
        reset_at: { type: string, format: date-time }

    Me:
      type: object
      required: [user_id, is_new, subscription, quotas, has_profile]
      properties:
        user_id: { type: string, description: Внутренний UUID, не telegram_id }
        display_name: { type: [string, 'null'] }
        is_new: { type: boolean }
        has_profile: { type: boolean }
        has_chart: { type: boolean }
        chart_id:
          type: [string, 'null']
          format: uuid
          description: |
            Карта пользователя для `GET /charts/{chart_id}` и `/charts/current`.
            `null`, пока карты нет. Сервер возвращает поле всегда; в `required`
            не включено, чтобы не ломать уже собранный клиент.
        subscription: { $ref: '#/components/schemas/SubscriptionState' }
        entitlements: { $ref: '#/components/schemas/Entitlements' }
        quotas:
          type: array
          items: { $ref: '#/components/schemas/Quota' }
        onboarding_step:
          type: string
          enum: [birth_date, birth_time, birth_place, done]

    Entitlements:
      type: object
      description: |
        Права доступа (`Me.entitlements`). Источник правды —
        `getEntitlements(userId)` на сервере (payments.md §4); клиент по этим
        флагам только рисует интерфейс и никогда не решает доступ сам.
      required:
        [is_active, plan, full_forecast, ask_per_day, full_report, compat_per_month, solar_included]
      properties:
        is_active:
          type: boolean
          description: Подписка действует прямо сейчас
        plan:
          type: string
          enum: [none, trial, week, month, year]
        full_forecast: { type: boolean }
        ask_per_day:
          type: integer
          description: 'Вопросов «спроси карту» в день: 0 / 1 / 5 / -1 (без лимита)'
          enum: [0, 1, 5, -1]
        full_report:
          type: boolean
          description: Куплен ли полный разбор (разово, навсегда для карты)
        compat_per_month: { type: integer }
        solar_included: { type: boolean }

    GeoPlace:
      type: object
      required: [name, country, lat, lon, tz]
      properties:
        name: { type: string, example: Москва }
        region: { type: [string, 'null'] }
        country: { type: string, example: RU }
        lat: { type: number, example: 55.7558 }
        lon: { type: number, example: 37.6173 }
        tz: { type: string, example: Europe/Moscow }

    PlanetPosition:
      type: object
      required: [key, name, sign, degree, minute, retrograde]
      properties:
        key: { type: string, enum: [sun, moon, mercury, venus, mars, jupiter, saturn, uranus, neptune, pluto, chiron, node] }
        name: { type: string, example: Солнце }
        sign: { type: string, example: Телец }
        degree: { type: integer, example: 26 }
        minute: { type: integer, example: 17 }
        house: { type: [integer, 'null'], minimum: 1, maximum: 12 }
        retrograde: { type: boolean }

    Aspect:
      type: object
      required: [a, b, type, orb]
      properties:
        a: { type: string, description: 'ключ планеты из PlanetPosition.key' }
        b: { type: string, description: 'ключ планеты из PlanetPosition.key' }
        type: { type: string, enum: [conjunction, opposition, trine, square, sextile] }
        orb: { type: number, example: 0.41 }
        strength: { type: number, minimum: 0, maximum: 1 }

    ChartResponse:
      type: object
      description: |
        Единый конверт карты (1.4.0). Один и тот же объект отдают
        `POST /charts` (201 и 200), `GET /charts/{chart_id}` и
        `GET /charts/current` — никаких отдельных конвертов под метод.
      required: [chart, mini_reading, warnings, wheel_url, is_restored]
      properties:
        chart: { $ref: '#/components/schemas/Chart' }
        is_restored:
          type: boolean
          description: |
            `true` — карта уже существовала и отдана из хранилища,
            `false` — рассчитана и сохранена этим запросом. Свойство тела,
            а не кода ответа: на него опираются события `chart_created` и
            `chart_restored`.
          example: true
        warnings:
          type: array
          description: |
            Предупреждения о качестве входных данных. Массив обязателен,
            пустой допустим.

            Коды: `no_birth_time` — время рождения неизвестно;
            `approximate_time` — время известно приблизительно;
            `approximate_place` — города не было в справочнике либо часовой
            пояс восстановлен по ближайшему крупному городу.

            Список расширяемый: незнакомый клиенту код он пропускает и не
            ломает экран. Карты, созданные до 1.4.0, отдают `[]`.
          items:
            type: string
            enum: [no_birth_time, approximate_time, approximate_place]
            x-extensible-enum: true
          example: [no_birth_time]
        mini_reading:
          type: object
          required: [sun, moon, asc, summary]
          properties:
            sun: { type: string, example: 'Солнце в Телец, 26°17′' }
            moon: { type: string, example: 'Луна в Лев, 12°38′' }
            asc: { type: string, example: 'Асцендент в Дева, 15°03′' }
            summary: { type: string, example: 'Солнце в Телец, 26°17′ · Луна в Лев, 12°38′' }
        wheel_url:
          type: string
          description: |
            Относительный путь к SVG-колесу с подписью: `/api/v1/charts/{chart_id}/wheel.svg?sig=...`.
            Маршрут публичный (security: []), initData не нужен — можно вставлять в `<img>`.
          example: /api/v1/charts/0f1c.../wheel.svg?sig=1767225600.abc123
        wheel_png_url:
          type: string
          description: |
            Относительный путь к PNG-колесу с той же подписью: `/api/v1/charts/{chart_id}/wheel.png?sig=...`.
            Нужен для шаринга: в чат уходит картинка, а не ссылка на SVG.
            Маршрут публичный (`security: []`), размер по умолчанию 1080 px по ширине.

            Поле новое в 1.3.0 и **необязательное для чтения**: сервер возвращает его
            всегда, но клиент может его не читать, пока не делает шаринг картинкой.
            Так поле можно ввести, не ломая уже собранный фронт.
          example: /api/v1/charts/0f1c.../wheel.png?sig=1767225600.abc123

    Chart:
      type: object
      required: [chart_id, created_at, birth, asc, mc, planets, houses, aspects, balances]
      properties:
        chart_id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        birth:
          type: object
          properties:
            date: { type: string, format: date }
            time: { type: [string, 'null'], description: "null, если время неизвестно" }
            time_known: { type: boolean }
            time_precision:
              type: string
              enum: [exact, approximate, unknown]
              description: Точность времени, с которой карта построена (эхо `ChartCreateRequest.time_precision`)
            place: { $ref: '#/components/schemas/GeoPlace' }
        asc:
          type: [object, 'null']
          description: null, если время рождения неизвестно (time_known = false)
          properties:
            sign: { type: string }
            degree: { type: integer }
            minute: { type: integer }
        mc:
          type: [object, 'null']
          description: null, если время рождения неизвестно (time_known = false)
          properties:
            sign: { type: string }
            degree: { type: integer }
            minute: { type: integer }
        planets:
          type: array
          items: { $ref: '#/components/schemas/PlanetPosition' }
        houses:
          type: [array, 'null']
          description: 12 куспидов, начиная с 1-го дома; null, если время рождения неизвестно
          items:
            type: object
            properties:
              house: { type: integer }
              sign: { type: string }
              degree: { type: integer }
        aspects:
          type: array
          items: { $ref: '#/components/schemas/Aspect' }
        balances:
          type: object
          description: Доли в процентах, сумма по каждой группе ≈ 100 (округление до 0.1)
          properties:
            elements:
              type: object
              properties:
                fire: { type: number }
                earth: { type: number }
                air: { type: number }
                water: { type: number }
            modalities:
              type: object
              properties:
                cardinal: { type: number }
                fixed: { type: number }
                mutable: { type: number }
        engine_version: { type: string, example: "1.0.0" }
        omitted_planets:
          type: array
          description: |-
            Планеты, которые движок не смог рассчитать. Сейчас это `chiron`:
            он требует файлов Swiss Ephemeris (`seas_18.se1`), которых нет в
            fallback-режиме. В тексте разбора такие планеты не упоминаются.
          items: { type: string }

    ChartCreateRequest:
      type: object
      required: [birth_date, birth_place, time_precision, consent]
      properties:
        birth_date:
          type: string
          format: date
          example: "1994-05-17"
          description: |
            Дата рождения в прошлом, не раньше 1900-01-01, возраст — не меньше 18 лет.
            Правило возраста (решение владельца продукта): 18 лет исполняется в
            **00:00 UTC дня рождения**; для рождённых 29 февраля в невисокосный
            год днём рождения считается 1 марта. Фронт повторяет это правило,
            чтобы не отклонять дату, которую сервер принимает.
            Проверяется на сервере (проверка на фронте — только UX, не защита).
        birth_time:
          type: [string, 'null']
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
          description: |
            Локальное время места рождения (HH:MM).
            Обязательно при `time_precision` = exact | approximate, обязано быть `null`
            при `time_precision` = unknown.
        time_precision:
          type: string
          enum: [exact, approximate, unknown]
          description: |
            Насколько известно время. Сохраняется в `profiles.time_mode` и
            возвращается в `Chart.birth.time_precision`.
            `unknown` ⇒ дома и Асцендент не рассчитываются.
        birth_place: { $ref: '#/components/schemas/GeoPlace' }
        consent:
          type: object
          description: |
            Согласие на обработку ПДн (152-ФЗ). Обязательно, сохраняется
            в `profiles.consent_at` и `profiles.consent_version`.
            `accepted: false` → 422 VALIDATION_FAILED.
          required: [accepted, version]
          properties:
            accepted:
              type: boolean
              enum: [true]
            version:
              type: string
              minLength: 1
              maxLength: 32
              description: |
                Версия текста согласия, которую показал фронт. Сервер принимает
                только актуальную редакцию (`CONSENT_VERSION`, сейчас `2026-11-10`).
                Любая другая — `422` с `details.field_errors[{field: "consent.version"}]`;
                по этому полю фронт снимает галочку и показывает «Условия обновились».
              example: "2026-11-10"

    ClientEvent:
      type: object
      required: [name, at]
      properties:
        name:
          type: string
          description: Имя события из `x-analytics-events`
          enum:
            - app_open
            - consent_view
            - consent_accepted
            - birth_date_done
            - birth_time_done
            - birth_place_done
            - step_back
            - place_search
            - place_search_empty
            - place_search_failed
            - chart_requested
            - chart_created
            - chart_failed
            - chart_restored
            - validation_failed
            - paywall_view
            - checkout_opened
            - payment_succeeded
            - payment_cancelled
            - share_clicked
            - screen_view
        at:
          type: string
          format: date-time
          description: Время события на устройстве (ISO 8601 с часовым поясом)
          example: "2026-11-10T12:00:00.000Z"
        props:
          type: object
          additionalProperties:
            type: [string, number, boolean]
          description: |
            Идентификаторы, шаг, код ошибки. Строки до 64 символов.
            Ключи с ПДн (`birth_date`, `birth_time`, `birth_place`, `place`,
            `city`, `query`, `date`, `time`, `lat`, `lon`, `tz`, `first_name`,
            `username`, `phone`, `email`) запрещены — такое событие отбрасывается.
          example: { step: chart, code: VALIDATION_FAILED }

    EventsBatch:
      type: object
      required: [events]
      properties:
        events:
          type: array
          minItems: 1
          maxItems: 20
          items: { $ref: '#/components/schemas/ClientEvent' }

    EventsAccepted:
      type: object
      required: [accepted]
      properties:
        accepted:
          type: integer
          description: Сколько событий записано (после отбрасывания ПДн и устаревших)
          example: 3

    ReportRequest:
      type: object
      required: [chart_id, type]
      properties:
        chart_id: { type: string, format: uuid }
        type: { type: string, enum: [full, compat, solar] }
        partner:
          type: [object, 'null']
          description: Обязателен при type=compat
          properties:
            birth_date: { type: string, format: date }
            birth_time: { type: [string, 'null'] }
            birth_place: { $ref: '#/components/schemas/GeoPlace' }
            name: { type: string, maxLength: 60 }

    Report:
      type: object
      required: [report_id, status, type, created_at]
      properties:
        report_id: { type: string, format: uuid }
        chart_id: { type: string, format: uuid }
        type: { type: string, enum: [full, compat, solar] }
        status: { type: string, enum: [queued, generating, ready, failed, refunded] }
        progress: { type: integer, minimum: 0, maximum: 100 }
        created_at: { type: string, format: date-time }
        ready_at: { type: [string, 'null'], format: date-time }
        pdf_url: { type: [string, 'null'], description: Временная подписанная ссылка, TTL 24 ч }
        sections:
          type: array
          items:
            type: object
            properties:
              key: { type: string, enum: [core, emotions, talents, relations, money, purpose, summary] }
              title: { type: string }
              body_md: { type: string }
              order: { type: integer }
        is_paid: { type: boolean }
        teaser: { type: string, description: Первые 400 символов — для пейволла }

    Forecast:
      type: object
      required: [date, text, is_paid]
      properties:
        date: { type: string, format: date }
        text: { type: string, description: 3–6 предложений, вариант для бесплатного = урезанный }
        focus: { type: [string, 'null'], enum: [career, love, money, health, self] }
        is_paid: { type: boolean }
        generated_at: { type: string, format: date-time }

    AskRequest:
      type: object
      required: [chart_id, question]
      properties:
        chart_id: { type: string, format: uuid }
        question: { type: string, minLength: 3, maxLength: 500 }

    AskResponse:
      type: object
      required: [answer, based_on]
      properties:
        answer: { type: string, maxLength: 1500 }
        based_on:
          type: array
          description: Позиции карты, на которые опирался ответ (для прозрачности)
          items: { type: string, example: "Луна в Льве, 12-й дом" }
        quota: { $ref: '#/components/schemas/Quota' }

    PlanCode:
      type: string
      enum: [week_149, month_399, year_2990, one_149, compat_249, solar_590]

    InvoiceRequest:
      type: object
      required: [plan_code]
      properties:
        plan_code: { $ref: '#/components/schemas/PlanCode' }
        chart_id: { type: string, format: uuid, description: Для разовых продуктов }

    Invoice:
      type: object
      required: [invoice_link, plan_code, stars, is_subscription]
      properties:
        invoice_link:
          type: string
          description: Ссылка на инвойс для Telegram.WebApp.openInvoice
        plan_code: { $ref: '#/components/schemas/PlanCode' }
        stars: { type: integer, example: 399 }
        is_subscription: { type: boolean }
        subscription_period_sec: { type: [integer, 'null'], example: 2592000 }

paths:
  /api/v1/health:
    get:
      tags: [system]
      summary: Проверка живости
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [ok, degraded] }
                  version: { type: string }
                  db: { type: string, enum: [ok, down] }
                  llm: { type: string, enum: [ok, down, unknown] }
                  astro: { type: string, enum: [ok, down], description: Доступность локального сайдкара астро-движка }

  /api/v1/me:
    get:
      tags: [profile]
      summary: Профиль, подписка и квоты вызывающего пользователя
      security: [{ TelegramInitData: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401':
          description: Неверная подпись initData
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
    delete:
      tags: [profile]
      summary: Удалить все персональные данные пользователя (ПДн)
      description: Полное удаление профиля, карт, разборов, прогнозов и вопросов. Подписка сохраняется до конца оплаченного периода, но данные удаляются безвозвратно.
      security: [{ TelegramInitData: [] }]
      responses:
        '204':
          description: Удалено
        '409':
          description: Есть незавершённые платежи (Problem.code = CONFLICT)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /api/v1/geo/resolve:
    post:
      tags: [profile]
      summary: Поиск города для места рождения
      security: [{ TelegramInitData: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query:
                  type: string
                  minLength: 2
                  maxLength: 120
                  description: | 
                    Поиск идёт по мере ввода, начиная с 2 символов. Короче —
                    `422` с `field_errors[{field: "query"}]`; пустой массив
                    означает «города нет», а не «слишком короткий запрос».
                limit:
                  type: integer
                  default: 5
                  minimum: 1
                  maximum: 10
                  description: |
                    Сколько кандидатов вернуть, 1…10. Вне диапазона — `422`,
                    без молчаливой обрезки до границы.
      responses:
        '200':
          description: |
            Кандидаты. Ответ **всегда** 200 и массив: пустой массив = «города нет»,
            это не ошибка. Лишних подтверждений от фронта не нужно.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/GeoPlace' }
        '422':
          description: |
            Запрос короче 2 символов (`VALIDATION_FAILED`) или `limit` вне 1…10.
            `details.field_errors[0]` = `{field: "query", message: "Введи хотя бы 2 буквы"}`.
        '429':
          description: 'Слишком частое обновление подсказок: лимит маршрута 120 запросов в минуту'
        '503':
          description: |
            Провайдер геоданных недоступен (`GEO_NOT_FOUND`). Машинная причина —
            `details.reason`: `provider_timeout` (не ответил за 2 с),
            `provider_unavailable` (сеть или статус), `not_configured`
            (провайдер включён, но не настроен контакт для User-Agent).
            Текст `message` готов к показу: «Поиск городов временно недоступен.
            Попробуй ещё раз через минуту.» Пустой результат сюда не относится —
            он отдаётся как 200 [].

  /api/v1/charts:
    post:
      tags: [charts]
      summary: Создать натальную карту
      description: |
        Расчёт синхронный (≤ 300 мс, Swiss Ephemeris локально).
        В ответе — карта и текстовый мини-разбор (бесплатный крючок).

        Повторный вызов с теми же данными возвращает существующую карту
        (идемпотентность по хэшу входа), но уже с кодом `200` и
        `is_restored: true`: по телу ответа клиент отличает `chart_created`
        от `chart_restored`. Конверт в обоих случаях один и тот же.
      security: [{ TelegramInitData: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChartCreateRequest' }
      responses:
        '201':
          description: "Карта создана: `is_restored: false`"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChartResponse' }
        '200':
          description: |
            Такая карта уже есть (`is_restored: true`) — тот же конверт,
            что и на `201`. Клиент не считает это ошибкой.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChartResponse' }
        '422':
          description: |
            Некорректные данные (VALIDATION_FAILED): `details.field_errors`
            содержит поле и текст для подсветки (birth_date, birth_time,
            birth_place, time_precision, consent).

  /api/v1/charts/current:
    get:
      tags: [charts]
      summary: Текущая карта пользователя
      description: |
        Карта, которая есть у пользователя сейчас: нужна при возврате в
        мини-апп, после `startapp=chart_<id>` и для кнопки «моя карта».

        Конверт тот же, что у `POST /charts` и `GET /charts/{chart_id}`,
        `is_restored: true`. Карты нет — `404 NOT_FOUND`, по нему клиент
        уходит в онбординг. Это не ошибка и не повод показывать красный экран.
      security: [{ TelegramInitData: [] }]
      responses:
        '200':
          description: Карта пользователя
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChartResponse' }
        '404': { description: 'NOT_FOUND — карты ещё нет, иди в онбординг' }

  /api/v1/charts/{chart_id}:
    get:
      tags: [charts]
      summary: Получить карту
      security: [{ TelegramInitData: [] }]
      parameters:
        - name: chart_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: |
            Тот же конверт, что и `POST /charts`: карта, мини-разбор и относительный
            путь к колесу с уже включённой подписью `sig` (его можно открывать без initData).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChartResponse' }
        '404': { description: NOT_FOUND }

  /api/v1/charts/{chart_id}/wheel.svg:
    get:
      tags: [charts]
      summary: Колесо карты в SVG
      description: |
        Публично по подписанному токену в query (`?sig=`), чтобы можно было
        вставлять картинку в чат и в `<img>`.

        Самодостаточный SVG: все подписи — векторные контуры (`<path>`/`<use>`),
        ни одного `<text>`, ни `font-family`, ни внешних ссылок и шрифтов.
        Причина: в мобильном WebView нет ни DejaVu Sans, ни Segoe UI Symbol,
        а глифы планет и знаков зодиака есть только в системных шрифтах —
        `<text>` там превращается в «тофу» и наезжает на маркеры.
      security: []
      parameters:
        - name: chart_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: sig
          in: query
          required: true
          schema: { type: string }
        - name: theme
          in: query
          required: false
          schema: { type: string, enum: [dark, light], default: dark }
      responses:
        '200':
          description: SVG
          content:
            image/svg+xml:
              schema: { type: string }
        '403': { description: 'FORBIDDEN — подпись отсутствует или недействительна' }

  /api/v1/charts/{chart_id}/wheel.png:
    get:
      tags: [charts]
      summary: Колесо карты в PNG (для шаринга)
      description: |
        Тот же рисунок, что и `wheel.svg`, растеризованный в PNG: в чат уходит
        картинка, к ней добавляется ссылка на бота. Публично по той же подписи
        `?sig=`, что и SVG.
      security: []
      parameters:
        - name: chart_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: sig
          in: query
          required: true
          schema: { type: string }
        - name: theme
          in: query
          required: false
          schema: { type: string, enum: [dark, light], default: dark }
        - name: size
          in: query
          required: false
          description: |
            Ширина картинки в пикселях: только `1080` (по умолчанию) или
            `1600`. Другие значения — `422 VALIDATION_FAILED`
            (`field_errors[{field: "size"}]`), а не молчаливая подмена размера.
          schema: { type: integer, enum: [1080, 1600], default: 1080 }
      responses:
        '200':
          description: PNG
          content:
            image/png:
              schema: { type: string, format: binary }
        '403': { description: 'FORBIDDEN — подпись отсутствует или недействительна' }
        '404': { description: NOT_FOUND }
        '422': { description: '`size` не 1080 и не 1600' }

  /api/v1/events:
    post:
      tags: [engagement]
      summary: События продукта батчем
      description: |
        Клиент присылает шаги воронки, которые сервер не видит: открытие,
        экран согласия, шаги онбординга, возврат назад, поиск места, шаринг.

        * батч от 1 до 20 событий; больше — `422`, клиент шлёт не больше 20;
        * ответ `202 Accepted`: приём подтверждён, ждать его интерфейсу незачем.
          Ошибки разбора тоже не должны ломать экран;
        * `name` — только значения из `x-analytics-events` (закрытый список);
        * `props` — идентификаторы, шаг, код ошибки. ПДн (дата/время/место
          рождения, город, имя, телефон, e-mail) в `events` запрещены: такие
          события отбрасываются на сервере и в БД не попадают;
        * `at` — время на устройстве, ISO 8601 с часовым поясом. Старше суток
          или позже серверного времени более чем на 5 минут — отбрасывается;
        * лимит: общий, 60 запросов в минуту; `429` клиент игнорирует.
      security: [{ TelegramInitData: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EventsBatch' }
      responses:
        '202':
          description: Батч принят
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventsAccepted' }
        '422':
          description: |
            Батч пуст, больше 20 событий, неизвестное имя события или время
            вне допустимого окна (`VALIDATION_FAILED` + `details.field_errors`).
        '429': { description: 'RATE_LIMITED — лимит запросов в минуту' }

  /api/v1/reports:
    post:
      tags: [reports]
      summary: Заказать разбор (асинхронно)
      description: |
        Возвращает 202 и report_id. Генерация — в очереди, 30–90 сек.
        Требуется оплата (кроме первого бесплатного мини-разбора, который приходит вместе с картой).
        Идемпотентность: заголовок `Idempotency-Key` обязателен, TTL 24 ч.
      security: [{ TelegramInitData: [] }]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, maxLength: 64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReportRequest' }
      responses:
        '202':
          description: В очереди
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Report' }
        '402':
          description: Требуется оплата (PAYMENT_REQUIRED)

  /api/v1/reports/{report_id}:
    get:
      tags: [reports]
      summary: Статус и содержимое разбора
      security: [{ TelegramInitData: [] }]
      parameters:
        - name: report_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Report' }
        '404': { description: NOT_FOUND }

  /api/v1/engagement/forecast:
    get:
      tags: [engagement]
      summary: Прогноз на сегодня
      description: |
        Генерируется ночью пачкой и кэшируется по (chart_id, date).
        Бесплатный вариант — урезанный (is_paid=false), полный — для подписки.
        Никогда не генерируется в момент запроса.
      security: [{ TelegramInitData: [] }]
      parameters:
        - name: chart_id
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Forecast' }
        '404': { description: Прогноз ещё не готов }

  /api/v1/engagement/ask:
    post:
      tags: [engagement]
      summary: «Спроси карту» — вопрос по своей карте
      description: Квота 5/день для подписки, 1/день для бесплатных. Ответ опирается на позиции карты.
      security: [{ TelegramInitData: [] }]
      responses:
        '200':
          description: Ответ
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AskResponse' }
        '429':
          description: Квота исчерпана (QUOTA_EXCEEDED), заголовки RateLimit-*
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AskRequest' }

  /api/v1/billing/subscription:
    get:
      tags: [billing]
      summary: Состояние подписки
      security: [{ TelegramInitData: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubscriptionState' }

  /api/v1/billing/invoice:
    post:
      tags: [billing]
      summary: Создать инвойс в Stars
      description: |
        Для подписок передаётся subscription_period, для разовых — обычный инвойс.
        Ссылка открывается через Telegram.WebApp.openInvoice.
      security: [{ TelegramInitData: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InvoiceRequest' }
      responses:
        '201':
          description: Инвойс создан
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invoice' }
        '422':
          description: Неизвестный план или чужая карта (VALIDATION_FAILED / NOT_FOUND)
        '429':
          description: 'Слишком много инвойсов (антифрод): 3 в час, 10 в сутки — Problem.code = RATE_LIMITED'

  /api/v1/internal/telegram/webhook/{secret}:
    post:
      tags: [internal]
      summary: Вебхук Telegram Bot API
      description: |
        Принимает updates. Обязательные типы: pre_checkout_query, message.successful_payment,
        edited_message (не нужен), my_chat_member (не нужен).
        Доставка «at least once» — обработчик обязан быть идемпотентным по telegram_payment_charge_id.
        Секрет в пути + проверка заголовка X-Telegram-Bot-Api-Secret-Token.
      security: []
      parameters:
        - name: secret
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Принято }
        '403': { description: Неверный секрет }
        '500':
          description: |
            Временная ошибка (например, БД недоступна). Ответ не 2xx заставляет Telegram
            повторить доставку — обработчик идемпотентен по telegram_payment_charge_id.

  /api/v1/internal/jobs/run:
    post:
      tags: [internal]
      summary: Триггер воркеров (крон, защищён секретом)
      description: Запускает джобы — генерацию прогнозов на завтра, восстановление зависших разборов.
      security: []
      responses:
        '202': { description: Принято }

  /api/v1/admin/metrics:
    get:
      tags: [internal]
      summary: Метрики продукта
      description: |
        Доступ только для `ADMIN_TG_ID` из переменной окружения (иначе `403`).
        Без ПДн: только агрегаты.

        Воронка считается по `events.occurred_at` — клиентскому времени
        события, — поэтому опоздавший батч (`at` до суток назад) попадает в
        свой день, а не в день доставки. Окно — 30 дней, `occurred_at` не
        старше суток от серверного времени (см. `POST /events`).
      security: [{ TelegramInitData: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  mau: { type: integer }
                  paying: { type: integer }
                  conversion_to_paid: { type: number }
                  churn_30d: { type: number }
                  stars_received_30d: { type: integer }
                  llm_cost_usd_30d: { type: number }
                  reports_failed_30d: { type: integer }
                  events_30d:
                    type: object
                    description: |
                      Счётчики событий по именам за 30 дней; считается по
                      `events.occurred_at`. Нулевые имена не отдаются.
                    additionalProperties: { type: integer }
                    example: { app_open: 1280, chart_created: 412, payment_succeeded: 37 }
                  funnel_30d:
                    type: object
                    description: |
                      Воронка по `occurred_at`: сколько уникальных пользователей
                      дошло до шага.
                    properties:
                      app_open: { type: integer }
                      consent_accepted: { type: integer }
                      chart_created: { type: integer }
                      checkout_opened: { type: integer }
                      payment_succeeded: { type: integer }
        '403': { description: FORBIDDEN }

