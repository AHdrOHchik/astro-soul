openapi: 3.1.0
info:
  title: Astro Soul API
  version: 1.6.12
  description: |
    API мини-приложения «Разбор личности» (Telegram Mini App).
    Контракт — единственный источник правды. Любое поле, которого здесь нет,
    считается несуществующим: фронт не имеет права на него рассчитывать,
    бэк не имеет права его отдавать без обновления этого файла и версии.

    1.1.0 — `Chart.asc`, `Chart.mc` и `Chart.houses` могут быть `null`:
    при неизвестном времени рождения дома и Асцендент не рассчитываются
    (SPEC, раздел «Астро-движок»). Уточнены семантика `Aspect.a`/`Aspect.b`
    (ключи планет) и единицы `Chart.balances` (проценты).

    1.2.0 — `nullable: true` заменён на канонический для JSON Schema 2020-12
    вид `type: [X, 'null']` (в OpenAPI 3.1 ключ `nullable` не определён и
    игнорируется генераторами); добавлен код `CONFLICT` (409 при удалении
    профиля с незавершёнными платежами); добавлено `Chart.omitted_planets`
    (планеты, которые движок не смог рассчитать); в `/health` добавлено
    состояние астро-движка `astro`.

    1.2.1 — уточнения по отчёту фронта (PR #2):
      • `VALIDATION_FAILED` всегда 422 (400 в контракте не используется),
        `CONFLICT` — 409; у `VALIDATION_FAILED` есть `details.field_errors`
        `[{field, message}]`, чтобы фронт подсвечивал конкретное поле;
      • `message` в `Problem` — готовый текст на «ты», его можно показывать как есть;
        неизвестный маршрут тоже отдаёт `Problem` (`NOT_FOUND`, русский текст);
      • `POST /geo/resolve` всегда отвечает 200 и массивом (пустой массив =
        «города нет»); `GEO_NOT_FOUND` (503) — только когда недоступен сам
        провайдер геоданных; лимит маршрута — 120 запросов в минуту;
      • `POST /charts`: обязательные `consent {accepted, version}` и
        `time_precision` (exact | approximate | unknown), `Chart.birth.time_precision`
        в ответе, проверка 18+ и даты не раньше 1900 на сервере;
      • `GET /charts/{chart_id}` отвечает тем же конвертом, что и `POST /charts`:
        `{chart, mini_reading, wheel_url}`.

    1.3.0 — по отчёту фронта (PR #12) и решениям владельца продукта:
      • `POST /geo/resolve`: `query` — минимум 2 символа; короче — `422`
        `VALIDATION_FAILED` с `field_errors[{field: "query"}]`. Пустой массив
        означает только «города нет»;
      • `503 GEO_NOT_FOUND` описывает машинную причину в `details.reason`:
        `provider_timeout | provider_unavailable | not_configured`; текст ошибки
        больше не предлагает «ввести координаты вручную»;
      • возраст: 18 лет исполняется в 00:00 UTC дня рождения; для рождённых
        29 февраля в невисокосный год — 1 марта. Фронт повторяет это правило;
      • согласие принимается только в актуальной редакции (`CONSENT_VERSION`
        сервера, сейчас `2026-11-10`). Устаревшая версия — `422` с
        `field_errors[{field: "consent.version"}]`, по нему фронт сбрасывает галочку;
      • `POST /api/v1/events` — события продукта батчем до 20 штук, ответ `202`;
        список событий — `x-analytics-events`;
      • `GET /api/v1/charts/{chart_id}/wheel.png` — растр колеса для шаринга;
        в `ChartResponse` добавлен `wheel_png_url`;
      • колесо SVG больше не использует `<text>` и `font-family`: все подписи —
        векторные контуры, поэтому глифы планет рисуются в любом WebView.

    1.4.0 — единый конверт карты, предупреждения и «текущая карта»:
      • `ChartResponse` — один и тот же объект из `POST /charts` (201 и 200),
        `GET /charts/{chart_id}` и `GET /charts/current`:
        `{chart, mini_reading, warnings, wheel_url, wheel_png_url, is_restored}`.
        Никаких конвертов под конкретный метод;
      • `GET /api/v1/charts/current` — карта пользователя либо `404`
        (`NOT_FOUND`), по которому клиент уходит в онбординг. Ответ тот же
        `ChartResponse`, `is_restored: true`;
      • `POST /charts` отвечает `200`, когда такая карта уже есть (совпал хэш
        входа), и `201`, когда создана. В обоих случаях `is_restored` в теле
        говорит правду, поэтому клиент различает `chart_created` и
        `chart_restored` по телу ответа, а не по коду;
      • `ChartResponse.warnings` — обязательный массив верхнего уровня, `[]`
        допустим. Коды: `no_birth_time` (время неизвестно),
        `approximate_time` (время приблизительное), `approximate_place`
        (города нет в справочнике либо часовой пояс восстановлен по
        ближайшему крупному городу). Список расширяемый: неизвестные коды
        клиент пропускает. Карты, созданные до появления поля, отдают `[]`;
      • `GET /charts/{chart_id}/wheel.png` — `size=1080|1600`; любое другое
        значение — `422` (не подменяем размер молча);
      • `POST /geo/resolve`: `limit` вне 1…10 — `422`, а не обрезка до
        границы: клиент не должен получать другой ответ, чем просил;
      • `Me.entitlements` (`Entitlements`) и `Me.chart_id` — реальные значения,
        а не заглушки. Удаление профиля с незавершённым платежом по-прежнему
        `409 CONFLICT`;
      • запрещённые ключи в `props` событий перечислены в контракте
        (`x-events-forbidden-prop-keys`) и совпадают с кодом; `POST /events`
        отвечает `202 {accepted}`, где `accepted` может быть меньше размера
        батча — события с ПДн отбрасываются;
      • `x-bot.share_link_template` — ссылка шаринга на конкретную карту:
        `https://t.me/{username}?startapp=chart_{chart_id}`. Бот открывает
        мини-апп, а карта поднимается через `GET /charts/current`;
      • `GET /admin/metrics`: агрегаты по воронке считаются по
        `events.occurred_at` (клиентское время), а не по `created_at`.

    1.5.0 — промежуточная версия, в `main` не попадала; её правки целиком
    вошли в 1.5.1.

    1.5.1 — сведение ветвей контракта по итогам приёмки QA-001. Правки против
    1.4.0, ничего не удалено:
      • `ClientEvent.occurred_at` — каноническое имя клиентского времени (было
        `at`). Так поле называлось в БД, метриках и задании приёмки; теперь
        одно имя на всех слоях. Добавлено необязательное `ClientEvent.chart_id`;
      • `x-analytics-events` — объединение двух наборов имён: фронт вёл
        `onboarding_*`/`mini_reading_view`/`wheel_shared`/`checkout_started`,
        бэк — `consent_view`/`birth_date_done`/`screen_view`/`share_clicked`/
        `checkout_opened`. Оба набора приняты, пары зафиксированы в
        `x-event-aliases`, сведение в один набор — в 1.6.0;
      • `x-analytics-server-events` — события, которые пишет только сервер
        (`payment_rejected`, `refund_issued`, `subscription_expired`);
      • `Me` в `required`: `has_chart`, `chart_id`, `entitlements`,
        `onboarding_step` — по ним клиент уже решает, какой экран показать;
        добавлен `Me.latest_report_id`;
      • `ChartResponse.wheel_png_url` в `required`;
      • `GET /admin/metrics`: `payments_rejected_30d`, `amount_mismatch_30d`,
        `refunded_30d`, `pending_payments_now` — отказ по деньгам обязан быть
        виден в метриках, а не только в логах (QA-11);
      • `Problem.details`: `reason` (машинная причина), `quota_code`,
        `reset_at`; заголовок `X-Request-Id` обязателен и на ошибках разбора
        тела (QA-12b);
      • требования к коду, не выразимые схемой: `successful_payment` обязан
        сверять наличие инвойса, сумму и владельца; при отсутствии
        `subscription_expiration_date` продление идёт от текущего `expires_at`.

    1.5.2 — одна правка по решению владельца (итерация 8, вопрос 6):
      • `chart_id` обязателен в `POST /billing/invoice` для плана `one_149`.
        Раньше покупку без карты приходилось «прикреплять» к первой карте
        пользователя — скрытая привязка платного товара. Теперь такой инвойс
        не создаётся (`422`, `details.field_errors[{field: "chart_id"}]`),
        а `POST /reports` открывает разбор только по оплаченной карте.
        Покупки, сделанные до 1.5.2 без `chart_id`, разбор не открывают.

    1.5.3 — приёмка QA-002, блокер QA-15 (оплата после удаления данных) и три
    не-блокера. Ничего не удалено из схем, кроме имени метрики LLM:
      • `invoices.status` — три состояния: `created | paid | invalidated`.
        Переход `created → invalidated` делает `DELETE /me` в той же
        транзакции, что и удаление пользователя. `successful_payment` по
        `invalidated` инвойсу и по отсутствующему пользователю отклоняется:
        доступ не выдаётся, звёзды возвращаются автоматически
        (`refundStarPayment`), пишутся серверные события `payment_rejected`
        (`props.code = invoice_invalidated | user_deleted`) и `refund_issued`
        (`props.code` — та же причина). Если возврат технически не удался,
        платёж остаётся `rejected`, добавляется `payment_rejected`
        с `code = refund_failed` и он попадает в `pending_payments_now`;
      • `pre_checkout_query` по такому инвойсу отвечает `ok=false`
        с текстом «Оплата больше недоступна — начни заново»;
      • `GET /me` отдаёт `latest_report_id` всегда (`null` — разборов не было);
      • `GET /admin/metrics`: `llm_cost_usd_30d` заменён на `llm_cost_rub_30d`
        — стоимость считается в рублях по цене модели из той же таблицы, что
        и `LLM_MODEL`, а рядом в `reports` пишутся `llm_tokens_in/out`;
      • `x-analytics-server-events`: канонические имена совпадают с записью
        в `events`; `refund_issued` пишется всеми путями возврата.

    1.5.4 — удержание и карта оплаченного разбора:
      • `Entitlements.full_report_chart_id` (uuid, `null`) — за какую карту
        оплачен полный разбор. Поле отдаётся **всегда**, но в `required` его
        нет: старые клиенты его не знают и не ломаются, новые — не считают
        новую карту оплаченной. `full_report` не менялся;
      • `POST /engagement/ask`: описаны `422` (вопрос короче 3 или длиннее
        500 знаков) и `429` с `details.quota_code = ask_daily` и
        `details.reset_at` (местная полночь места рождения);
      • `GET /engagement/forecast` — только чтение кэша: `404`, если ночной
        джоб ещё не положил строку. Прогноз никогда не генерируется по запросу;
      • `POST /internal/jobs/run`: в `enum` добавлены `forecast_nightly` и
        `forecast_push` (и пропущенный ранее `refund_undelivered`), в
        `JobRunResult` — счётчики удержания `forecasts_*` и `pushes_*`.
        Это внутренний маршрут для крона, клиентских изменений не несёт.

    1.5.5 — удаление данных окончательное:
      • `DELETE /me` обнуляет `user_id` в `payments`, `subscriptions`,
        `entitlements` и `events` (схемы не менялись — это семантика маршрута).
        Раньше оставался `user_id`, а он детерминирован из `telegram_id`:
        вернувшийся человек получал старую подписку и права без платежа;
      • подписка при удалении переходит в `cancelled` (не `expired`), права — в
        `revoked`; `Me.subscription.is_active` и `Me.entitlements.full_report`
        после удаления всегда `false`.

    1.5.6 — отмена автопродления в Telegram и машинные причины 404:
      • `DELETE /me` отключает автопродление в Telegram вызовом
        `editUserStarSubscription(is_canceled: true)`. Раньше отменялась только
        локальная подписка, а Telegram продолжал списывать звёзды за следующий
        период уже после удаления данных: сервер такой платёж отклонял и
        возвращал, но «списали и вернули» — это обращение в поддержку, а не
        «не списали». Вызов идёт ДО транзакции удаления, его ошибка удаление не
        блокирует (152-ФЗ): неуспех повторяется ночным джобом, пока не истекло
        окно возврата (`subscriptions.telegram_cancel_state`);
      • `DELETE /me` идемпотентен: всегда `204`, в том числе когда удалять
        нечего. `404` не отдаётся никогда;
      • `GET /engagement/forecast`: `404` получил `details.reason` —
        `not_ready` (прогноза ещё нет) или `no_chart` (карты нет). Раньше оба
        смысла различались только текстом, и приложение после каждого `404`
        перечитывало `GET /me`. Полный текст отдаётся только при активном
        `full_forecast` **в момент чтения** кэша, а не генерации;
      • `POST /engagement/ask`: описан `404` с `details.reason = no_chart`.
        `402` на вопрос не описывается и не отдаётся: сервер так не отвечает;
      • `x-analytics-server-events`: добавлено `subscription_cancel_failed`
        (`props.code = telegram_error | timeout | no_charge_id`);
      • `GET /admin/metrics`: `subscription_cancel_failed_30d`,
        `subscriptions_cancelled_pending_telegram`;
      • `JobRunResult`: `telegram_cancel_retried`, `telegram_cancel_cancelled`,
        `telegram_cancel_gave_up` — повтор отмены идёт в
        `pdn_retention_cleanup`.

    1.5.7 — тестовый тариф для проверки настоящей оплаты (итерация 13). Схемы
    расширены одним полем; тестовый `plan_code` в контракт **не** добавлен:
      • `GET /admin/metrics`: `test_payments_30d` — платежи по тестовому тарифу
        за 30 дней. Денежные агрегаты (`stars_received_30d`,
        `payments_rejected_30d`, `amount_mismatch_30d`, `refunded_30d`,
        `pending_payments_now`), `paying` и `conversion_to_paid` тестовые
        платежи не учитывают;
      • `PlanCode` по-прежнему перечисляет только каталог: тариф `test_1`
        (1 ⭐, неделя) существует при `PAYMENTS_TEST_PLANS=1` и только для
        владельца — в каталоге пейволла и в этом перечислении его нет. При
        выключенном флаге `POST /billing/invoice` с `plan_code = test_1`
        отвечает `422 VALIDATION_FAILED`, как на несуществующий план;
      • `SubscriptionState.plan` не менялся: тестовая подписка отдаёт `month`
        (права как у `month_399`), «тестовость» живёт в `payments.is_test`.

    1.5.8 — второй тестовый тариф и защита от двойной покупки разбора:
      • `POST /billing/invoice` для плана-разбора (`one_149`) на карту, за
        которую разбор уже куплен, отвечает `422 VALIDATION_FAILED`
        (`details.reason = report_already_owned`, `field_errors[0].field =
        chart_id`). Раньше второй счёт выставлялся и вторые 149 ⭐ списывались
        за товар, который уже был у человека. Проверка не зависит от цены и от
        «тестового» признака тарифа — на 1 ⭐ она работает так же;
      • `successful_payment` по разовому товару больше не создаёт второй
        `entitlement` на ту же карту (вторая линия обороны для случая «два
        счёта выставлены до оплаты»); платёж при этом виден в `payments`;
      • тариф-разбор за 1 ⭐ (`test_report_1`) существует только при
        `PAYMENTS_TEST_PLANS=1` и в `PlanCode` не входит — как и `test_1`.

    1.5.9 — витрина как данные, а не как хардкод клиента (итерация 14):
      • новый `GET /billing/plans`: набор тарифов, цены, периоды, тексты и
        состав отдаёт сервер. Раньше список знал клиент
        (`apps/web/src/lib/plans.ts`), поэтому тестовый тариф нельзя было
        показать без правки фронта, а смена цены не меняла того, что видит
        человек, до релиза клиента. Ответ — `PlansResponse`;
      • тестовые тарифы (`test_1`, `test_report_1`) попадают в витрину
        **только** при `PAYMENTS_TEST_PLANS=1` и приходят с `test: true`.
        При выключенном флаге в ответе нет ни одного упоминания о них — не
        «серых», не «скрытых», никак;
      • `Cache-Control: no-store` на витрине: ответ зависит от флага, и
        закэшированный список пережил бы и включение, и выключение;
      • `PlanCode` **не** расширен: он остаётся закрытым перечислением
        каталога. В деньгах (`InvoiceRequest.plan_code`, `Invoice.plan_code`,
        `PlanOffer.plan_code`) используется `OrderablePlanCode` — строка,
        потому что набор кодов, который сервер принимает к оплате, зависит от
        окружения, а перечисление, зависящее от окружения, — не перечисление;
      • `GET /admin/metrics`: `test_plans_active` — включён ли флаг прямо
        сейчас. В `test_payments_30d` видно, что тестовые платежи были, а
        здесь — что тарифы включены и сейчас: «включил и забыл» на проде
        видно в первой же метрике, а не только в логе старта.

    1.5.10 — наблюдаемость разбора (итерация 17). Ничего не удалено:
      • `POST /reports`: описана ошибка `503 UPSTREAM_LLM` с
        `details.reason = report_breaker_open`, когда три разбора подряд
        упали на валидации текста и приём новых закрыт на 30 минут. Раньше
        такой ответ был возможен, но не был описан — а значит, для клиента
        его не существовало;
      • `GET /admin/metrics`: `reports_validation_streak`,
        `reports_breaker_open`, `reports_breaker_last_failed_at` — серия
        провалов валидации и состояние того же брейкера. Массовый провал
        обязан быть виден в метриках, а не только в логах;
      • `reports.error_code` (не в схеме ответа, а в БД) больше не один:
        коды провала текста — `too_short`, `too_long`, `format`,
        `forbidden_terms`, `paragraphs`, `repeats` вместо общего
        `validation`. Клиентских полей это не добавляет: `Report` не отдаёт
        `error_code`, и клиент по-прежнему видит только `status: failed`.

    1.5.11 — разбор больше не пропадает из-за формы текста (итерация 18).
      Ничего не удалено и не переименовано, добавлено два поля в `Report`:
      • `missing_sections` — главы, которых в разборе нет. Разбор может быть
        `ready` частичным: если не собрались одна-две главы (но живы минимум
        три и «Итог»), человек получает остальные, а в «Итоге» последним
        абзацем стоит предложение пересобрать разбор (это бесплатно) или
        написать в поддержку. `failed` остаётся за случаями, когда показывать
        почти нечего: меньше трёх глав или нет «Ядра»/«Итога»;
      • `warnings` — пометки по главам: нарушения формы и стиля, из-за
        которых глава раньше считалась проваленной (абзацы, объём, повторы,
        «вы» вместо «ты»), и правки нормализатора (`paragraphs_split`,
        `paragraphs_merged`, `trimmed`, `teaser_terms`, `disclaimer_added`).
        Показывать их пользователю не обязательно: это объяснение, почему
        текст выглядит неровно, а не требование к интерфейсу;
      • тексты глав теперь проходят детерминированную нормализацию **до**
        валидатора: абзацы делятся и склеиваются по границам предложений,
        перебор объёма обрезается по границе абзаца, дисклеймер в «Итоге»
        дописывается дословно, если модель его забыла. Смысл не меняется;
      • из-за этого `failed` по коду `paragraphs`/`too_long`/`repeats` в
        новых разборах не появляется: эти нарушения стали пометками.
        `too_short`, `format`, `forbidden_terms` по-прежнему роняют главу.

    1.5.12 — границы геопоиска задаёт сервер (итерация 21). Ничего не удалено;
      добавлено одно необязательное поле и уточнены статусы:
      • `Me.limits` — `{geo_min_query_length, geo_max_query_length}`. Раньше
        числа 2/120 лежали в `packages/shared/src/geo/limits.ts`, то есть
        уезжали и в клиент: поменять их можно было только выпуском новой
        версии мини-аппа, а клиентская копия расходилась с серверной. Теперь
        они — настройка сервера (`GEO_MIN_QUERY_LENGTH`, `GEO_MAX_QUERY_LENGTH`),
        а клиент узнаёт их из `GET /me`. Поле **необязательное**: клиент без
        него не блокирует ввод и полагается на `422` с `field_errors[0].field =
        query`. `VITE_*` для этого не заводились — второй источник правды;
      • `POST /geo/resolve`: `query.minLength/maxLength` больше не числа в
        контракте, а «настройка сервера, значения в `GET /me`». Иначе контракт
        врёт в первый же день, когда кто-то правит `.env`;
      • `limit` вне диапазона больше **не** `422`, а молча зажимается до
        `GEO_MAX_LIMIT`: клиент `limit` не передаёт, а отказ на подсказке ломал
        бы поиск. Не целое число — по-прежнему `422`;
      • `422` у `POST /geo/resolve` теперь несёт ещё и `details.reason =
        no_timezone`: город найден, но достоверного часового пояса у точки нет
        (явного пояса в ответе провайдера нет, а ближайший город справочника
        дальше 300 км). Раньше это был `503`, и клиент читал его как «сервис
        недоступен, повтори» — повторял запрос, который не мог пройти;
      • `503 GEO_NOT_FOUND` остаётся только за временными причинами:
        `provider_timeout | provider_unavailable | not_configured`.

    1.6.0 — совместимость с партнёром (синастрия), итерация 23. Ничего не
      удалено и не переименовано; добавлено три маршрута и их схемы:
      • `POST /compatibility` — заказ разбора пары. Доступ: разовая покупка
        `compat_249` (одна совместимость) либо подписка (одна в 30 дней,
        скользящее окно). Тело — `chart_id`, `relationship` из закрытого
        перечня и `partner` (дата, необязательное время, место). Свободного
        текста о партнёре в контракте нет и не будет: это ПДн третьего лица,
        и минимизация здесь — требование, а не настройка. Ответ `202
        {compatibility_id, status: "pending"}`;
      • `GET /compatibility/{id}` — `sections` (4 штуки: `clicks`, `friction`,
        `scenario`, `steps`), `warnings` из закрытого перечня кодов и
        `created_at`. Пока идёт сборка — `status: pending` и пустые `sections`;
      • `GET /compatibility` — история без текстов (`titles_only`) и остаток
        квоты `quota {kind, left, resets_at}`, где `kind` — `purchase`,
        `subscription` или `none`;
      • ошибки: `402` без права на совместимость (`details.reason =
        compat_not_paid`), `422` при исчерпанной квоте подписки
        (`compat_quota_exhausted` + `resets_at`) и при уже оплаченной, но не
        израсходованной покупке (`compat_already_owned`), `503` при закрытом
        брейкере совместимости (`compat_breaker_open` — отдельный от
        `report_breaker_open`, ни один не закрывает другой);
      • `compat_249` больше не «появится в ближайшие дни»: товар выпущен, и
        подписки обещают его как готовый. Состав тарифов и цены не менялись;
      • ПДн партнёра (дата, время, координаты, часовой пояс) не уходят ни в
        логи, ни в LLM: модель получает только `compatibility_facts` (углы,
        светила, баланс стихий), а в логах — `user_id`, `chart_id`,
        `compatibility_id` и `relationship`. `DELETE /me` удаляет заказы и
        данные партнёра в той же транзакции; срок хранения брошенных
        заказов — 24 месяца, тем же джобом, что и у разборов.

    1.6.1 — оплата доходит до конца (итерация 25). Схемы расширены, ни одно
      поле не удалено и не переименовано:
      • `GET /admin/metrics`: `pre_checkout_total_24h`,
        `pre_checkout_rejected_24h`, `pre_checkout_timeout_24h`,
        `successful_payment_total_24h`, `payment_failed_24h` — здоровье оплаты
        за сутки. Тридцать дней не отвечали на вопрос «сломалось сейчас или
        так было всегда»; пара `total`/`rejected` разделяет «Telegram не
        доставляет запросы» и «доставляет, но мы отказываем»;
      • `POST /billing/invoice`: новый `409 CONFLICT` с `details.reason =
        plan_period_unsupported` для тарифа-подписки с периодом, которого Bot
        API не принимает (звёздная подписка — только 30 дней). Раньше такой
        тариф доходил до Telegram и возвращался `502`, то есть «наша ошибка»
        вместо «этот тариф так не продаётся»;
      • поведение без изменения схем: API при старте сам сверяет адрес вебхука
        через `getWebhookInfo` и при расхождении регистрирует его заново
        (`TELEGRAM_WEBHOOK_AUTO=0` отключает), а `pre_checkout_query` теперь
        отвечается всегда и в пределах 10 секунд — включая исключения и
        таймауты обработчика. Для клиента это видно как исчезновение
        `502` на оплате и как «оплата не проходит» → «оплата проходит».

    1.6.2 — короткое название счёта и вебхук, который не умирает молча
      (итерация 26). Схемы расширены, ни одно поле не удалено и не
      переименовано:
      • `GET /billing/invoice`: `title` счёта берётся из отдельной колонки
        `invoice_title` (1–32 символа, `CHECK` в БД), а не из названия тарифа.
        Если у тарифа название счёта некорректно — `409 CONFLICT` с
        `details.reason = plan_invoice_title_invalid` вместо `502` от
        Telegram: наша ошибка данных больше не выглядит как отказ платёжной
        системы. Витрина (`paywall_title`) и название тарифа не изменились;
      • `GET /api/v1/health`: `telegram_webhook: ok|stale|unreachable` —
        состояние доставки `pre_checkout_query` по последней проверке;
      • `GET /admin/metrics`: `telegram_webhook_ok`,
        `telegram_webhook_checked_at` — те же данные для мониторинга. Ноль
        доставок при живых попытках оплаты виден как `unreachable`/`false`,
        а не только в логах;
      • поведение без изменения схем: тестовая подписка `test_1` — 30 дней
        (`subscription_period = 2592000`, как требует Bot API для звёздных
        подписок); раньше на стендах она оставалась недельной и не
        выставлялась вовсе.

    1.6.3 — длинный раздел совместимости обрезается, а не выбрасывается
      (итерация 27). Схемы не менялись: ни одного нового поля, кода или
      эндпоинта. Изменилось поведение внутри уже описанных кодов:
      • `POST /compatibilities` и `GET /compatibilities/{id}`: раздел длиннее
        верхней границы (`too_long`) больше не проваливает заказ. Текст
        обрезается по границе абзаца, затем предложения, затем слова — так,
        чтобы остаться в `[min, max]`; факт обрезки виден в `normalized`
        (`"trimmed"`). Раздел пропадает только на пустом или неразобранном
        ответе модели;
      • `Compatibility.error_code = too_short` теперь действительно значит
        «короче `min`». Раньше он же означал «длиннее `max`» (и живой прогон
        `541d56a4` упал на 1 423 знаках при максимуме 800). `too_long`
        остаётся в перечне для случая, когда обрезать некуда;
      • повторный вызов модели остаётся только для `too_short` и
        неразобранного ответа — один раз; на длину не ретраим;
      • `GET /admin/metrics`: `compat_sections_trimmed_24h`,
        `compat_sections_dropped_24h` — сколько разделов обрезано и сколько
        выброшено за сутки. Второе обязано быть близко к нулю.

    1.6.4 — `steps` собирается из пунктов, а не режется поперёк
      (итерация 28). Схемы не менялись: ни одного нового поля, кода или
      эндпоинта.
      • `steps` обрезается **только по пунктам**: каждый пункт ограничивается
        отдельно, подпись-дисклеймер прикрепляется последним абзацем и в
        обрезке не участвует. Второй живой прогон (`46d8b893`) падал потому,
        что общий триммер срезал третий пункт и заказ уходил в `failed`;
      • `steps` не выбрасывается из-за формы: два или четыре пункта принимаются
        с предупреждением, а не отказом. Раздел пропадает только на пустом или
        нераспарсенном ответе (нет ни одного пункта) либо на запрещённом
        содержании — вердикт о паре, процент совместимости, запрещённые темы;
      • длина `steps` — мягкий ориентир: если после поштучной обрезки объём
        вне 400–550, текст всё равно приходит человеку с `warnings`
        (`length_off`, `direction = above`), а не пропадает;
      • `warnings` может содержать `trimmed` и `length_off` для `steps`
        так же, как для остальных разделов.

    1.6.5 — отмена подписки из приложения (итерация 29). Аддитивно: новый
      маршрут и два поля в состоянии подписки, существующие не переименованы.
      • новый `POST /api/v1/subscription/cancel`: гасит автопродление
        (`editUserStarSubscription(is_canceled: true)`), доступ остаётся до
        конца оплаченного периода. `409` двух видов — `no_active_subscription`
        и `already_cancelled`; `502` с `details.reason` =
        `telegram_error | timeout | no_charge_id`. `Idempotency-Key`
        обязателен. До этого отменить автопродление из приложения было нельзя:
        кнопка вела на несуществующий `tg://settings/star_subscriptions`, и
        единственным способом не продлевать было удалить аккаунт;
      • `SubscriptionState.cancelled_at` — когда автопродление отключили
        (подтверждено Bot API), `null` — включено; поле приходит всегда.
        `SubscriptionState.auto_renew` теперь наше записываемое состояние, а
        не «только для чтения из настроек Telegram»: `false` значит «не
        продлится», и клиент по этим двум полям рисует кнопку «Отменить»;
      • `DELETE /me` не изменился: там по-прежнему удаляются данные, доступ
        закрывается сразу, а автопродление гасится тем же вызовом Bot API.

    1.6.6 — прогноз дня и «спроси карту» (итерация 30). Аддитивно: два новых
      маршрута и один вспомогательный, четыре схемы ответов; существующие поля
      не переименованы и не удалены.
      • новый `GET /api/v1/forecast/today` → `ForecastDay`: прогноз на местную
        дату места рождения. Факты (Луна на полдень, фаза, ретро-планеты,
        транзиты к Солнцу/Луне/Асценденту/MC, управитель дня, окна времени)
        считает Python-сайдкар детерминированно — один и тот же вход даёт
        побайтово одинаковый JSON; текст пишет модель, **один раз в сутки на
        человека**. Повтор в тот же день отдаёт сохранённое (`forecast_cache_hit`),
        маршрута перегенерации нет;
      • без действующей подписки модель не вызывается: `status = facts_only`,
        `sections` пустой, `facts {moon_sign, moon_phase, illumination}` — это
        `200`, а не `403`. `FORECAST_FREE_FACTS=0` выключает и это, тогда `403
        subscription_required`;
      • `503` при провале: `details.reason = forecast_failed |
        forecast_breaker_open`. Вчерашний текст и заглушка не отдаются никогда.
        Таймаут генерации 25 с; после провала или таймаута повтор — не чаще
        раза в 60 секунд на человека;
      • новый `POST /api/v1/questions` → `202 QuestionAccepted`, `GET
        /api/v1/questions` → `QuestionList`, `GET /api/v1/questions/{id}` →
        `Question`. Вопрос 10–300 знаков, ссылки запрещены, `Idempotency-Key`
        обязателен (тот же ключ → тот же `id`, без второго вызова модели).
        Разделы ответа: `answer` 150–300, `why` 250–400, `do` 150–250, всего
        550–950 знаков; обрезка по границе предложения, `warnings:
        [length_off]`, а `ungrounded` — если ответ не упомянул ни одной позиции
        карты;
      • отказ по теме детерминированный и **до** модели: медицина, юристы и
        налоги, кредиты и инвестиции, смерть и болезни, вопросы про третьих
        лиц, 18+. `status = refused`, `reason` из закрытого списка, квота не
        тратится, расход нулевой, текст постоянный (`message`);
      • `403` на вопросы: `subscription_required` (нет подписки) и
        `quota_exhausted` (+`details.quota` и `resets_at`). `429` с
        `details.reason = daily_cost_cap` — дневной потолок расходов на вопросы.
        `409 question_in_progress` — предыдущий вопрос ещё готовится;
      • `GET /admin/metrics`: `forecast_ready_24h`, `forecast_failed_24h`,
        `forecast_facts_only_24h`, `forecast_cache_hits_24h`,
        `forecast_cost_rub_24h`, `questions_ready_24h`, `questions_failed_24h`,
        `questions_refused_24h`, `questions_refused_by_reason`,
        `questions_cost_rub_24h`, `question_p95_ms`;
      • `x-analytics-server-events`: `forecast_ready`, `forecast_failed`,
        `forecast_facts_only`, `forecast_cache_hit`, `question_ready`,
        `question_refused`. Текст вопроса не попадает ни в события, ни в логи —
        только `question_hash`, `question_len` и `topic`.

    1.6.7 — неудачные записи не попадают в списки (итерация 30.3). Схемы не
      меняются, кроме одного нового счётчика в метриках; коды ошибок и статусы
      прежние.
      • `GET /compatibility` отдаёт только `ready` и собственные `pending`;
        `failed` (и `refunded`) в списке нет никогда — решение владельца:
        неудачная попытка это наша внутренняя история, а не товар. Фильтр в SQL
        до `LIMIT`, поэтому счётчики и пагинация, если появятся, считаются от
        того же набора;
      • `GET /compatibility/{id}` не изменился и возвращает запись в **любом**
        статусе: `failed` по `id` доступен воркеру, QA и разбору инцидентов;
      • `GET /questions` отдаёт `ready`, `refused` и `pending`; `failed` — не
        отдаётся. `refused` остаётся: это настоящий ответ карты, а не сбой.
        `GET /questions/{id}` по-прежнему возвращает любой статус;
      • неудача больше не стоит человеку попытки: провал генерации вопроса
        возвращает дневную квоту (`question_usage`), как это уже было у
        совместимости (право списывается только на `ready`);
      • `GET /admin/metrics`: `compat_failed_24h` — провалы совместимости за
        сутки. Вместе с `questions_failed_24h` он отвечает на вопрос «сколько
        падает», хотя в приложении этих записей больше не видно. Причина
        провала остаётся в логах `compat_failed` (`code`) и `question_failed`
        (`error_code`) — текст вопроса в лог не попадает, правило 1.6.6
        действует и на сбоях.

    1.6.8 — PDF разбора и карточки для шеринга (итерация 32). Всё аддитивно:
      существующие маршруты, поля и статусы не менялись.
      • `POST /reports/{report_id}/pdf` (`202`, обязательный `Idempotency-Key`)
        и `GET /reports/{report_id}/pdf` — новая схема `PdfStatus`
        (`status | url | expires_at | error`). PDF — часть **оплаченного**
        разбора: `403 report_not_paid`, `404`, `409 report_not_ready`.
        Ссылка подписанная, TTL 24 часа, выдаётся заново на каждый `GET`;
        прямых адресов хранилища в контракте нет;
      • новый публичный маршрут `GET /files/{scope}/{name}?sig=…` — приватные
        файлы (PDF и карточки) по подписи, `security: []`;
      • `POST /share/card` — новые схемы `ShareCard` и `ShareCardKind`
        (`day | wheel | insight`). Общих карточек нет: `kind: "compat"` —
        `404` с `details.reason = share_compat_not_available`;
      • пагинация списков: `GET /compatibility` и `GET /questions` получили
        `limit` (1…20) и `offset` и **обязательное** поле `total` — количество
        после фильтра и до `LIMIT`. Это аддитивное поле: старые клиенты его
        игнорируют;
      • `GET /admin/metrics`: `share_cards_created_24h` по видам карточек
        (1.6.12); `pdf_generated_24h`, `pdf_downloaded_24h`,
        `pdf_failed_24h`, `pdf_cost_rub_24h`, `pdf_build_p95_ms`;
      • `x-analytics-server-events`: `pdf_ready`, `pdf_failed`,
        `pdf_downloaded`, `share_card_opened`, `share_sent`. В событиях нет
        ПДн: у `share_*` только `kind` и канал, у `pdf_*` — размер, страницы и
        длительность;
      • в PDF и в карточках нет персональных данных: ни даты/времени/места
        рождения, ни координат, ни имени. EXIF в PNG не пишется вовсе.

    1.6.9 — события шеринга разведены (итерация 34), а `ShareCard` получил
    постоянную ссылку. Одно переименование, остальное аддитивно:
      • **переименовано серверное событие** `share_sent` → `share_card_created`:
        в 1.6.8 имя `share_sent` означало «карточка сгенерирована и закэширована»
        (его писал сервер на `POST /share/card`), то есть метрика «поделились»
        считала генерации, а не отправки. Теперь `share_card_created` — про
        картинку (`kind`, `bytes`, `build_ms`, `cached`), а отправку сообщает
        клиент. Данные за прошлые сутки под старым именем не пересчитываются:
        счётчик «создано карточек» начинается заново, объём данных на тестовом
        этапе ничтожен;
      • **новое клиентское событие** `share_sent` (`x-analytics-events`):
        `props` закрыты — `{kind: day | wheel | insight, channel: inline | link}`
        (`x-event-strict-props`). Человек нажал «Поделиться» и карточка ушла в
        чат: единственный источник этого факта — сам клиент, сервер отправку не
        видит. Неизвестный `kind`/`channel` или отсутствие поля — `422` с
        `field_errors[{field: "events.props.<ключ>"}]`, лишние ключи
        вырезаются. Список событий остаётся закрытым;
      • `ShareCard.share_url` — `https://t.me/<bot>?start=sh_<short_id>`, полная
        ссылка в бота, собранная на сервере из `BOT_USERNAME`. Сроком не
        ограничена (подпись на файл бот выпускает сам при открытии) и **не
        является ссылкой на файл**: файловый `url` остаётся приватным и в
        шеринг не попадает. `null` — имя бота на сервере не настроено;
      • обработчик `inline_query`: бот отвечает карточкой на inline-запрос
        (`switchInlineQuery` работает только при включённом в BotFather
        inline-режиме; состояние проверяется при старте API по
        `getMe().supports_inline_queries` и пишется в лог
        `telegram_inline_mode`). Событий продукта на inline нет: это показ
        карточки, а не отправка.

    1.6.12 — три карточки сторис для соцсетей (итерация 37). Аддитивно;
    `wheel` и `insight` не менялись:
      • `ShareCardKind` += `identity`, `moon`; `day` переехал на общий шаблон
        сторис (безопасная зона `250…1670`, имя продукта `BRAND_NAME`,
        дисклеймер и подсказка для поиска внутри картинки). Нет `BRAND_NAME` —
        `503 brand_name_missing`: имя продукта не подставляется по умолчанию;
      • `identity` — три фразы о поведении из «Ядра» оплаченного разбора и
        приглашение «Узнал себя? Спроси, что про тебя». Текст режется из
        готового разбора по правилам, без модели: один разбор — одна карточка.
        Меньше трёх фраз — `422 not_enough_identity_lines`;
      • `moon` — знак, фаза, освещённость, дата и строка «чего лучше не
        начинать» по фазе (константы). Карта и подписка не нужны: факты
        считаются на полдень дня в поясе из `tz` (или поясе карты, иначе UTC)
        без натальных транзитов. Неизвестный `tz` — `422 share_tz_unknown`;
      • версия вёрстки входит в ключ кэша карточек: после смены шаблона старые
        карточки не отдаются;
      • `share_card_created` получил `template_version`;
      • клиентское событие `share_saved` (`{kind, target}`,
        `target: gallery | telegram_story`), `share_sent.kind` расширен на
        `identity` и `moon` — иначе клиент получал бы `422` на шаринг новых
        карточек;
      • `/admin/metrics`: `share_cards_created_24h` по видам.

    1.6.11 — наблюдаемость и эксплуатационная готовность (итерация 36).
    Аддитивно, `required` нигде не тронут; версия поднята потому, что появились
    новые маршруты, а не только поля:
      • `GET /health` — `flags: {test_plans, report_breaker}` и `checked_at`;
        `status: degraded` теперь включает `telegram_webhook != ok`, код
        `200` при `degraded` и `503` только при `db: down`;
      • `GET /admin/alerts` (`AlertsResponse`, `Alert`) — шесть правил с
        `{id, level, value, threshold, since, fired}` для внешнего мониторинга;
        ничего нового не хранится, значения считаются из тех же данных, что
        `/admin/metrics`;
      • `Me.notifications` (`Notifications`) — `{daily_forecast: boolean}`,
        не в `required`; `POST /me/notifications` сохраняет согласие целиком
        (пропущенное поле — `422`, а не «оставить как было»). Сам пуш появится
        в итерации 37;
      • `/admin/metrics.compat_cost_rub_24h` — стоимость совместимостей за
        сутки, третий источник трат LLM для алерта `llm_spend`.

    1.6.10 — возможность шаринга в `GET /me` (итерация 35). Аддитивно и без
    изменений в существующих полях:
      • `Me.share` (`ShareCapability`) — `{link: boolean, inline: "on" | "off" |
        "unknown"}`. Раньше клиент узнавал, что ссылки нет, **только создав
        карточку** (`share_url` приходит в ответе `POST /share/card`), и первый
        тап «Поделиться» ничего не открывал, а кнопка исчезала. `link` — тот же
        признак, что делает `ShareCard.share_url` не-`null`; `inline` —
        последнее известное `getMe().supports_inline_queries` (`unknown` —
        проверки не было, это не «выключено»);
      • `link: false` → клиент не рисует кнопку шаринга и не зовёт
        `POST /share/card`; `inline: "on"` → `switchInlineQuery`, `off` /
        `unknown` → `openTelegramLink(share_url)`;
      • отдельного маршрута `/share/capabilities` нет: `GET /me` уже вызывается
        на старте. `share` и его поля **не** в `required` — первый шаг
        аддитивный, старые клиенты поле игнорируют;
      • состояние inline не кэшируется дольше жизни процесса: `/setinline`
        меняет ответ Bot API в любой момент, следующий старт API его подхватит.

    Аутентификация: каждый запрос из мини-аппа передаёт заголовок
    `X-Telegram-Init-Data` с сырой строкой `Telegram.WebApp.initData`.
    Сервер валидирует подпись HMAC-SHA256 по ключу бота и проверяет auth_date (<= 24 ч).
    Других способов авторизации нет (никаких JWT в localStorage — их нельзя защитить).
servers:
  - url: https://api.astro-soul.example.com
    description: production
  - url: http://localhost:8080
    description: local

tags:
  - name: system
  - name: profile
  - name: charts
  - name: reports
  - name: compatibility
  - name: engagement
  - name: billing
  - name: internal

components:
  securitySchemes:
    TelegramInitData:
      type: apiKey
      in: header
      name: X-Telegram-Init-Data
      description: Сырая строка initData из Telegram.WebApp

  headers:
    X-Request-Id:
      schema: { type: string }
      description: |
        Тот же идентификатор, что в `Problem.request_id`. Сервер отдаёт его на
        любом ответе, включая ошибку разбора тела (битый JSON): без него
        поддержка не найдёт запрос в логах.
    RateLimit-Remaining:
      schema: { type: integer }
      description: Остаток квоты в текущем окне
    RateLimit-Reset:
      schema: { type: integer }
      description: Unix-время сброса окна

  schemas:
    FieldError:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
          description: Имя поля из запроса (birth_date, birth_time, birth_place, consent, plan_code)
          example: birth_date
        message:
          type: string
          description: Короткий текст ошибки для этого поля (ru, на «ты»)
          example: Дата рождения должна быть в прошлом

    Problem:
      type: object
      required: [code, message, request_id]
      description: |
        Единый формат ошибок, `application/problem+json`.

        Соответствие кода и статуса жёсткое: `VALIDATION_FAILED` — **всегда 422**
        (400 в API не используется), `CONFLICT` — 409, `UNAUTHORIZED` — 401,
        `FORBIDDEN` — 403, `NOT_FOUND` — 404, `RATE_LIMITED` — 429,
        `INTERNAL`/`GEO_NOT_FOUND`/`UPSTREAM_LLM` — 503/502.

        `message` — готовый текст для экрана, обращение на «ты». Фронт может
        показывать его без переписывания. Неизвестный маршрут тоже возвращает
        `Problem` (`NOT_FOUND`, «Такой страницы нет. Обнови приложение»),
        а не текст фреймворка.
      properties:
        code:
          type: string
          enum: [UNAUTHORIZED, FORBIDDEN, NOT_FOUND, CONFLICT, VALIDATION_FAILED, QUOTA_EXCEEDED, PAYMENT_REQUIRED, RATE_LIMITED, INTERNAL, UPSTREAM_LLM, GEO_NOT_FOUND]
        message: { type: string, description: Готовый текст для показа пользователю (ru, на «ты») }
        request_id: { type: string, description: Для поиска в логах }
        details:
          type: object
          additionalProperties: true
          properties:
            field_errors:
              type: array
              description: |
                Заполняется для `VALIDATION_FAILED`: список полей с ошибками.
                Порядок отражает порядок проверки, дубликатов по `field` нет.
              items: { $ref: '#/components/schemas/FieldError' }
            reason:
              type: string
              description: |
                Машинная причина, когда одного `code` мало: `signature_mismatch`,
                `auth_date_too_old`, `empty` (нет заголовка авторизации),
                `provider_timeout | provider_unavailable | not_configured` (гео),
                `no_invoice | amount_mismatch | unknown_plan` (платёж).
                Незнакомое значение клиент игнорирует.
            quota_code:
              type: string
              description: Квота, в которую упёрлись (`QUOTA_EXCEEDED`)
            reset_at:
              type: string
              format: date-time
              description: Когда квота обнулится (`QUOTA_EXCEEDED`)

    SubscriptionState:
      type: object
      required: [plan, is_active, expires_at, auto_renew]
      properties:
        plan:
          type: string
          enum: [none, trial, week, month, year]
        is_active: { type: boolean }
        expires_at:
          type: [string, 'null']
          format: date-time
        auto_renew:
          type: boolean
          description: |
            Продлится ли подписка автоматически. `false` — автопродление
            отключено (`POST /subscription/cancel`) либо удалением аккаунта;
            доступ при этом живёт до `expires_at`.
        cancelled_at:
          type: [string, 'null']
          format: date-time
          description: |
            Когда автопродление отключили и Telegram это подтвердил. `null` —
            автопродление включено. Поле есть всегда (1.6.5), в `required` не
            включено, чтобы не ломать уже собранный клиент.
        stars_paid_total:
          type: integer
          description: Сколько звёзд пользователь заплатил суммарно

    SubscriptionCancelResult:
      type: object
      required: [status, auto_renew, current_period_end]
      properties:
        status: { type: string, enum: [cancelled] }
        auto_renew: { type: boolean, enum: [false] }
        current_period_end:
          type: string
          format: date-time
          description: |
            Доступ сохраняется до этого момента (равен `expires_at` строки
            подписки и `SubscriptionState.expires_at`).

    Quota:
      type: object
      required: [code, used, limit, reset_at]
      properties:
        code:
          type: string
          enum: [forecast_daily, ask_daily, report_month, compat_month]
        used: { type: integer }
        limit: { type: integer, description: -1 = безлимит }
        reset_at: { type: string, format: date-time }

    Me:
      type: object
      required:
        [user_id, is_new, has_profile, has_chart, chart_id, subscription,
         entitlements, quotas, onboarding_step]
      properties:
        user_id: { type: string, description: Внутренний UUID, не telegram_id }
        display_name: { type: [string, 'null'] }
        is_new: { type: boolean }
        has_profile: { type: boolean }
        has_chart: { type: boolean }
        chart_id:
          type: [string, 'null']
          format: uuid
          description: |
            Карта пользователя для `GET /charts/{chart_id}` и `/charts/current`.
            `null`, пока карты нет. Сервер возвращает поле всегда; в `required`
            не включено, чтобы не ломать уже собранный клиент.
        latest_report_id:
          type: [string, 'null']
          format: uuid
          description: |
            Последний заказанный разбор (готовый или в работе) — чтобы клиент
            показал «открыть разбор» без отдельного запроса. `null`, если
            разборов не было.
        subscription: { $ref: '#/components/schemas/SubscriptionState' }
        entitlements: { $ref: '#/components/schemas/Entitlements' }
        quotas:
          type: array
          items: { $ref: '#/components/schemas/Quota' }
        onboarding_step:
          type: string
          enum: [birth_date, birth_time, birth_place, done]
        limits:
          type: object
          description: |
            Границы предпроверки ввода, которые знает сервер (1.5.12). Клиент
            берёт их отсюда и не хранит свою копию: копия разошлась бы с
            серверной, и человек получал бы `422` на длине, которую интерфейс
            считает допустимой. Поле **необязательное**: клиент без него не
            блокирует ввод и полагается на `422` с `field_errors[0].field = query`.
          required: [geo_min_query_length, geo_max_query_length]
          properties:
            geo_min_query_length:
              type: integer
              example: 2
              description: Минимальная длина `query` в `POST /geo/resolve`
            geo_max_query_length:
              type: integer
              example: 120
              description: Максимальная длина `query` в `POST /geo/resolve`
        share:
          $ref: '#/components/schemas/ShareCapability'
        notifications:
          $ref: '#/components/schemas/Notifications'

    Notifications:
      type: object
      description: |-
        Согласия на уведомления (контракт 1.6.11).
        Возвращается и в `Me.notifications`, и в ответе
        `POST /me/notifications` — одной формы, чтобы клиент не разбирал два
        разных объекта.

        Сейчас флаг один: `daily_forecast` — ежедневный пуш в 08:00 по местному
        времени. Сам пуш появится в итерации 37; поле и маршрут уже есть, чтобы
        клиент успел нарисовать переключатель и не мигал «сохранено», когда
        сервер ещё ничего не хранит. Отказ **не** отключает генерацию прогноза:
        прогноз как обычно открывается в приложении.
      properties:
        daily_forecast:
          type: boolean
          description: |
            `true` — присылать пуш в 08:00 по местному времени. Значение по
            умолчанию для нового пользователя — `true`.
      required: [daily_forecast]

    AlertsResponse:
      type: object
      description: |-
        Ответ `GET /admin/alerts` (контракт 1.6.11). Правила описаны в
        одноимённом маршруте: здесь только форма.
      properties:
        alerts:
          type: array
          items: { $ref: '#/components/schemas/Alert' }
        checked_at:
          type: string
          format: date-time

    Alert:
      type: object
      required: [id, level, value, threshold, since, fired]
      properties:
        id:
          type: string
          enum:
            [payment_not_arriving, telegram_webhook, subscription_cancel_blocked,
             llm_spend, generations_failing, backup_stale]
          description: |
            Идентификатор правила — по нему настраивается мониторинг. Новый
            алерт добавляется здесь и в `AlertsService` одним PR.
        level:
          type: string
          enum: [critical, warning]
          description: |
            `critical` — человек уже пострадал или пострадает без
            вмешательства (оплата, вебхук, отмена подписки). `warning` — деньги
            или качество ухудшаются, но ответ пользователю ещё нормальный.
        value:
          type: [number, 'null']
          description: |
            Текущее значение в единицах правила (штуки, минуты, рубли, часы).
            `null` — значение неизвестно: не было проверки вебхука или нет
            маркера последнего бэкапа.
        threshold:
          type: number
          description: Порог, выше которого алерт срабатывает.
          example: 10
        since:
          type: [string, 'null']
          format: date-time
          description: |
            Когда условие начало выполняться. Для счётчиков (`payment_not_arriving`,
            `subscription_cancel_blocked`, `llm_spend`, `generations_failing`) —
            момент, когда накопленная сумма в окне превысила порог: это и есть
            «когда стало плохо», а не первая строка в окне. Для
            `telegram_webhook` — момент последней неуспешной проверки (даже если
            10 минут ещё не прошли: видно, сколько осталось). Для
            `backup_stale` — «последний успех + 36 часов». `null` — условие не
            выполняется. Истории превышений нет: всё пересчитывается по тем же
            данным, что и метрики.
        fired:
          type: boolean
          description: |
            Сработал ли алерт сейчас. Для `telegram_webhook` — «не в порядке
            дольше порога»; для `backup_stale` — «старше порога **или** маркера
            нет» (отсутствие маркера тоже срабатывание: молчание не равно
            «всё хорошо»).

    ShareCapability:
      type: object
      description: |-
        Что клиент может сделать с шарингом — **до** создания карточки
        (`Me.share`, контракт 1.6.10).

        Зачем это поле. `ShareCard.share_url` приходит только в ответе
        `POST /share/card`, то есть клиент узнавал, что ссылки нет, лишь
        создав карточку: первый тап «Поделиться» ничего не открывал, а кнопка
        исчезала после ошибки. Здесь те же два факта есть на старте — из того
        же `GET /me`, который клиент и так вызывает.

        Поля **не** в `required`: первый шаг аддитивный, старый клиент их
        игнорирует и работает как раньше (создаёт карточку и смотрит на
        `share_url`).
      properties:
        link:
          type: boolean
          description: |-
            Имя бота на сервере настроено — `ShareCard.share_url` будет не
            `null`. `false`: fallback-ссылки нет, клиент **не рисует** кнопку
            шаринга и не зовёт `POST /share/card` (карточку некуда отправить).
        inline:
          type: string
          enum: [on, off, unknown]
          description: |-
            Последнее известное `getMe().supports_inline_queries`. `on` —
            клиент предпочитает `switchInlineQuery` (карточку в чат присылает
            бот); `off` и `unknown` — `openTelegramLink(share_url)`.

            `unknown` — не «выключено»: проверка не проходила (API только
            поднялся) или Bot API не ответил. Состояние меняется в BotFather
            (`/setinline`) и проверяется при старте API, поэтому кэшировать его
            на клиенте дольше сессии нельзя.

    Entitlements:
      type: object
      description: |
        Права доступа (`Me.entitlements`). Источник правды —
        `getEntitlements(userId)` на сервере (payments.md §4); клиент по этим
        флагам только рисует интерфейс и никогда не решает доступ сам.
      required:
        [is_active, plan, full_forecast, ask_per_day, full_report, compat_per_month, solar_included]
      properties:
        is_active:
          type: boolean
          description: Подписка действует прямо сейчас
        plan:
          type: string
          enum: [none, trial, week, month, year]
        full_forecast: { type: boolean }
        ask_per_day:
          type: integer
          description: 'Вопросов «спроси карту» в день: 0 / 1 / 5 / -1 (без лимита)'
          enum: [0, 1, 5, -1]
        full_report:
          type: boolean
          description: Куплен ли полный разбор (разово, навсегда для карты)
        full_report_chart_id:
          type: [string, 'null']
          format: uuid
          description: |
            Карта, за которую оплачен полный разбор; `null` — оплаченного нет.
            Производное от `full_report`: флаг остаётся «у пользователя есть
            оплаченный разбор», а привязка к карте — здесь. Сервер отдаёт
            поле **всегда**; в `required` его нет (nullable), но клиент вправе
            рассчитывать на его присутствие (1.5.4).
        compat_per_month: { type: integer }
        solar_included: { type: boolean }

    GeoPlace:
      type: object
      required: [name, country, lat, lon, tz]
      properties:
        name: { type: string, example: Москва }
        region: { type: [string, 'null'] }
        country: { type: string, example: RU }
        lat: { type: number, example: 55.7558 }
        lon: { type: number, example: 37.6173 }
        tz: { type: string, example: Europe/Moscow }

    PlanetPosition:
      type: object
      required: [key, name, sign, degree, minute, retrograde]
      properties:
        key: { type: string, enum: [sun, moon, mercury, venus, mars, jupiter, saturn, uranus, neptune, pluto, chiron, node] }
        name: { type: string, example: Солнце }
        sign: { type: string, example: Телец }
        degree: { type: integer, example: 26 }
        minute: { type: integer, example: 17 }
        house: { type: [integer, 'null'], minimum: 1, maximum: 12 }
        retrograde: { type: boolean }

    Aspect:
      type: object
      required: [a, b, type, orb]
      properties:
        a: { type: string, description: 'ключ планеты из PlanetPosition.key' }
        b: { type: string, description: 'ключ планеты из PlanetPosition.key' }
        type: { type: string, enum: [conjunction, opposition, trine, square, sextile] }
        orb: { type: number, example: 0.41 }
        strength: { type: number, minimum: 0, maximum: 1 }

    ChartResponse:
      type: object
      description: |
        Единый конверт карты (1.4.0). Один и тот же объект отдают
        `POST /charts` (201 и 200), `GET /charts/{chart_id}` и
        `GET /charts/current` — никаких отдельных конвертов под метод.
      required: [chart, mini_reading, warnings, wheel_url, wheel_png_url, is_restored]
      properties:
        chart: { $ref: '#/components/schemas/Chart' }
        is_restored:
          type: boolean
          description: |
            `true` — карта уже существовала и отдана из хранилища,
            `false` — рассчитана и сохранена этим запросом. Свойство тела,
            а не кода ответа: на него опираются события `chart_created` и
            `chart_restored`.
          example: true
        warnings:
          type: array
          description: |
            Предупреждения о качестве входных данных. Массив обязателен,
            пустой допустим.

            Коды: `no_birth_time` — время рождения неизвестно;
            `approximate_time` — время известно приблизительно;
            `approximate_place` — города не было в справочнике либо часовой
            пояс восстановлен по ближайшему крупному городу.

            Список расширяемый: незнакомый клиенту код он пропускает и не
            ломает экран. Карты, созданные до 1.4.0, отдают `[]`.
          items:
            type: string
            enum: [no_birth_time, approximate_time, approximate_place]
            x-extensible-enum: true
          example: [no_birth_time]
        mini_reading:
          type: object
          required: [sun, moon, asc, summary]
          properties:
            sun: { type: string, example: 'Солнце в Телец, 26°17′' }
            moon: { type: string, example: 'Луна в Лев, 12°38′' }
            asc: { type: string, example: 'Асцендент в Дева, 15°03′' }
            summary: { type: string, example: 'Солнце в Телец, 26°17′ · Луна в Лев, 12°38′' }
        wheel_url:
          type: string
          description: |
            Относительный путь к SVG-колесу с подписью: `/api/v1/charts/{chart_id}/wheel.svg?sig=...`.
            Маршрут публичный (security: []), initData не нужен — можно вставлять в `<img>`.
          example: /api/v1/charts/0f1c.../wheel.svg?sig=1767225600.abc123
        wheel_png_url:
          type: string
          description: |
            Относительный путь к PNG-колесу с той же подписью: `/api/v1/charts/{chart_id}/wheel.png?sig=...`.
            Нужен для шаринга: в чат уходит картинка, а не ссылка на SVG.
            Маршрут публичный (`security: []`), размер по умолчанию 1080 px по ширине.

            Поле новое в 1.3.0 и **необязательное для чтения**: сервер возвращает его
            всегда, но клиент может его не читать, пока не делает шаринг картинкой.
            Так поле можно ввести, не ломая уже собранный фронт.
          example: /api/v1/charts/0f1c.../wheel.png?sig=1767225600.abc123

    ForecastSection:
      type: object
      required: [key, title, body]
      properties:
        key:
          type: string
          enum: [summary, easier, careful, step]
        title:
          type: string
          description: |
            Заголовок с сервера. Клиент не хардкодит названия разделов: правка
            текста иначе требовала бы релиза приложения.
          example: Где будет легче
        body:
          type: string
          description: |
            Текст раздела, обрезанный по границе предложения. Объёмы: summary
            120–200, easier и careful 300–450, step 200–300 знаков.

    ForecastDay:
      type: object
      description: |
        Прогноз дня (1.6.6). Один и тот же конверт для полного прогноза и для
        бесплатного экрана фактов: разница в `status`, `access` и `sections`.
      required: [date, timezone, status, access, sections, chars, warnings, disclaimer]
      properties:
        date:
          type: string
          format: date
          description: Местная дата места рождения (`YYYY-MM-DD`), не серверная.
        timezone:
          type: string
          description: Часовой пояс места рождения из профиля.
          example: Europe/Moscow
        status:
          type: string
          enum: [ready, facts_only]
          description: |
            `ready` — полный прогноз; `facts_only` — подписки нет, показаны
            только факты (модель не вызывалась).
        access:
          type: string
          enum: [subscription, facts_only]
        sections:
          type: array
          description: Пустой массив при `status = facts_only`.
          items: { $ref: '#/components/schemas/ForecastSection' }
        chars:
          type: integer
          description: |
            Сумма знаков в `sections`. Полный прогноз — 900–1400 без подписи;
            вне диапазона сервер отдаёт текст и `warnings: ["length_off"]`.
        warnings:
          type: array
          description: |
            `length_off` — раздел пришлось обрезать или текст не уложился в
            общий объём. Текст всё равно отдаётся: человеку он полезен.
          items: { type: string, enum: [length_off] }
        generated_at:
          type: [string, 'null']
          format: date-time
          description: Когда текст был сгенерирован (`null` для `facts_only`).
        facts:
          type: [object, 'null']
          description: |
            Только при `status = facts_only`: три детерминированных факта от
            сайдкара. В полном прогнозе `null`.
          properties:
            moon_sign: { type: string, example: Овен }
            moon_phase: { type: string, example: растущая }
            illumination:
              type: number
              minimum: 0
              maximum: 1
              description: Освещённость Луны на полдень, доля от 1.
        disclaimer:
          type: string
          description: |
            Подпись-дисклеймер. Одна константа на весь продукт: приходит с
            сервера, чтобы текст можно было править без релиза фронта.

    QuestionSection:
      type: object
      required: [key, title, body]
      properties:
        key:
          type: string
          enum: [answer, why, do]
        title: { type: string, example: Почему }
        body:
          type: string
          description: |
            Объёмы: answer 150–300, why 250–400, do 150–250 знаков; всего
            550–950. Обрезка — только по границе предложения.

    QuestionQuota:
      type: object
      required: [used, limit, resets_at]
      properties:
        used: { type: integer, minimum: 0 }
        limit:
          type: integer
          description: "`QUESTION_DAILY_LIMIT` из окружения (3 по умолчанию)."
        resets_at:
          type: string
          format: date-time
          description: Местная полночь места рождения — когда лимит обновится.

    QuestionAccepted:
      type: object
      required: [id, status, quota]
      properties:
        id: { type: string, format: uuid }
        status:
          type: string
          enum: [pending, refused]
          description: |
            `pending` — ответ готовится; `refused` — отказ по теме, он виден
            сразу (строка уже создана, `GET /questions/{id}` отдаст текст).
        quota: { $ref: '#/components/schemas/QuestionQuota' }

    Question:
      type: object
      required: [id, status, question, sections, chars, warnings, topic, created_at, disclaimer, quota]
      properties:
        id: { type: string, format: uuid }
        status:
          type: string
          enum: [pending, ready, failed, refused]
        question:
          type: string
          description: |
            Текст вопроса возвращается **только владельцу**: он хранится до
            удаления аккаунта и не пишется ни в логи, ни в аналитику (там
            `question_hash`, длина и тема).
        sections:
          type: array
          description: Пустой массив при `pending`, `failed` и `refused`.
          items: { $ref: '#/components/schemas/QuestionSection' }
        chars: { type: integer }
        warnings:
          type: array
          description: |
            `length_off` — обрезано по границе предложения; `ungrounded` —
            ответ не упомянул ни одной позиции карты. Второй случай не
            выбрасывается: текст полезен, но помечен.
          items: { type: string, enum: [length_off, ungrounded] }
        reason:
          type: [string, 'null']
          description: |
            Для `refused` — из закрытого списка: `medical`, `legal`, `money`,
            `death`, `third_party`, `adult`. Для `failed` — код сбоя.
        topic:
          type: string
          enum: [love, career, money, self, health, other]
          description: |
            Грубая тема вопроса для аналитики: в событиях вместо текста
            попадает она, `question_hash` и длина.
        message:
          type: [string, 'null']
          description: Текст отказа при `status = refused` (постоянный, не от модели).
        created_at: { type: string, format: date-time }
        disclaimer: { type: string }
        quota: { $ref: '#/components/schemas/QuestionQuota' }

    QuestionList:
      type: object
      # `total`, `limit`, `offset` — новые в 1.6.8 и **не** в `required`
      # намеренно: сервер отдаёт их всегда (это проверено тестом), но
      # обязательными в схеме они сломали бы клиентов и фикстуры, которые
      # собирают `{items, quota}` руками. Поле, которого нет в старой фикстуре,
      # не должно превращаться в ошибку компиляции фронта.
      required: [items, quota]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Question' }
        quota: { $ref: '#/components/schemas/QuestionQuota' }
        total:
          type: integer
          minimum: 0
          description: |1-
            Сколько записей всего — **после фильтра и до `LIMIT`**. Считается
            отдельным запросом, поэтому не зависит от `offset`: на последней
            странице `total` больше `items.length`, а не ноль.
        limit: { type: integer, minimum: 1, maximum: 20 }
        offset: { type: integer, minimum: 0 }

    Chart:
      type: object
      required: [chart_id, created_at, birth, asc, mc, planets, houses, aspects, balances]
      properties:
        chart_id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        birth:
          type: object
          properties:
            date: { type: string, format: date }
            time: { type: [string, 'null'], description: "null, если время неизвестно" }
            time_known: { type: boolean }
            time_precision:
              type: string
              enum: [exact, approximate, unknown]
              description: Точность времени, с которой карта построена (эхо `ChartCreateRequest.time_precision`)
            place: { $ref: '#/components/schemas/GeoPlace' }
        asc:
          type: [object, 'null']
          description: null, если время рождения неизвестно (time_known = false)
          properties:
            sign: { type: string }
            degree: { type: integer }
            minute: { type: integer }
        mc:
          type: [object, 'null']
          description: null, если время рождения неизвестно (time_known = false)
          properties:
            sign: { type: string }
            degree: { type: integer }
            minute: { type: integer }
        planets:
          type: array
          items: { $ref: '#/components/schemas/PlanetPosition' }
        houses:
          type: [array, 'null']
          description: 12 куспидов, начиная с 1-го дома; null, если время рождения неизвестно
          items:
            type: object
            properties:
              house: { type: integer }
              sign: { type: string }
              degree: { type: integer }
        aspects:
          type: array
          items: { $ref: '#/components/schemas/Aspect' }
        balances:
          type: object
          description: Доли в процентах, сумма по каждой группе ≈ 100 (округление до 0.1)
          properties:
            elements:
              type: object
              properties:
                fire: { type: number }
                earth: { type: number }
                air: { type: number }
                water: { type: number }
            modalities:
              type: object
              properties:
                cardinal: { type: number }
                fixed: { type: number }
                mutable: { type: number }
        engine_version: { type: string, example: "1.0.0" }
        omitted_planets:
          type: array
          description: |-
            Планеты, которые движок не смог рассчитать. Сейчас это `chiron`:
            он требует файлов Swiss Ephemeris (`seas_18.se1`), которых нет в
            fallback-режиме. В тексте разбора такие планеты не упоминаются.
          items: { type: string }

    ChartCreateRequest:
      type: object
      required: [birth_date, birth_place, time_precision, consent]
      properties:
        birth_date:
          type: string
          format: date
          example: "1994-05-17"
          description: |
            Дата рождения в прошлом, не раньше 1900-01-01, возраст — не меньше 18 лет.
            Правило возраста (решение владельца продукта): 18 лет исполняется в
            **00:00 UTC дня рождения**; для рождённых 29 февраля в невисокосный
            год днём рождения считается 1 марта. Фронт повторяет это правило,
            чтобы не отклонять дату, которую сервер принимает.
            Проверяется на сервере (проверка на фронте — только UX, не защита).
        birth_time:
          type: [string, 'null']
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
          description: |
            Локальное время места рождения (HH:MM).
            Обязательно при `time_precision` = exact | approximate, обязано быть `null`
            при `time_precision` = unknown.
        time_precision:
          type: string
          enum: [exact, approximate, unknown]
          description: |
            Насколько известно время. Сохраняется в `profiles.time_mode` и
            возвращается в `Chart.birth.time_precision`.
            `unknown` ⇒ дома и Асцендент не рассчитываются.
            Поле по-прежнему обязательное в `required`: значение по умолчанию
            `exact` плата за забытое поле — неверная карта, а это молчаливая
            ошибка, которую пользователь не увидит.
        birth_place: { $ref: '#/components/schemas/GeoPlace' }
        consent:
          type: object
          description: |
            Согласие на обработку ПДн (152-ФЗ). Обязательно, сохраняется
            в `profiles.consent_at` и `profiles.consent_version`.
            `accepted: false` → 422 VALIDATION_FAILED.
          required: [accepted, version]
          properties:
            accepted:
              type: boolean
              enum: [true]
            version:
              type: string
              minLength: 1
              maxLength: 32
              description: |
                Версия текста согласия, которую показал фронт. Сервер принимает
                только актуальную редакцию (`CONSENT_VERSION`, сейчас `2026-11-10`).
                Любая другая — `422` с `details.field_errors[{field: "consent.version"}]`;
                по этому полю фронт снимает галочку и показывает «Условия обновились».
              example: "2026-11-10"

    ClientEvent:
      type: object
      required: [name, occurred_at]
      properties:
        name:
          type: string
          description: Имя события из `x-analytics-events`
          enum: [app_open, onboarding_start, onboarding_birth_date_set, onboarding_time_set, onboarding_place_set, consent_view, consent_accepted, birth_date_done, birth_time_done, birth_place_done, step_back, place_search, place_search_empty, place_search_failed, chart_requested, chart_created, chart_failed, chart_restored, mini_reading_view, wheel_shared, validation_failed, validation_failed_client, paywall_view, checkout_started, checkout_opened, payment_succeeded, payment_cancelled, report_requested, report_ready_view, forecast_view, ask_used, quota_exhausted, subscription_expired_seen, data_deleted, error_shown, screen_view, share_clicked, share_sent, share_saved]
        occurred_at:
          type: string
          format: date-time
          description: |
            Время события на устройстве (ISO 8601 с часовым поясом). Так поле
            называется везде — в запросе, в БД (`events.occurred_at`) и в
            метриках: одно имя на все слои, синоним `at` отменён.
            Старше суток или позже серверного времени более чем на 5 минут —
            событие отбрасывается.
          example: "2026-11-10T12:00:00.000Z"
        chart_id:
          type: [string, 'null']
          format: uuid
          description: |
            Карта, к которой относится событие, если применимо.
            Не входит в `required`: у `app_open` карты ещё нет.
        props:
          type: object
          additionalProperties:
            type: [string, number, boolean]
          description: |
            Идентификаторы, шаг, код ошибки. Строки до 64 символов.
            У `share_sent` и `share_saved` набор закрыт
            (`x-event-strict-props`): у первого `kind` (`day | wheel |
            insight | identity | moon`) и `channel` (`inline | link`), у
            второго `kind` и `target` (`gallery | telegram_story`).
            Ключи с ПДн (`birth_date`, `birth_time`, `birth_place`, `place`,
            `city`, `query`, `date`, `time`, `lat`, `lon`, `tz`, `first_name`,
            `username`, `phone`, `email`) запрещены — такое событие отбрасывается.
          example: { step: chart, code: VALIDATION_FAILED }

    EventsBatch:
      type: object
      required: [events]
      properties:
        events:
          type: array
          minItems: 1
          maxItems: 20
          items: { $ref: '#/components/schemas/ClientEvent' }

    EventsAccepted:
      type: object
      required: [accepted]
      properties:
        accepted:
          type: integer
          description: Сколько событий записано (после отбрасывания ПДн и устаревших)
          example: 3

    ReportRequest:
      type: object
      required: [chart_id, type]
      properties:
        chart_id:
          type: string
          format: uuid
          description: |
            Карта, по которой заказывается разбор. Обязателен и должен быть
            той картой, за которую заплачено: разбор открывается по оплаченной
            карте, а не по «первой» у пользователя.
        type: { type: string, enum: [full, compat, solar] }
        partner:
          type: [object, 'null']
          description: Обязателен при type=compat
          properties:
            birth_date: { type: string, format: date }
            birth_time: { type: [string, 'null'] }
            birth_place: { $ref: '#/components/schemas/GeoPlace' }
            name: { type: string, maxLength: 60 }

    JobRunResult:
      type: object
      description: |
        Счётчики одного запуска крона. Все поля есть всегда; нули означают
        «делать было нечего». Имена совпадают с полями `JobRunResult` в коде.
      properties:
        subscriptions_expired: { type: integer }
        expiry_notices_sent: { type: integer }
        pending_payments_processed: { type: integer }
        pending_payments_rejected: { type: integer }
        refunds_attempted: { type: integer }
        refunds_done: { type: integer }
        report_refunds_done: { type: integer }
        pdn_users_deleted: { type: integer }
        forecasts_generated: { type: integer }
        forecasts_skipped: { type: integer }
        forecasts_failed: { type: integer }
        pushes_sent: { type: integer }
        pushes_skipped_inactive: { type: integer }
        pushes_deferred: { type: integer }
        pushes_failed: { type: integer }
        telegram_cancel_retried: { type: integer }
        telegram_cancel_cancelled: { type: integer }
        telegram_cancel_gave_up: { type: integer }
      example:
        subscriptions_expired: 0
        expiry_notices_sent: 0
        pending_payments_processed: 1
        pending_payments_rejected: 0
        refunds_attempted: 0
        refunds_done: 0
        report_refunds_done: 0
        pdn_users_deleted: 0
        forecasts_generated: 0
        forecasts_skipped: 0
        forecasts_failed: 0
        pushes_sent: 0
        pushes_skipped_inactive: 0
        pushes_deferred: 0
        pushes_failed: 0
        telegram_cancel_retried: 0
        telegram_cancel_cancelled: 0
        telegram_cancel_gave_up: 0

    CompatibilityRequest:
      type: object
      description: |
        Вход `POST /compatibility`. `additionalProperties: false` — не
        придирка, а правило продукта: свободное поле о партнёре (имя, заметка,
        метка) — это ПДн третьего лица, которое уехало бы в БД и в промпт.
        Клиент, приславший лишнее поле, получает `422`, а не молчаливое
        принятие.
      additionalProperties: false
      required: [chart_id, relationship, partner]
      properties:
        chart_id:
          type: string
          format: uuid
          description: Своя карта. Чужая — `404`.
        relationship:
          type: string
          enum: [romantic, friend, family, colleague]
          description: Тип отношений кодом, а не текстом.
        partner:
          $ref: '#/components/schemas/CompatibilityPartner'

    CompatibilityPartner:
      type: object
      description: |
        Минимум, при котором движок считает пару: дата, необязательное время и
        место. Имени нет — и не появится: модели оно не нужно, а человеку
        показывать партнёра по имени мы не собираемся.
      additionalProperties: false
      required: [birth_date, place]
      properties:
        birth_date:
          type: string
          format: date
          description: Не раньше 1900-01-01 и не позже сегодняшнего дня.
        birth_time:
          type: [string, 'null']
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
          description: |
            `null` или отсутствие — «время неизвестно». Тогда дома и оверлеи не
            считаются вообще: блок `house_overlays` в фактах отсутствует, а не
            заполняется догадкой.
        place:
          $ref: '#/components/schemas/CompatibilityPlace'

    CompatibilityPlace:
      type: object
      description: Место рождения партнёра. Название города берётся сервером из справочника по координатам.
      additionalProperties: false
      required: [lat, lon, tz]
      properties:
        city_id:
          type: [string, 'null']
          maxLength: 64
          description: Идентификатор города справочника, если клиент его выбрал.
        lat: { type: number, minimum: -90, maximum: 90 }
        lon: { type: number, minimum: -180, maximum: 180 }
        tz:
          type: string
          maxLength: 64
          description: |
            IANA-пояс. Не угадывается: без пояса заказ не создаётся (`422`),
            потому что «примерно тот же пояс» даёт сдвиг домов на часы.

    CompatibilityAccepted:
      type: object
      required: [compatibility_id, status]
      properties:
        compatibility_id: { type: string, format: uuid }
        status: { type: string, enum: [pending] }

    CompatibilitySection:
      type: object
      required: [key, title, order, text]
      properties:
        key: { type: string, enum: [clicks, friction, scenario, steps] }
        title:
          type: string
          description: |
            «Что совпадает», «Где трёт», «Как вы разговариваете», «Что сделать
            на этой неделе». Приходит с сервера: текст заголовка может
            меняться без релиза клиента.
        order: { type: integer, minimum: 0, maximum: 3 }
        text:
          type: string
          description: |
            Markdown без H1. Абзацы 2–4, в каждом 2–4 предложения; в `steps` —
            ровно три пункта маркером «—» и подпись про саморефлексию.
            Астрологических терминов в первых 200 знаках нет.

    Compatibility:
      type: object
      required: [id, status, sections, warnings, created_at]
      properties:
        id: { type: string, format: uuid }
        status:
          type: string
          enum: [pending, ready, failed]
        sections:
          type: array
          description: Пусто, пока `status` не `ready`. При `failed` — тоже пусто.
          items: { $ref: '#/components/schemas/CompatibilitySection' }
        warnings:
          type: array
          description: Пометки формы. Только закрытый перечень кодов.
          items:
            type: object
            required: [section, code]
            properties:
              section: { type: string, enum: [clicks, friction, scenario, steps] }
              code: { type: string, enum: [length_off, trimmed, disclaimer_added] }
        created_at: { type: string, format: date-time }
        error_code:
          type: string
          enum:
            - paragraphs
            - too_short
            - too_long
            - format
            - forbidden_terms
            - repeats
            - teaser_terms
            - service_terms
            - repeated_opener
            - provider
            - cost_cap
            - monthly_cap
            - engine
            - chart_missing
          description: 'Заполняется только при `status: failed`.'

    CompatibilityListItem:
      type: object
      required: [id, status, relationship, created_at, titles_only]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [pending, ready, failed] }
        relationship: { type: [string, 'null'], enum: [romantic, friend, family, colleague, null] }
        created_at: { type: string, format: date-time }
        titles_only:
          type: array
          description: Заголовки готовых разделов, без текста. Пусто, пока `status` не `ready`.
          items: { type: string }

    CompatibilityQuota:
      type: object
      required: [kind, left, resets_at]
      properties:
        kind: { type: string, enum: [purchase, subscription, none] }
        left:
          type: integer
          minimum: 0
          maximum: 1
          description: Сколько совместимостей можно заказать прямо сейчас.
        resets_at:
          type: [string, 'null']
          format: date-time
          description: |
            Когда окно подписки откроется снова. `null` — ждать нечего:
            разовая покупка не сгорает, а у `none` окна нет вообще.

    CompatibilityList:
      type: object
      # См. `QuestionList`: аддитивные поля пагинации не в `required` — сервер
      # их всегда отдаёт, но фронтовые фикстуры без них остаются валидными.
      required: [items, quota]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/CompatibilityListItem' }
        quota: { $ref: '#/components/schemas/CompatibilityQuota' }
        total:
          type: integer
          minimum: 0
          description: |1-
            Сколько заказов всего — **после фильтра** (`failed` и `refunded` не
            входят) и **до `LIMIT`**.
        limit: { type: integer, minimum: 1, maximum: 20 }
        offset: { type: integer, minimum: 0 }

    Report:
      type: object
      required: [report_id, status, type, created_at]
      properties:
        report_id: { type: string, format: uuid }
        chart_id:
          type: string
          format: uuid
          description: |
            Карта, по которой заказывается разбор. Обязателен и должен быть
            той картой, за которую заплачено: разбор открывается по оплаченной
            карте, а не по «первой» у пользователя.
        type: { type: string, enum: [full, compat, solar] }
        status:
          type: string
          enum: [queued, generating, ready, failed, refunded]
          description: |
            `generating` — разбор собирается (внутри `planning` и `writing`).
            `failed` — модель или валидаторы не справились; `refunded` — звёзды
            уже вернулись джобом `report_refund`.
        progress:
          type: integer
          minimum: 0
          maximum: 100
          description: Доля готовых глав от 7; 100 только при `ready`
        created_at: { type: string, format: date-time }
        ready_at: { type: [string, 'null'], format: date-time }
        pdf_url: { type: [string, 'null'], description: Временная подписанная ссылка, TTL 24 ч }
        sections:
          type: array
          items:
            type: object
            properties:
              key: { type: string, enum: [core, emotions, talents, relations, money, purpose, summary] }
              title: { type: string }
              body_md: { type: string }
              order: { type: integer }
        is_paid: { type: boolean }
        teaser: { type: string, description: Первые 400 символов — для пейволла }
        missing_sections:
          type: array
          description: |
            Главы, которых нет в разборе (контракт 1.5.11). Пусто у полного
            разбора. Непусто, когда часть глав не прошла валидацию даже после
            нормализации: `status` при этом `ready`, а «Итог» заканчивается
            предложением пересобрать разбор (бесплатно) или написать в
            поддержку. Показывать разделы с этими `key` нельзя — их нет.
          items:
            type: string
            enum: [core, emotions, talents, relations, money, purpose, summary]
        warnings:
          type: array
          description: |
            Пометки по главам (контракт 1.5.11): нарушения формы/стиля,
            которые не мешают показу, и правки нормализатора. Интерфейс может
            их игнорировать — поле существует, чтобы «текст выглядит неровно»
            отличалось от «модель так и задумала».
          items:
            type: object
            required: [section, code]
            properties:
              section:
                type: string
                enum: [core, emotions, talents, relations, money, purpose, summary]
              code:
                type: string
                enum:
                  - paragraphs
                  - too_long
                  - repeats
                  - format
                  - paragraphs_split
                  - paragraphs_merged
                  - trimmed
                  - teaser_terms
                  - disclaimer_added
                description: |
                  `paragraphs`/`repeats`/`format`/`too_long` — нарушение
                  осталось после нормализации; остальные коды — что именно
                  поправил код (`normalize.ts`).

    PdfStatus:
      type: object
      required: [status]
      description: |-
        Состояние PDF разбора (1.6.8).

        `pending` — сборка идёт (или её ещё не просили), `ready` — файл готов,
        `failed` — сборка не удалась: `error` содержит код причины, повторный
        `POST` ставит новую попытку. Статусы `failed` **не** удаляются и не
        переписываются: строка — история попытки.
      properties:
        status:
          type: string
          enum: [pending, ready, failed]
        url:
          type: string
          description: |-
            Подписанная ссылка на файл (`/api/v1/files/pdf/…?sig=…`), только при
            `ready`. Живёт 24 часа; каждый `GET` отдаёт новую. Прямых адресов
            хранилища не бывает.
        expires_at:
          type: string
          format: date-time
          description: Когда истекает `url` (`+24 ч` от выдачи).
        error:
          type: string
          description: |-
            Код причины при `status: "failed"`: `pdf_failed` (сборка/рендер) или
            `astro_unavailable` (движок не ответил). Машинный код, не текст —
            показывать пользователю нужно свой текст.

    ShareCardKind:
      type: string
      description: |-
        Вид карточки шеринга.

        «Сторис» (1080×1920, общий шаблон с именем продукта, дисклеймером и
        подсказкой для поиска в безопасной зоне `250…1670`):
          • `day` — карточка дня: знак Луны, фаза, освещённость, строка
            «сегодня хорошо для…», дата. Нужна карта, подписка не нужна;
          • `identity` — «три вещи, которые правда про меня» (1.6.12): три
            короткие фразы о поведении из главы «Ядро» **оплаченного** разбора и
            приглашение «Узнал себя? Спроси, что про тебя». Модель не
            вызывается: текст режется из готового разбора по правилам, поэтому
            один и тот же разбор даёт одну и ту же карточку;
          • `moon` — «фаза Луны» (1.6.12): знак, фаза, освещённость, дата и
            строка «чего сегодня лучше не начинать» из констант по фазе.
            **Карта и подписка не нужны** — это вирусный вход; авторизация
            нужна (анонимного маршрута в интернет нет).

        Старая вёрстка (в 1.6.12 не менялась):
          • `wheel` — 1080×1920: колесо карты (нужна карта);
          • `insight` — 1080×1080: цитата из «Ядра» (нужен оплаченный разбор).

        Общих карточек (`compat`) нет: данные партнёра без его согласия не
        публикуются — такой `kind` даёт `404`.
      enum: [day, wheel, insight, identity, moon]

    ShareCard:
      type: object
      required: [url, share_url, expires_at, caption]
      description: |-
        Готовая карточка: картинка по подписанной ссылке, постоянная ссылка в
        бота и подпись к ней.

        В карточке нет ПДн: ни имени, ни даты/времени/места рождения, ни
        координат — ни на картинке, ни в метаданных PNG (EXIF не пишется
        вовсе). `url` ведёт на наш домен, а не в хранилище.

        `url` и `share_url` — разные поля с разным назначением:

          • `url` — файл. Приватная подписанная ссылка на 24 часа; её
            открывает Telegram при отправке картинки. В шеринг не попадает и
            не должна: у получателя ссылка умрёт через сутки, а подпись в
            пересланном тексте — это утечка доступа к файлу;
          • `share_url` — бот. Постоянная ссылка `t.me/<bot>?start=sh_<short_id>`:
            её отправляют текстом (`switchInlineQuery` недоступен, `openTelegramLink`
            как fallback) и вставляют в чаты. Сроком не ограничена: подпись на
            файл бот выпускает сам в момент открытия.
      properties:
        url:
          type: string
          description: Подписанная ссылка на PNG (TTL 24 часа, продлевается новым запросом).
        share_url:
          type: [string, 'null']
          description: |-
            `https://t.me/<bot_username>?start=sh_<short_id>` — постоянная
            ссылка в бота, собранная на сервере из `BOT_USERNAME` (клиент имя
            бота не знает и хардкодить его не должен).

            Не ссылка на файл: подписи (`sig=`) в ней нет и быть не может.
            `null` — имя бота на сервере не настроено: тогда доступен только
            `switchInlineQuery`, а fallback ссылкой собрать не из чего.
          example: https://t.me/astro_soul_bot?start=sh_k7m2p9x4qz
        expires_at:
          type: string
          format: date-time
        caption:
          type: string
          description: |-
            Одна строка для `switchInlineQuery`: готовая подпись к картинке.
            Слова «астрология», «гороскоп», «предсказание» не используются.
          example: Мне тут сделали разбор личности — залипательно

    Forecast:
      type: object
      required: [date, text, is_paid]
      properties:
        date: { type: string, format: date }
        text: { type: string, description: 3–6 предложений, вариант для бесплатного = урезанный }
        focus: { type: [string, 'null'], enum: [career, love, money, health, self] }
        is_paid: { type: boolean }
        generated_at: { type: string, format: date-time }

    AskRequest:
      type: object
      required: [chart_id, question]
      properties:
        chart_id: { type: string, format: uuid }
        question: { type: string, minLength: 3, maxLength: 500 }

    AskResponse:
      type: object
      required: [answer, based_on]
      properties:
        answer: { type: string, maxLength: 1500 }
        based_on:
          type: array
          description: Позиции карты, на которые опирался ответ (для прозрачности)
          items: { type: string, example: "Луна в Льве, 12-й дом" }
        quota: { $ref: '#/components/schemas/Quota' }

    PlanCode:
      type: string
      description: |
        Каталог: то, что продаётся всегда. Тестовые тарифы (`test_1`,
        `test_report_1`) сюда не входят — они приходят в витрине как
        `PlanOffer.plan_code` (`OrderablePlanCode`) и существуют только при
        `PAYMENTS_TEST_PLANS=1`.
      enum: [week_149, month_399, year_2990, one_149, compat_249, solar_590]

    PlanOffer:
      type: object
      description: |
        Один тариф на витрине. Тексты приходят с сервера: пока их знал клиент,
        смена названия или цены требовала релиза клиента, а тестовый тариф
        нельзя было показать вообще.
      required: [plan_code, kind, stars, period_sec, title, subtitle, includes, test]
      properties:
        plan_code: { $ref: '#/components/schemas/OrderablePlanCode' }
        kind:
          type: string
          enum: [subscription, one_off]
          description: |
            `subscription` — автопродление через Telegram; `one_off` — разовая
            покупка. От этого зависит, что делает клиент: подписку открывают
            как `subscription_period`, разовый товар — обычным счётом.
        stars:
          type: integer
          description: Цена в звёздах. Клиент показывает её как есть, цена в вёрстке не дублируется.
        period_sec:
          type: [integer, 'null']
          description: |
            Период подписки в секундах, `null` для разового товара. `null`, а
            не отсутствие поля: клиенту нужно отличать «без периода» от
            «сервер не сказал».
        title:
          type: string
          description: Название тарифа, на «ты», без цены.
        subtitle:
          type: string
          description: |
            Что человек получает, одной фразой. Обещанное, но не выпущенное
            названо прямо («появится в ближайшие дни»), а не как готовое.
        includes:
          type: array
          items: { type: string }
          description: Состав тарифа — из прав этого же плана, а не из текста рядом.
        test:
          type: boolean
          description: |
            Тестовый тариф за 1 ⭐. Такие показываются отдельным блоком ниже
            обычных, а не подмешиваются к продаже. При выключенном флаге в
            ответе нет ни одного плана с `test: true`.

    PlansResponse:
      type: object
      required: [plans]
      properties:
        plans:
          type: array
          items: { $ref: '#/components/schemas/PlanOffer' }
          description: |
            Сначала каталог в порядке пейволла, затем (только при включённом
            `PAYMENTS_TEST_PLANS`) тестовые тарифы.

    OrderablePlanCode:
      type: string
      description: |
        Код тарифа на денежном пути. Каталог — значения `PlanCode`; при
        `PAYMENTS_TEST_PLANS=1` дополнительно `test_1` и `test_report_1`.
        Тип — строка намеренно: `PlanCode` — закрытый список того, что
        продаётся всегда, а тестовые коды существуют только при флаге.
      examples: [one_149, month_399]

    InvoiceRequest:
      type: object
      required: [plan_code]
      properties:
        plan_code: { $ref: '#/components/schemas/OrderablePlanCode' }
        chart_id:
          type: string
          format: uuid
          description: |
            Для разовых продуктов. Обязателен для `one_149` (полный разбор):
            товар привязан к карте (1.5.2).

    Invoice:
      type: object
      description: |
        Инвойс, выставленный сервером. Состояния хранятся в БД
        (`invoices.status`) и в ответе не отдаются: клиенту нужна ссылка,
        а не бухгалтерия. Требование к коду — `x-invoice-states`.
      required: [invoice_link, plan_code, stars, is_subscription]
      properties:
        invoice_link:
          type: string
          description: Ссылка на инвойс для Telegram.WebApp.openInvoice
        plan_code: { $ref: '#/components/schemas/OrderablePlanCode' }
        stars: { type: integer, example: 399 }
        is_subscription: { type: boolean }
        subscription_period_sec: { type: [integer, 'null'], example: 2592000 }

paths:
  /api/v1/health:
    get:
      tags: [system]
      summary: Проверка живости
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: |-
                  Живость сервиса для внешнего мониторинга (1.6.11).

                  **Коды ответа.** `200` при `status: degraded` — осознанно:
                  мониторинг должен прочитать тело и показать, что именно
                  деградировало, а не «HTTP 5xx без подробностей». `503` — только
                  при `db: down`: без БД сервис не обслуживает ничего. Тело в
                  обоих случаях одной формы.
                properties:
                  status:
                    type: string
                    enum: [ok, degraded]
                    description: |
                      `degraded` — если `telegram_webhook != ok`, `db != ok` или
                      сайдкар астро-движка `!= ok`. Вебхук добавлен в правило
                      в 1.6.11: без него не доставляется `pre_checkout_query`.
                  version: { type: string }
                  db: { type: string, enum: [ok, down] }
                  llm: { type: string, enum: [ok, down, unknown] }
                  astro: { type: string, enum: [ok, down], description: Доступность локального сайдкара астро-движка }
                  flags:
                    type: object
                    description: |-
                      Флаги, которые на проде обязаны быть в одном положении
                      (1.6.11). Прод-гард не пускает процесс с другими
                      значениями, но включённый позже флаг должен быть виден
                      снаружи, а не только в логе старта: `test_plans` — тарифы
                      за 1 ⭐, `report_breaker` — circuit breaker разборов
                      (должен быть `true`).
                    properties:
                      test_plans: { type: boolean }
                      report_breaker: { type: boolean }
                  checked_at:
                    type: string
                    format: date-time
                    description: |
                      Когда сервер смотрел на зависимости. Без этого поля
                      мониторинг не отличает свежий ответ от закэшированного.
                  telegram_webhook:
                    type: string
                    enum: [ok, stale, unreachable]
                    description: |
                      Состояние вебхука Telegram по последней проверке API
                      (1.6.2). `ok` — при старте (или в `payments:diagnose`)
                      подтверждено, что зарегистрирован ожидаемый адрес, и
                      проверка моложе суток; `stale` — проверки не было или
                      она старше суток (перезапусти API и проверь
                      `pnpm payments:diagnose --set-webhook`); `unreachable` —
                      проверка провалилась: адрес `MINI_APP_URL` не резолвится,
                      Bot API недоступен или `setWebhook` не подтвердился.
                      В этих двух состояниях `pre_checkout_query` может не
                      доставляться: оплата в Telegram не пройдёт.

  /api/v1/me:
    get:
      tags: [profile]
      summary: Профиль, подписка и квоты вызывающего пользователя
      security: [{ TelegramInitData: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401':
          description: Неверная подпись initData
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
    delete:
      tags: [profile]
      summary: Удалить все персональные данные пользователя (ПДн)
      description: |
        Удаляются профиль, карты, разборы, прогнозы и вопросы.

        **Подписка отменяется, доступ закрывается сразу, оплаченный период не
        возвращается.** После удаления `Me.subscription.is_active = false`,
        `Me.entitlements.full_report = false`, `full_report_chart_id = null`,
        `latest_report_id = null`. Повторный вход тем же `telegram_id` создаёт
        нового пользователя (`is_new = true`) без покупок — даже если `user_id`
        совпал (он детерминирован из telegram_id).

        **Автопродление в Telegram отключается** вызовом
        `editUserStarSubscription(is_canceled: true)` — до транзакции удаления,
        пока известна пара (`telegram_id`, `telegram_payment_charge_id`).
        Ошибка Telegram удаление не блокирует: удаление ПДн не зависит от
        доступности чужого API. Неуспех пишется в
        `subscriptions.telegram_cancel_state` и повторяется ночным джобом в
        течение окна возврата (30 дней, до 5 попыток).

        Обезличивается всё, где был `user_id`: `payments`, `subscriptions`
        (`status = cancelled`), `entitlements` (`status = revoked`), `events`.
        **Обезличенная история платежей сохраняется** для бухучёта и возвратов:
        `telegram_payment_charge_id`, план, сумма и дата остаются, `user_id` —
        нет. `payments.telegram_id` снимается через 30 дней (окно возврата),
        после чего вернуть звёзды можно только по явному id от поддержки.

        Маршрут **идемпотентен**: всегда `204`, даже если удалять нечего.
        `404` не отдаётся никогда — клиенту не нужно различать «уже удалено» и
        «нечего удалять».
      security: [{ TelegramInitData: [] }]
      responses:
        '204':
          description: Удалено
        '409':
          description: |
            Удаление остановлено платежом в процессе и вернуть его не удалось:
            `Problem.code = CONFLICT`, `details.reason = "refund_failed"`.
            Пользователю показывается текст `Problem.message` со ссылкой на
            поддержку (`SUPPORT_CONTACT`), повтор возможен после ответа поддержки.

            Если возврат удался, ответ — `204`: данные удалены, звёзды вернулись.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /api/v1/me/notifications:
    post:
      tags: [profile]
      summary: Согласия на уведомления
      description: |-
        Сохраняет настройку уведомлений и возвращает её же — одну и ту же форму,
        что и `Me.notifications`, чтобы клиенту не нужно было сливать две
        структуры.

        Поле одно и обязательное, полностью заменяет текущее состояние (не
        частичное обновление): `{"daily_forecast": false}` выключает
        ежедневный пуш, `true` включает. Пропущенное поле — `422` с
        `field_errors[{field: "daily_forecast"}]`, а не «оставить как было»:
        иначе опечатка в имени поля молча означала бы «ничего не менять», и
        переключатель в интерфейсе врал бы.

        Отказ **не** отключает генерацию прогноза — только доставку пуша.
        Сам пуш появится в итерации 37; до этого маршрут уже хранит согласие,
        поэтому клиент может рисовать переключатель без «пустого» действия.
      security: [{ TelegramInitData: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [daily_forecast]
              additionalProperties: false
              properties:
                daily_forecast:
                  type: boolean
                  example: true
      responses:
        '200':
          description: Сохранено; тело — новое состояние согласий
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Notifications' }
        '401':
          description: Неверная подпись initData
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: |
            `field_errors[{field: "daily_forecast"}]` — поля нет, это не boolean
            или в теле лишние ключи.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /api/v1/geo/resolve:
    post:
      tags: [profile]
      summary: Поиск города для места рождения
      security: [{ TelegramInitData: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query:
                  type: string
                  description: |
                    Поиск идёт по мере ввода. Минимальная и максимальная длина —
                    **настройка сервера** (`GEO_MIN_QUERY_LENGTH`,
                    `GEO_MAX_QUERY_LENGTH`), а не число из контракта: фактические
                    значения приходят в `GET /me` → `limits.geo_min_query_length`
                    и `limits.geo_max_query_length`. Короче минимума или длиннее
                    максимума — `422` с `field_errors[{field: "query"}]`; пустой
                    массив означает «города нет», а не «слишком короткий запрос».
                limit:
                  type: integer
                  description: |
                    Сколько кандидатов вернуть. Клиенту это поле не нужно: без
                    него сервер берёт `GEO_DEFAULT_LIMIT`, а число больше
                    `GEO_MAX_LIMIT` **молча зажимает** до потолка (не `422`):
                    отказ на подсказке ломал бы поиск ни за что. Не целое число —
                    `422`.
      responses:
        '200':
          description: |
            Кандидаты. Ответ **всегда** 200 и массив: пустой массив = «города нет»,
            это не ошибка. Лишних подтверждений от фронта не нужно.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/GeoPlace' }
        '422':
          description: |
            `VALIDATION_FAILED`, `details.field_errors[0].field` всегда `query`:
            короче серверного минимума (`details.reason = geo_query_too_short`),
            длиннее максимума (`geo_query_too_long`), `limit` не целое число
            (`geo_limit_invalid`) — либо для найденной точки достоверно
            неизвестен часовой пояс (`details.reason = no_timezone`): пояс
            «на глаз» не подставляется, и повтор запроса не поможет.
        '429':
          description: 'Слишком частое обновление подсказок: лимит маршрута 120 запросов в минуту'
        '503':
          description: |
            Провайдер геоданных недоступен (`GEO_NOT_FOUND`) — только временные
            причины, где повтор имеет смысл. `details.reason`:
            `provider_timeout` (не ответил за 2 с), `provider_unavailable`
            (сеть, статус или `429` от провайдера), `not_configured` (провайдер
            включён, но не настроен контакт для User-Agent). Отсутствие пояса
            сюда **не** входит: это `422` с `details.reason = no_timezone`.
            Текст `message` готов к показу: «Поиск городов временно недоступен.
            Попробуй ещё раз через минуту.» Пустой результат сюда не относится —
            он отдаётся как 200 [].

  /api/v1/charts:
    post:
      tags: [charts]
      summary: Создать натальную карту
      description: |
        Расчёт синхронный (≤ 300 мс, Swiss Ephemeris локально).
        В ответе — карта и текстовый мини-разбор (бесплатный крючок).

        Повторный вызов с теми же данными возвращает существующую карту
        (идемпотентность по хэшу входа), но уже с кодом `200` и
        `is_restored: true`: по телу ответа клиент отличает `chart_created`
        от `chart_restored`. Конверт в обоих случаях один и тот же.
      security: [{ TelegramInitData: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChartCreateRequest' }
      responses:
        '201':
          description: "Карта создана: `is_restored: false`"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChartResponse' }
        '200':
          description: |
            Такая карта уже есть (`is_restored: true`) — тот же конверт,
            что и на `201`. Клиент не считает это ошибкой.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChartResponse' }
        '422':
          description: |
            Некорректные данные (VALIDATION_FAILED): `details.field_errors`
            содержит поле и текст для подсветки (birth_date, birth_time,
            birth_place, time_precision, consent).

  /api/v1/charts/current:
    get:
      tags: [charts]
      summary: Текущая карта пользователя
      description: |
        Карта, которая есть у пользователя сейчас: нужна при возврате в
        мини-апп, после `startapp=chart_<id>` и для кнопки «моя карта».

        Конверт тот же, что у `POST /charts` и `GET /charts/{chart_id}`,
        `is_restored: true`. Карты нет — `404 NOT_FOUND`, по нему клиент
        уходит в онбординг. Это не ошибка и не повод показывать красный экран.
      security: [{ TelegramInitData: [] }]
      responses:
        '200':
          description: Карта пользователя
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChartResponse' }
        '404': { description: 'NOT_FOUND — карты ещё нет, иди в онбординг' }

  /api/v1/charts/{chart_id}:
    get:
      tags: [charts]
      summary: Получить карту
      security: [{ TelegramInitData: [] }]
      parameters:
        - name: chart_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: |
            Тот же конверт, что и `POST /charts`: карта, мини-разбор и относительный
            путь к колесу с уже включённой подписью `sig` (его можно открывать без initData).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChartResponse' }
        '404': { description: NOT_FOUND }

  /api/v1/charts/{chart_id}/wheel.svg:
    get:
      tags: [charts]
      summary: Колесо карты в SVG
      description: |
        Публично по подписанному токену в query (`?sig=`), чтобы можно было
        вставлять картинку в чат и в `<img>`.

        Самодостаточный SVG: все подписи — векторные контуры (`<path>`/`<use>`),
        ни одного `<text>`, ни `font-family`, ни внешних ссылок и шрифтов.
        Причина: в мобильном WebView нет ни DejaVu Sans, ни Segoe UI Symbol,
        а глифы планет и знаков зодиака есть только в системных шрифтах —
        `<text>` там превращается в «тофу» и наезжает на маркеры.
      security: []
      parameters:
        - name: chart_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: sig
          in: query
          required: true
          schema: { type: string }
        - name: theme
          in: query
          required: false
          schema: { type: string, enum: [dark, light], default: dark }
      responses:
        '200':
          description: SVG
          content:
            image/svg+xml:
              schema: { type: string }
        '403': { description: 'FORBIDDEN — подпись отсутствует или недействительна' }

  /api/v1/charts/{chart_id}/wheel.png:
    get:
      tags: [charts]
      summary: Колесо карты в PNG (для шаринга)
      description: |
        Тот же рисунок, что и `wheel.svg`, растеризованный в PNG: в чат уходит
        картинка, к ней добавляется ссылка на бота. Публично по той же подписи
        `?sig=`, что и SVG.
      security: []
      parameters:
        - name: chart_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: sig
          in: query
          required: true
          schema: { type: string }
        - name: theme
          in: query
          required: false
          schema: { type: string, enum: [dark, light], default: dark }
        - name: size
          in: query
          required: false
          description: |
            Ширина картинки в пикселях: только `1080` (по умолчанию) или
            `1600`. Другие значения — `422 VALIDATION_FAILED`
            (`field_errors[{field: "size"}]`), а не молчаливая подмена размера.
          schema: { type: integer, enum: [1080, 1600], default: 1080 }
      responses:
        '200':
          description: PNG
          content:
            image/png:
              schema: { type: string, format: binary }
        '403': { description: 'FORBIDDEN — подпись отсутствует или недействительна' }
        '404': { description: NOT_FOUND }
        '422': { description: '`size` не 1080 и не 1600' }

  /api/v1/events:
    post:
      tags: [engagement]
      summary: События продукта батчем
      description: |
        Клиент присылает шаги воронки, которые сервер не видит: открытие,
        экран согласия, шаги онбординга, возврат назад, поиск места, шаринг.

        * батч от 1 до 20 событий; больше — `422`, клиент шлёт не больше 20;
        * ответ `202 Accepted`: приём подтверждён, ждать его интерфейсу незачем.
          Ошибки разбора тоже не должны ломать экран;
        * `name` — только значения из `x-analytics-events` (закрытый список);
        * `props` — идентификаторы, шаг, код ошибки. ПДн (дата/время/место
          рождения, город, имя, телефон, e-mail) в `events` запрещены: такие
          события отбрасываются на сервере и в БД не попадают;
        * у `share_sent` (1.6.9) `props` закрыты: `{kind, channel}`, у
          `share_saved` (1.6.12) — `{kind, target}`; значения — из
          `x-event-strict-props`. Неизвестное значение или отсутствующее поле —
          `422` с `field_errors[{field: "events.props.<ключ>"}]`, лишние ключи
          вырезаются. Остальные события принимают свободные `props`;
        * `share_saved` — «карточка сохранилась»: `target: "gallery"` (в
          галерею устройства) или `"telegram_story"` (в Telegram-сторис). Без
          этого события не видно, дошла ли карточка до Instagram вообще:
          отправку в чужую ленту сервер не видит;
        * имя события — только из `x-analytics-events`: произвольное имя не
          принимается (`422`, весь батч), иначе аналитика стала бы свалкой;
        * `occurred_at` — время на устройстве, ISO 8601 с часовым поясом. Старше суток
          или позже серверного времени более чем на 5 минут — отбрасывается;
        * лимит: общий, 60 запросов в минуту; `429` клиент игнорирует.
      security: [{ TelegramInitData: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EventsBatch' }
      responses:
        '202':
          description: Батч принят
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventsAccepted' }
        '422':
          description: |
            Батч пуст, больше 20 событий, неизвестное имя события или время
            вне допустимого окна (`VALIDATION_FAILED` + `details.field_errors`).
        '429': { description: 'RATE_LIMITED — лимит запросов в минуту' }

  /api/v1/reports:
    post:
      tags: [reports]
      summary: Заказать разбор (асинхронно)
      description: |
        Возвращает 202 и report_id со `status: queued`. Генерация идёт в фоне,
        готовность — через `GET /reports/{report_id}` (главы появляются по мере
        готовности, 30–90 сек на весь разбор).

        Доступ проверяется здесь, а не на экране: полный разбор — разовая
        покупка (`one_149`), подписка его не открывает. Без покупки — `402`.

        Идемпотентность: заголовок `Idempotency-Key` обязателен (до 64 символов,
        буквы/цифры/`-_.:`). Три тапа по кнопке с одним ключом дают **один**
        разбор и одно списание; повторный заказ по той же карте с другим ключом
        тоже не создаёт второй разбор, пока первый не провалился.

        В этом релизе собирается только `type: full`: `compat` и `solar` —
        отдельные продукты, на них API честно отвечает `422`, а не «в очереди».
      security: [{ TelegramInitData: [] }]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, maxLength: 64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReportRequest' }
      responses:
        '202':
          description: 'В очереди, `status: queued`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Report' }
        '402':
          description: Требуется оплата (PAYMENT_REQUIRED) — разбор не куплен
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404':
          description: Карты нет или она чужая (NOT_FOUND)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: |
            Нет `Idempotency-Key`, некорректное или пустое тело (`chart_id`),
            неподдерживаемый тип — `VALIDATION_FAILED` +
            `details.field_errors[{field, message}]` (поле заголовка называется
            `Idempotency-Key`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '503':
          description: |
            Приём разборов временно закрыт: `UPSTREAM_LLM` +
            `details.reason = report_breaker_open`. Причина — три разбора
            подряд упали на валидации текста; брейкер закрывается сам через
            `details.retry_after_ms` миллисекунд. Деньги не списываются:
            проверка стоит до создания разбора. Состояние видно в
            `GET /admin/metrics` (`reports_breaker_open`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /api/v1/reports/{report_id}:
    get:
      tags: [reports]
      summary: Статус и содержимое разбора
      description: |
        `status: generating` покрывает внутренние стадии `planning` и `writing`.
        `progress` — 0…100, растёт по числу готовых глав.

        Пока разбор не оплачен, в ответе только `teaser` (первые 400 знаков
        «Ядра») и `is_paid: false`; `sections` пустой. После оплаты главы
        приходят сразу, как готовы, а полный разбор — при `status: ready`.

        Провал генерации — `status: failed`; звёзды за него возвращает джоб
        `report_refund`, после чего статус становится `refunded`.
      security: [{ TelegramInitData: [] }]
      parameters:
        - name: report_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Report' }
        '404': { description: NOT_FOUND — разбора нет или он чужой }

  /api/v1/reports/{report_id}/pdf:
    post:
      tags: [reports]
      summary: Собрать PDF разбора (асинхронно)
      description: |-
        `202` в любом случае: сборка идёт в фоне (5–15 секунд), а готовый файл
        отдаётся сразу — `{status: "ready", url, expires_at}`. Если файла ещё
        нет, ответ `{status: "pending"}`, клиент опрашивает `GET`.

        `Idempotency-Key` обязателен: двойной тап не должен ставить две сборки
        на один разбор. Кэш — по `(report_id, engine_version, prompt_version)`:
        повтор не пересобирает документ и не зовёт сайдкар.

        PDF — **часть оплаченного разбора**, а не отдельный товар:
          • `403 FORBIDDEN`, `details.reason = report_not_paid` — чужой или
            неоплаченный разбор (тизер тоже сюда: текста в нём нет);
          • `404 NOT_FOUND` — такого разбора нет;
          • `409 CONFLICT`, `details.reason = report_not_ready` — разбор ещё
            собирается (тизер или `writing`): в документе был бы огрызок текста;
          • `422 VALIDATION_FAILED` — нет `Idempotency-Key`.

        Провал **самой** сборки — не ошибка запроса: он живёт в теле как
        `status: "failed"` (см. `PdfStatus.error`), а повторный `POST` ставит
        новую попытку. Отдельного `503` на провал сборки нет намеренно: опрос
        статуса не должен выглядеть как падение сервиса. `503` с
        `details.reason = pdf_failed` остаётся за случаем «не удалось даже
        поставить сборку в очередь».
      security: [{ TelegramInitData: [] }]
      parameters:
        - name: report_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, maxLength: 64 }
      responses:
        '202':
          description: Сборка поставлена (или файл уже готов)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PdfStatus' }
        '403':
          description: '`details.reason = report_not_paid` — чужой или неоплаченный разбор'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404':
          description: '`details.reason = report_not_found`'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: '`details.reason = report_not_ready`'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: 'Нет `Idempotency-Key`'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
    get:
      tags: [reports]
      summary: Статус PDF и свежая ссылка
      description: |-
        `200` всегда, когда разбор свой и оплаченный: `pending` — сборка идёт
        (или её ещё не просили), `ready` — `url` + `expires_at`, `failed` —
        `error` с кодом причины; повторный `POST` разрешён.

        **Ссылка подписанная и короткоживущая.** Каждый `GET` возвращает новую
        подпись (TTL 24 часа); старую ссылку клиент должен забыть. Прямых
        адресов хранилища в ответе нет никогда: файл открывается только
        `GET /files/{scope}/{name}?sig=…` на нашем домене.

        Ошибки те же, что у `POST`, кроме `422` (заголовок не нужен).
      security: [{ TelegramInitData: [] }]
      parameters:
        - name: report_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Статус сборки
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PdfStatus' }
        '403':
          description: '`details.reason = report_not_paid`'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404':
          description: '`details.reason = report_not_found`'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: '`details.reason = report_not_ready`'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /api/v1/share/card:
    post:
      tags: [share]
      summary: Карточка для шеринга
      description: |-
        Отдаёт готовую картинку для чата: `{url, share_url, expires_at, caption}`.

        Виды (`ShareCardKind`):
          • `day` — 1080×1920, шаблон сторис: знак Луны, фаза, освещённость,
            строка «сегодня хорошо для…» из `summary` прогноза, дата. Нужна
            карта, подписка не нужна;
          • `identity` — 1080×1920, шаблон сторис: три фразы о поведении из
            главы «Ядро» **оплаченного** разбора и приглашение внизу. Меньше
            трёх подходящих фраз — `422 not_enough_identity_lines` (это
            нормальный ответ, а не сбой); нет оплаченного разбора —
            `403 report_not_paid`;
          • `moon` — 1080×1920, шаблон сторис: знак, фаза, освещённость, дата,
            строка «чего лучше не начинать» по фазе. **Карта и подписка не
            нужны**: знак и фаза считаются на полдень дня в поясе из `tz`
            (или в поясе последней карты, иначе UTC) — без натальных транзитов,
            поэтому карточка доступна человеку без профиля. `tz` фронт обязан
            передавать всегда: без него у человека без карты день считается по
            UTC, и в UTC+3…UTC+12 это до семи утра даёт вчерашнюю дату;
          • `wheel` — 1080×1920, старая вёрстка: колесо карты. Ни даты, ни
            времени, ни места рождения — ни на картинке, ни в метаданных PNG;
          • `insight` — 1080×1080, старая вёрстка: 2–3 предложения из главы
            «Ядро» **оплаченного** разбора, без астрономических терминов.

        **Шаблон сторис (1.6.12).** У `day`, `identity` и `moon` контент живёт
        только в центральной полосе `y = 250…1670`: сверху и снизу интерфейс
        Instagram перекрывает карточку. Внутри карточки всегда есть имя продукта
        (`BRAND_NAME` сервера — не username бота), дисклеймер тем же текстом, что
        у прогноза, и подсказка для поиска внизу. **Имя продукта не задано —
        карточка не создаётся**: `503 brand_name_missing`, а не «Astro Soul по
        умолчанию»: безымянная карточка в чужой ленте не находится.
        Вёрстка версионируется: версия входит в ключ кэша, поэтому после смены
        шаблона старые карточки из кэша не отдаются.

        `caption` — одна готовая строка для `switchInlineQuery`; слова
        «астрология», «гороскоп», «предсказание» в ней не встречаются.

        Ссылка в подписи — `t.me/<bot>?start=sh_<short_id>`. `short_id` выводится
        из хеша содержимого карточки: ни `user_id`, ни `report_id` в ссылку не
        попадают, а две одинаковые карточки дают один файл (кэш по содержимому).

        `share_url` (1.6.9) — та же ссылка целиком, собранная на сервере из
        `BOT_USERNAME`. Нужна фронту: `short_id` наружу больше нигде не отдаётся,
        а имя бота — конфиг сервера. `share_url` и файловый `url` — разные вещи:
        `url` живёт 24 часа и в шеринг не идёт, `share_url` бессрочная и именно
        она уходит в чат текстом, когда `switchInlineQuery` недоступен.

        Сервер пишет событие `share_card_created` (`kind`, `bytes`, `cached`,
        `build_ms`) — «карточка отдана». Отправку в чат сервер не видит:
        `share_sent` присылает клиент (`POST /events`).

        **Совместимость не шарится.** `kind: "compat"` — `404` с
        `details.reason = share_compat_not_available`: данные партнёра — ПДн
        третьего лица, согласия на публикацию он не давал. Это продуктовое
        решение, а не отсутствующая функция.
      security: [{ TelegramInitData: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind]
              properties:
                kind: { $ref: '#/components/schemas/ShareCardKind' }
                tz:
                  type: string
                  example: Europe/Moscow
                  description: |-
                    Часовой пояс, только для `moon` (1.6.12): по нему считается
                    «сегодня», а значит и фаза со знаком на карточке.

                    **Передавайте всегда.** Клиент знает пояс устройства —
                    `Intl.DateTimeFormat().resolvedOptions().timeZone` — и обязан
                    отдавать его в каждом запросе карточки `moon`, а не «если
                    есть».

                    Без `tz` сервер берёт пояс последней карты человека, а если
                    карты нет — **UTC**. Умолчание техническое и осознанно
                    предсказуемое, но для аудитории UTC+3…UTC+12 оно даёт
                    **вчерашнюю дату**: в Москве с 00:00 до 03:00 местного
                    времени, в Новосибирске — до 07:00. Карточка при этом не
                    врёт о расчёте (фаза на UTC-дату верна для UTC), но человек
                    видит вчерашний день рядом с «Сегодня» в приложении.
                    Поэтому для `moon` без `tz` сознательно выбран UTC, а не
                    угадывание пояса: угаданный пояс ошибся бы незаметно.

                    Неизвестный пояс — `422` с `field_errors[{field: "tz"}]`,
                    а не тихая подмена на UTC. Для остальных видов поле
                    игнорируется.
      responses:
        '200':
          description: Карточка готова
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShareCard' }
        '403':
          description: |-
            `details.reason`:
              • `chart_required` — нет карты (`day`, `wheel`);
              • `report_not_paid` — `insight` или `identity` без оплаченного разбора;
              • `insight_unavailable` — в разборе нет фразы без терминов.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404':
          description: '`details.reason = share_compat_not_available` — общих карточек нет'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: |-
            `details.reason`:
              • `share_kind_unknown` — `kind` не из `ShareCardKind`
                (`field_errors[{field: "kind"}]`);
              • `not_enough_identity_lines` — в «Ядре» меньше трёх коротких фраз
                о поведении, поэтому карточка `identity` не собирается;
              • `share_tz_unknown` — неизвестный `tz`
                (`field_errors[{field: "tz"}]`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '503':
          description: |-
            `details.reason`:
              • `brand_name_missing` — на сервере не задано `BRAND_NAME`, и
                карточку-сторис нельзя подписать именем продукта;
              • `astro_unavailable` — сайдкар не ответил (`UPSTREAM`), повтори позже
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /api/v1/files/{scope}/{name}:
    get:
      tags: [files]
      summary: Приватный файл по подписанной ссылке
      description: |-
        Единственный вход к файлам: PDF разбора (`pdf/*.pdf`) и карточки
        шеринга (`card/*.png`). Каталог не отдаётся статикой — без подписи
        маршрут отвечает `403`, поэтому утечка ключа из БД доступа не даёт.

        `sig` = `<expires>.<hmac>` (HMAC-SHA256 от `«{key}:{expires}»`) — тот же
        формат, что у колеса карты. Срок — часть подписи, продлить ссылку
        правкой query нельзя.

        Ответ `cache-control: private, no-store`: подписанный адрес не должен
        осесть в общих кэшах и пережить свой срок. Скачивание PDF считается
        (`report_pdfs.downloads`, событие `pdf_downloaded`); карточки не
        считаются — Telegram кэширует картинки у себя.

        Маршрут без initData (`security: []`): право даёт подпись.
      security: []
      parameters:
        - name: scope
          in: path
          required: true
          schema: { type: string, enum: [pdf, card] }
        - name: name
          in: path
          required: true
          schema: { type: string, description: '`<uuid>.pdf` или `<uuid>.png`' }
        - name: sig
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Файл
          content:
            application/pdf:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
        '403':
          description: |-
            `details.reason`:
              • `file_signature_invalid` — подписи нет или она не сходится;
              • `file_link_expired` — срок вышел, запроси свежую ссылку.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404':
          description: '`details.reason = file_not_found`'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /api/v1/compatibility:
    post:
      tags: [compatibility]
      summary: Заказать разбор совместимости (асинхронно)
      description: |
        Собирается четыре раздела: «Что совпадает», «Где трёт», «Как вы
        разговариваете», «Что сделать на этой неделе». Готовность — через
        `GET /compatibility/{id}`.

        Доступ проверяется здесь: разовая покупка `compat_249` даёт одну
        совместимость, подписка — одну в 30 дней (скользящее окно от последней
        готовой). Квота списывается **только** при `ready`: провал возвращает
        право сам, без заявки и без джоба.

        Идемпотентность: `Idempotency-Key` обязателен (до 64 символов,
        буквы/цифры/`-_.:`). Повтор с тем же ключом отдаёт тот же
        `compatibility_id` и не списывает второй раз.

        Пока совместимость собирается, повторный заказ по тому же
        пользователю — `422 compat_already_owned`.
      security: [{ TelegramInitData: [] }]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, maxLength: 64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CompatibilityRequest' }
      responses:
        '202':
          description: 'В очереди, `status: pending`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CompatibilityAccepted' }
        '402':
          description: |
            Нет права на совместимость: `PAYMENT_REQUIRED`,
            `details.reason = compat_not_paid`. Ни разовой покупки, ни активной
            подписки.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404':
          description: Карты нет или она чужая (NOT_FOUND)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: |
            Одно из трёх, различимых по `details.reason`:
              • `compat_request_invalid` — нет `Idempotency-Key`, лишнее поле в
                теле (в том числе любое свободное поле о партнёре), дата в
                будущем, место без координат или пояса;
                `details.field_errors[{field, message}]`;
              • `compat_quota_exhausted` — подписка уже дала совместимость в
                текущем окне; `details.resets_at` — когда окно откроется;
              • `compat_already_owned` — оплаченная совместимость ещё не
                израсходована или предыдущая ещё собирается;
                `details.field_errors[0].field = chart_id`.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '503':
          description: |
            Брейкер совместимости закрыт: `UPSTREAM_LLM`,
            `details.reason = compat_breaker_open`, задержка в
            `details.retry_after_ms`. Отдельный от `report_breaker_open`:
            провалы разборов совместимость не закрывают и наоборот.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
    get:
      tags: [compatibility]
      summary: История совместимостей и остаток квоты
      description: |
        Список без текстов: `titles_only` содержит только заголовки готовых
        разделов, чтобы витрина не весила мегабайт. Текст — в
        `GET /compatibility/{id}`.

        **Какие статусы попадают в список (1.6.7).** `ready` и `pending`
        (собственные незавершённые заказы — по ним клиент восстанавливает
        экран после закрытия мини-аппа). Записи со `status: failed` в списке
        **нет никогда**: неудачная попытка — наша внутренняя история, а не
        товар, и в приложении она читается как «заплатил и получил ошибку»,
        даже когда право не списано. Такая запись по-прежнему доступна по
        `GET /compatibility/{id}` — это нужно воркеру, QA и разбору инцидентов.
        Фильтр применён до `LIMIT`: `total` считается от того же набора, что и
        список, — иначе они разошлись бы.

        **Пагинация (1.6.8).** `limit` (1…20, по умолчанию 20) и `offset`
        (по умолчанию 0). `total` — сколько заказов всего после фильтра; он
        считается отдельным запросом, поэтому на пустой последней странице
        `total` остаётся прежним, а не превращается в ноль. Мусор в параметрах
        (`?limit=abc`) не даёт `422`: значение приравнивается к умолчанию.

        `quota.kind`: `purchase` — есть неизрасходованная разовая покупка;
        `subscription` — подписка, окно открыто или закрыто (`left` = 1 или 0);
        `none` — права нет. `resets_at` заполнен только у подписки с закрытым
        окном. Квота считается на чтении — отдельного сброса по расписанию нет.
      security: [{ TelegramInitData: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CompatibilityList' }

  /api/v1/compatibility/{compatibility_id}:
    get:
      tags: [compatibility]
      summary: Разбор совместимости
      description: |
        `status: pending` покрывает внутренние стадии `queued | planning |
        writing`. `sections` пустой, пока `status` не `ready`.

        `warnings` — только закрытые коды контракта (`length_off`, `trimmed`,
        `disclaimer_added`). Внутренние пометки (`service_terms`,
        `repeated_opener`, `partner_pronoun`) остаются в БД и в логах: это
        диагностика для нас, а не сообщение человеку.

        `error_code` есть только при `status: failed` — это код причины
        (`paragraphs`, `too_short`, `format`, `provider`, `cost_cap`,
        `monthly_cap`, `engine`). Право на совместимость при `failed` не
        списывается.

        С 1.6.7 маршрут **не** фильтрует по статусу: по `id` возвращается
        запись в любом состоянии, включая `failed`. Именно этим он отличается
        от списка: `failed` убран из истории, но остаётся доступен по прямой
        ссылке.
      security: [{ TelegramInitData: [] }]
      parameters:
        - name: compatibility_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Compatibility' }
        '404': { description: NOT_FOUND — совместимости нет или она чужая }

  /api/v1/engagement/forecast:
    get:
      tags: [engagement]
      summary: Прогноз на сегодня
      description: |
        Генерируется ночью пачкой и кэшируется по (chart_id, date).
        Бесплатный вариант — урезанный (is_paid=false), полный — для подписки.
        Никогда не генерируется в момент запроса.
      security: [{ TelegramInitData: [] }]
      parameters:
        - name: chart_id
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Forecast' }
        '404':
          description: |
            Прогноза нет. `Problem.details.reason`:
              • `not_ready` — карта есть, но ночной джоб ещё не положил строку:
                приложение остаётся на экране «готовится» и `GET /me` не
                перечитывает;
              • `no_chart` — карты нет или она чужая: приложение уходит в
                онбординг.
            Тексты читать не нужно: они для человека, признак — `reason`.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /api/v1/engagement/ask:
    post:
      tags: [engagement]
      summary: «Спроси карту» — вопрос по своей карте
      description: Квота 5/день для подписки, 1/день для бесплатных. Ответ опирается на позиции карты.
      security: [{ TelegramInitData: [] }]
      responses:
        '200':
          description: Ответ
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AskResponse' }
        '422':
          description: |
            `VALIDATION_FAILED` + `details.field_errors`: вопрос короче 3 или
            длиннее 500 знаков, либо `chart_id` не uuid.
        '404':
          description: |
            Карты нет или она чужая (`NOT_FOUND`), `details.reason = no_chart`.
            Вопросу без карты некуда идти: клиент ведёт человека в онбординг.
            `402` на этот маршрут не отдаётся.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429':
          description: |
            Квота исчерпана (`QUOTA_EXCEEDED`), заголовки RateLimit-*.
            `details.quota_code = ask_daily`, `details.reset_at` — когда лимит
            обновится (местная полночь места рождения). Проверяется **до**
            вызова модели.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AskRequest' }

  /api/v1/forecast/today:
    get:
      tags: [forecast]
      summary: Прогноз дня
      description: |
        Прогноз на **местную дату места рождения** (часовой пояс из профиля,
        `profiles.place_tz`). Ограничение честное: если человек уехал в другой
        город, прогноз всё равно считается по поясу рождения — другого пояса у
        нас нет, и это написано на экране.

        Текст пишет модель **один раз в сутки на человека**; факты (Луна на
        полдень, фаза, ретро-планеты, транзиты к Солнцу/Луне/Асценденту/MC,
        управитель дня, окна времени) считает Python-сайдкар детерминированно.
        Повторный запрос в тот же день отдаёт сохранённый текст и не вызывает
        модель. Маршрута «перегенерировать» нет.

        Без действующей подписки модель не вызывается вообще: `status =
        facts_only`, `sections` пустой, в `facts` — знак Луны, фаза и
        освещённость. Это `200`, а не `403`: человек видит, что прогноз есть.
      security: [{ TelegramInitData: [] }]
      responses:
        '200':
          description: Прогноз готов или доступны только факты
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ForecastDay' }
        '403':
          description: |
            `FORBIDDEN`, `details.reason = subscription_required` — подписки
            нет, а `FORECAST_FREE_FACTS=0` (бесплатных фактов не показываем).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404':
          description: |
            Карты нет (`details.reason = chart_not_found`) — приложение ведёт в
            онбординг.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '503':
          description: |
            Прогноз не получился. `details.reason`:
              • `forecast_failed` — модель не ответила, ответ не разобрался или
                текст не прошёл проверку. Повтор возможен через 60 секунд;
              • `forecast_breaker_open` — три провала подряд, генерация
                приостановлена до починки.
            Вчерашний текст и заглушка в этом случае **не отдаются**: человек
            читал бы их как прогноз на сегодня. `details.code` уточняет
            причину для поддержки, клиенту он не нужен.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /api/v1/questions:
    post:
      tags: [questions]
      summary: Задать вопрос карте
      description: |
        Вопрос 10–300 знаков после `trim`, ссылки запрещены. Ответ готовится в
        фоне, поэтому успешный приём — всегда `202`: клиент опрашивает
        `GET /questions/{id}`.

        `Idempotency-Key` обязателен: повтор с тем же ключом возвращает тот же
        `id` и второго вызова модели не делает.

        Отказ по теме (медицина, юристы, кредиты, смерть, вопросы про третьих
        лиц, 18+) детерминированный и происходит **до** модели: ответ приходит
        сразу со `status = refused`, `reason` — из закрытого списка, квота не
        тратится, расход нулевой.
      security: [{ TelegramInitData: [] }]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, maxLength: 64 }
          description: Тот же ключ → тот же вопрос, без второго вызова модели.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question]
              properties:
                question:
                  type: string
                  minLength: 10
                  maxLength: 300
                  example: Стоит ли мне менять работу этой осенью?
      responses:
        '202':
          description: Вопрос принят (или отклонён по теме)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QuestionAccepted' }
        '403':
          description: |
            `details.reason`:
              • `subscription_required` — подписки нет (`QUESTION_FOR_NON_SUBSCRIBERS=0`);
              • `quota_exhausted` — дневной лимит вопросов исчерпан.
                `details.quota = {used, limit, resets_at}`, `details.resets_at` —
                местная полночь места рождения.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404':
          description: Карты нет (`details.reason = chart_not_found`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: |
            `CONFLICT`, `details.reason = question_in_progress` — предыдущий
            вопрос ещё готовится. Квота за отклонённый запрос не списывается.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: |
            `VALIDATION_FAILED` + `details.field_errors`: вопрос пустой, короче
            10 или длиннее 300 знаков, содержит ссылку; либо нет
            `Idempotency-Key`.
        '429':
          description: |
            `QUOTA_EXCEEDED`, `details.reason = daily_cost_cap` — дневной потолок
            расходов на вопросы (`LLM_QUESTION_DAILY_CAP_RUB`). `resets_at` —
            местная полночь. Ответ `429`, а не молчание: человек должен
            понимать, что лимит на сегодня, а не что приложение сломалось.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
      get:
        tags: [questions]
        summary: История вопросов
        description: |
          Свежие сверху. **Какие статусы попадают в список (1.6.7):** `ready`,
          `refused`, `pending`.

            • `refused` — настоящий ответ («про здоровье не отвечаю»), а не
              сбой: человек должен видеть, что спросил и получил ответ;
            • `pending` — нужен, чтобы восстановить экран после закрытия
              мини-аппа и отличить `409 question_in_progress` от «вопроса не
              было»;
            • `failed` — **не отдаётся никогда**: сбой генерации это наша
              внутренняя история, а не ответ карты, и квота за неудачу не
              списывается (она возвращается).

          По `id` запись со `status: failed` по-прежнему доступна — этим
          занимается `GET /questions/{id}`. Фильтр применён до `LIMIT`, поэтому
          `total` считается от того же набора, что и список.

          **Пагинация (1.6.8).** `limit` (1…20, по умолчанию 20) и `offset`
          (по умолчанию 0). `total` — сколько записей всего после фильтра:
          отдельный `count`, а не окно поверх выборки, иначе на последней
          странице он показывал бы ноль.
        security: [{ TelegramInitData: [] }]
        parameters:
          - name: limit
            in: query
            required: false
            schema: { type: integer, minimum: 1, maximum: 20, default: 20 }
          - name: offset
            in: query
            required: false
            schema: { type: integer, minimum: 0, default: 0 }
        responses:
          '200':
            description: OK
            content:
              application/json:
                schema: { $ref: '#/components/schemas/QuestionList' }

  /api/v1/questions/{question_id}:
    get:
      tags: [questions]
      summary: Ответ на вопрос
      description: |
        Возвращает запись в **любом** статусе, включая `failed`: маршрут не
        фильтрует по статусу, и именно поэтому клиент может опрашивать
        `pending` → `ready`/`failed`.

        `status = pending` — ответ ещё готовится, `sections` пустой.
        `status = refused` — отказ по теме: `reason` из закрытого списка, текст
        в `message`, разделов нет. `status = failed` — генерация не удалась,
        повтор — новый вопрос с новым `Idempotency-Key`; квота за неудачу
        возвращена, в истории (`GET /questions`) такой записи нет.
      security: [{ TelegramInitData: [] }]
      parameters:
        - name: question_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Question' }
        '404':
          description: Вопроса нет или он чужой (`details.reason = question_not_found`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /api/v1/billing/subscription:
    get:
      tags: [billing]
      summary: Состояние подписки
      security: [{ TelegramInitData: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubscriptionState' }

  /api/v1/subscription/cancel:
    post:
      tags: [billing]
      summary: Отключить автопродление подписки
      description: |
        Гасит **только автопродление**. Оплаченный период не возвращается и не
        сокращается: `is_active` остаётся `true`, все права подписки — на месте
        до `current_period_end`. Отмена ≠ возврат звёзд.

        Зачем маршрут: кнопка «открыть подписки в Telegram» ведёт на адрес,
        которого в Telegram нет, поэтому до 1.6.5 отменить автопродление из
        приложения было нельзя вообще. Единственным способом было удалить
        аккаунт (`DELETE /me`) — то есть «не продлевай, но потеряй всё».

        Идемпотентность: `Idempotency-Key` обязателен (как у `POST /reports`).
        Повтор после успеха — **`409 already_cancelled`**, а не `200`: клиент
        должен отличать «отменили сейчас» от «уже было отменено», иначе кнопка
        «Отменить» остаётся на экране там, где отменять нечего.

        Запрос идёт в Bot API (`editUserStarSubscription(is_canceled: true)`) с
        `charge_id` **последнего успешного** платежа подписки. Пока Telegram не
        подтвердил, `auto_renew` не меняется: обещать «отменено», когда звёзды
        всё ещё спишутся, — это ровно та ошибка, из-за которой маршрут появился.
        Неуспех (`502`) пишется в `subscriptions.telegram_cancel_state` и
        повторяется ночным джобом (окно 30 дней, до 5 попыток — тот же механизм,
        что у `DELETE /me`). Повторное нажатие «Отменить» после `502` пробует
        снова сразу, не дожидаясь джоба.
      security: [{ TelegramInitData: [] }]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, maxLength: 64 }
          description: |
            Ключ идемпотентности: до 64 символов, буквы, цифры, «-», «_», «.»,
            «:». Без него — `422 VALIDATION_FAILED` с
            `details.field_errors[0].field = "Idempotency-Key"`.
      responses:
        '200':
          description: |
            Автопродление отключено: Bot API подтвердил, доступ сохранён до
            `current_period_end`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubscriptionCancelResult' }
        '409':
          description: |
            Отменять нечего. `Problem.code = CONFLICT`, причина — в
            `details.reason`:

            * `no_active_subscription` — подписки нет, она истекла или уже
              отменена удалением аккаунта;
            * `already_cancelled` — автопродление уже отключено (повтор после
              успеха).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: Нет или неверный `Idempotency-Key`.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '502':
          description: |
            Telegram не подтвердил отмену. `Problem.code = INTERNAL` (в
            контракте нет отдельного кода для Bot API — так же отвечает
            `POST /billing/invoice`), причина — в `details.reason`:

            * `telegram_error` — Bot API ответил `ok:false` (например,
              `CHARGE_ID_INVALID`);
            * `timeout` — не ответил за 5 секунд;
            * `no_charge_id` — у подписки нет `charge_id`: платёж прошёл, а
              идентификатор мы не сохранили. Это **наш** дефект, он виден
              отдельным счётчиком `subscription_cancel_no_charge_id_24h`.

            `auto_renew` при этом не меняется; повтор придёт из ночного джоба.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /api/v1/billing/plans:
    get:
      tags: [billing]
      summary: Витрина тарифов
      description: |
        Что продаётся, за сколько и что это даёт — единственный источник
        этого списка. С 1.5.9 клиент не хранит набор тарифов и их цены: он
        рисует ответ, поэтому смена цены или названия не требует релиза
        клиента, а тестовый тариф можно показать, не правя фронт.

        Тестовые тарифы (`test_1`, `test_report_1`) попадают в ответ только
        при `PAYMENTS_TEST_PLANS=1`, с `test: true` и после каталога. При
        выключенном флаге их нет в ответе вообще — ни полем, ни «серыми».

        Ответ не кэшируется (`Cache-Control: no-store`): он зависит от флага
        окружения, и прокси с кэшем показал бы либо старый список без
        тестовых, либо тестовые после выключения.
      security: [{ TelegramInitData: [] }]
      responses:
        '200':
          description: OK
          headers:
            Cache-Control:
              schema: { type: string, enum: ['no-store'] }
              description: Витрина зависит от окружения процесса, кэшировать её нельзя.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlansResponse' }

  /api/v1/billing/invoice:
    post:
      tags: [billing]
      summary: Создать инвойс в Stars
      description: |
        Для подписок передаётся subscription_period, для разовых — обычный инвойс.
        Ссылка открывается через Telegram.WebApp.openInvoice.

        `chart_id` обязателен для `one_149` (полный разбор): товар привязан
        к конкретной карте, и разбор потом открывается только по ней. Фронт
        подставляет карту явно, даже если она у пользователя одна — скрытой
        привязки к «первой карте» нет (1.5.2). Для остальных планов `chart_id`
        необязателен; если передан — проверяется, что карта своя.

        Счёт на разбор по карте, за которую разбор уже куплен, не выставляется
        (`422`, `details.reason = report_already_owned`): второй раз платить
        не за что, а списание за уже имеющийся товар — возврат и переписка.
        Проверка смотрит на доступ к карте, а не на цену плана.
      security: [{ TelegramInitData: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InvoiceRequest' }
      responses:
        '201':
          description: Инвойс создан
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invoice' }
        '422':
          description: |
            Неизвестный план, чужая карта, отсутствует `chart_id` у `one_149`,
            разбор для этой карты уже куплен или неизрасходованная
            совместимость уже есть — `VALIDATION_FAILED` +
            `details.field_errors[{field, message}]`; `details.reason` уточняет
            причину (`chart_not_found`, `chart_required_for_report`,
            `report_already_owned`, `compat_already_owned`,
            `invoice_request_invalid`). `compat_already_owned` (1.6.0)
            приходит с `field_errors[0].field = chart_id`: подсвечивать надо
            выбор пары, а не тариф.
        '409':
          description: |
            Тариф нельзя оплатить у платформы, а не у нас:
            `details.reason = plan_period_unsupported` (1.6.1). Telegram
            принимает звёздные подписки только на 30 дней, поэтому недельный
            и годовой тарифы подписками не выставляются. Ответ приходит
            **без** обращения к Bot API, с готовым текстом для человека —
            вместо прежнего `502` «не удалось создать счёт». Что делать с
            этими тарифами, решает владелец (`payments.md` §3.6).
        '429':
          description: 'Слишком много инвойсов (антифрод): 3 в час, 10 в сутки — Problem.code = RATE_LIMITED'

  /api/v1/internal/telegram/webhook/{secret}:
    post:
      tags: [internal]
      summary: Вебхук Telegram Bot API
      description: |
        Принимает updates. Обязательные типы: pre_checkout_query, message.successful_payment,
        edited_message (не нужен), my_chat_member (не нужен).
        Доставка «at least once» — обработчик обязан быть идемпотентным по telegram_payment_charge_id.
        Секрет в пути + проверка заголовка X-Telegram-Bot-Api-Secret-Token.
      security: []
      parameters:
        - name: secret
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Принято }
        '403': { description: Неверный секрет }
        '500':
          description: |
            Временная ошибка (например, БД недоступна). Ответ не 2xx заставляет Telegram
            повторить доставку — обработчик идемпотентен по telegram_payment_charge_id.

  /api/v1/internal/jobs/run:
    post:
      tags: [internal]
      summary: Триггер воркеров (крон, защищён секретом)
      description: |
        Запускается кроном (`infra/systemd/astro-jobs.timer`, раз в 10 минут),
        не пользователем: `security: []`, доступ даёт заголовок `X-Jobs-Secret`
        (`INTERNAL_JOB_SECRET`). Секрет не задан в окружении — маршрут закрыт
        всегда (`403`).

        `job` — конкретная работа или пусто (все). Джобы идемпотентны:
        повторный запуск не дублирует возвраты, сообщения и удаления.

        Ответ — счётчики сделанного за запуск; нули означают «делать было
        нечего», а не «не сработало».
      security: []
      parameters:
        - name: X-Jobs-Secret
          in: header
          required: true
          schema: { type: string }
        - name: job
          in: query
          required: false
          schema:
            type: string
            enum:
              - subscriptions_downgrade
              - pending_payments_resolve
              - refund_undelivered
              - report_refund
              - pdn_retention_cleanup
              - forecast_nightly
              - forecast_push
      responses:
        '202':
          description: Работы выполнены, счётчики в теле
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobRunResult' }
        '403':
          description: Нет секрета или он неверный (FORBIDDEN)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /api/v1/admin/metrics:
    get:
      tags: [internal]
      summary: Метрики продукта
      description: |
        Доступ только для `ADMIN_TG_ID` из переменной окружения (иначе `403`).
        Без ПДн: только агрегаты.

        Воронка считается по `events.occurred_at` — клиентскому времени
        события, — поэтому опоздавший батч (`occurred_at` до суток назад) попадает в
        свой день, а не в день доставки. Окно — 30 дней, `occurred_at` не
        старше суток от серверного времени (см. `POST /events`).
      security: [{ TelegramInitData: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  mau: { type: integer }
                  paying: { type: integer }
                  conversion_to_paid: { type: number }
                  churn_30d: { type: number }
                  stars_received_30d:
                    type: integer
                    description: |
                      Звёзды за 30 дней без возвратов и отказов. Платежи по
                      тестовому тарифу (`is_test`) не входят: это проверка
                      оплаты, а не выручка.
                  llm_cost_rub_30d:
                    type: number
                    description: |
                      Стоимость LLM за 30 дней в рублях — сумма `reports.llm_cost_rub`.
                      Одна формула: токены × цена модели из таблицы `LLM_MODEL`
                      (вход и выход по одной цене). Долларовой оценки больше нет:
                      она всегда была нулём и противоречила рублёвой.
                  reports_failed_30d: { type: integer }
                  reports_validation_streak:
                    type: integer
                    description: |
                      Сколько разборов подряд упало на валидации текста
                      (`error_code` из `too_short`, `too_long`, `format`,
                      `forbidden_terms`, `paragraphs`, `repeats`, а также
                      старый общий `validation`). Успешный разбор серию
                      обнуляет.
                  reports_breaker_open:
                    type: boolean
                    description: |
                      Закрыт ли приём новых разборов прямо сейчас: серия
                      `reports_validation_streak` ≥ 3 и последний провал не
                      старше 30 минут. Пока `true`, `POST /reports` отвечает
                      `503` с `details.reason = report_breaker_open`.
                  reports_breaker_last_failed_at:
                    type: [string, 'null']
                    format: date-time
                    description: |
                      Время последнего провала серии (`null` — серии нет).
                      По нему видно, когда брейкер закроется сам.
                  payments_rejected_30d:
                    type: integer
                    description: |
                      Платежи, по которым доступ не выдан: нет серверного инвойса,
                      сумма не совпала с ценой плана, неизвестный план.
                      Главный счётчик QA-11 — отказ по деньгам должен быть виден
                      в метриках, а не только в логах.
                  amount_mismatch_30d: { type: integer }
                  refunded_30d: { type: integer }
                  pending_payments_now:
                    type: integer
                    description: Платежи `processed = false` прямо сейчас
                  pre_checkout_total_24h:
                    type: integer
                    description: |
                      Сколько `pre_checkout_query` дошло до нас за 24 часа
                      (события `pre_checkout_received`). Ноль при живых
                      попытках оплаты — вебхук не доставляет апдейты.
                  pre_checkout_rejected_24h:
                    type: integer
                    description: |
                      Сколько запросов мы отклонили за 24 часа
                      (`pre_checkout_rejected`): не сошлась сумма, счёт
                      отменён, план исчез. Причина — в `reject_reason` платежа
                      и в логе `pre_checkout_rejected`.
                  pre_checkout_timeout_24h:
                    type: integer
                    description: |
                      Сколько раз мы не успели ответить Telegram за 10 секунд
                      (`pre_checkout_timeout`). Каждый такой случай — неудачная
                      попытка оплаты, которую человек видел как «ошибка».
                  successful_payment_total_24h:
                    type: integer
                    description: |
                      Сколько `successful_payment` дошло за 24 часа, любой
                      исход (включая возвраты и отказы): это факты списания
                      звёзд, а не продажи.
                  payment_failed_24h:
                    type: integer
                    description: |
                      Из них — те, по которым доступ не выдан (`status =
                      'rejected'`). Растёт вместе с `pre_checkout_rejected_24h`
                      — значит проблема в данных счёта, а не в доставке.
                  telegram_webhook_ok:
                    type: boolean
                    description: |
                      Подтверждён ли ожидаемый адрес вебхука **сейчас**
                      (1.6.2): `true` только если последняя проверка моложе
                      суток и адрес совпал. `false` при `telegram_webhook:
                      stale|unreachable` в `/health`.
                  telegram_webhook_checked_at:
                    type: [string, 'null']
                    format: date-time
                    description: |
                      Когда вебхук проверяли в последний раз (`null` — ни разу
                      с момента старта API). В паре с `telegram_webhook_ok`
                      отвечает на вопрос «данные свежие или с прошлого
                      деплоя».
                  test_plans_active:
                    type: boolean
                    description: |
                      Включены ли тестовые тарифы прямо сейчас
                      (`PAYMENTS_TEST_PLANS=1`). В `test_payments_30d` видно,
                      что тестовые платежи были; здесь — что витрина отдаёт
                      тарифы за 1 ⭐ в эту минуту. `true` на проде означает,
                      что флаг забыт: `check.sh --prod` такое не пропускает,
                      а метрика показывает, если проверку обошли.
                  test_payments_30d:
                    type: integer
                    description: |
                      Платежи по тестовому тарифу (`test_1`, `test_report_1`) за 30 дней.
                      Считаются отдельно и в выручку не входят: это проверка
                      оплаты владельцем, а не продажа. Ненулевое значение на
                      проде означает забытый `PAYMENTS_TEST_PLANS`.
                  subscription_cancel_failed_30d:
                    type: integer
                    description: |
                      Сколько раз отмена автопродления в Telegram не прошла за
                      30 дней (события `subscription_cancel_failed`). История, а
                      не очередь: успешный повтор счётчик не уменьшает.
                  subscriptions_cancelled_pending_telegram:
                    type: integer
                    description: |
                      Сколько отменённых подписок прямо сейчас ждут повтора в
                      Telegram (`telegram_cancel_state = 'failed'`). Ноль —
                      очередь пуста; рост — повтор не справляется.
                  subscription_cancel_total_24h:
                    type: integer
                    description: |
                      Сколько отмен автопродления прошло за сутки (события
                      `subscription_cancelled`). Считаются оба пути: кнопка в
                      приложении и `DELETE /me`.
                  subscription_cancel_failed_24h:
                    type: integer
                    description: |
                      Из них сколько не прошло за сутки (события
                      `subscription_cancel_failed`). Рост при растущем
                      `subscription_cancel_total_24h` — проблема Bot API;
                      рост при нулевом — единичные сбои, чинятся повтором.
                  subscription_cancel_no_charge_id_24h:
                    type: integer
                    description: |
                      Отмены за сутки, не прошедшие из-за отсутствия
                      `charge_id`. Это **наш** дефект данных (платёж прошёл, а
                      идентификатор не сохранили), а не ошибка Telegram.
                      Ноль — норма; любое другое значение — повод искать
                      платежи без `telegram_payment_charge_id`.
                  subscriptions_auto_renew_off:
                    type: integer
                    description: |
                      Сколько действующих подписок уже не продлятся
                      (`auto_renew = false` при живом доступе). Это не отток, а
                      честная отмена: доступ у этих людей есть до
                      `expires_at`.
                  events_30d:
                    type: object
                    description: |
                      Счётчики событий по именам за 30 дней; считается по
                      `events.occurred_at`. Нулевые имена не отдаются.
                    additionalProperties: { type: integer }
                    example: { app_open: 1280, chart_created: 412, payment_succeeded: 37 }
                  funnel_30d:
                    type: object
                    description: |
                      Воронка по `occurred_at`: сколько уникальных пользователей
                      дошло до шага.
                    properties:
                      app_open: { type: integer }
                      consent_accepted: { type: integer }
                      chart_created: { type: integer }
                      checkout_opened: { type: integer }
                      payment_succeeded: { type: integer }
                  forecast_ready_24h:
                    type: integer
                    description: Прогнозов дня сгенерировано за 24 часа (события `forecast_ready`).
                  forecast_failed_24h:
                    type: integer
                    description: |
                      Провалов генерации за 24 часа. Три подряд открывают
                      брейкер: дальше `GET /forecast/today` отвечает `503
                      forecast_breaker_open` без вызова модели.
                  forecast_facts_only_24h:
                    type: integer
                    description: |
                      Экран без подписки за 24 часа. Модель при этом не
                      вызывалась — значит, расход нулевой, и цифра не должна
                      попадать в `forecast_cost_rub_24h`.
                  forecast_cache_hits_24h:
                    type: integer
                    description: |
                      Повторных запросов за 24 часа, обслуженных сохранённым
                      текстом. Это прямая экономия: кэш-попадание стоит 0 ₽.
                  forecast_cost_rub_24h:
                    type: number
                    description: Сумма `daily_forecasts.cost_rub` за 24 часа, рубли.
                  compat_failed_24h:
                    type: integer
                    description: |
                      Провалов совместимости за 24 часа (`reports.kind =
                      'compat'`, `status = 'failed'`, по `updated_at` — как и
                      `compat_failed_30d`). С 1.6.7 неудачный заказ не виден
                      человеку в `GET /compatibility`, поэтому цифра здесь
                      важнее: без неё провал был бы виден только в логе
                      `compat_failed` (там же причина — `code`).
                  compat_cost_rub_24h:
                    type: number
                    description: |
                      Стоимость совместимостей за 24 часа (`reports.llm_cost_rub`
                      при `kind = 'compat'`), рубли. Отдельная цифра появилась
                      в 1.6.11 для алерта «расход LLM»: без неё сумма
                      `forecast_cost_rub_24h + questions_cost_rub_24h` не видит
                      третий источник трат.
                  questions_ready_24h: { type: integer }
                  questions_failed_24h:
                    type: integer
                    description: |
                      Генераций вопроса, упавших за 24 часа. В истории
                      (`GET /questions`) такие записи не показываются с 1.6.7,
                      поэтому это единственная серверная цифра по ним; причина
                      — в логе `question_failed` (`error_code`), текст вопроса
                      в лог не попадает.
                  questions_refused_24h:
                    type: integer
                    description: |
                      Отказов по теме за 24 часа. Квота за них не тратится и
                      модель не вызывается, поэтому в `questions_cost_rub_24h`
                      они не входят.
                  questions_refused_by_reason:
                    type: object
                    description: |
                      Отказы за 24 часа по причинам: `medical`, `legal`,
                      `money`, `death`, `third_party`, `adult`. Разбивка нужна
                      продукту — «пять отказов» и «пять отказов про здоровье»
                      ведут к разным решениям.
                    additionalProperties: { type: integer }
                    example: { medical: 3, third_party: 2 }
                  questions_cost_rub_24h: { type: number }
                  question_p95_ms:
                    type: integer
                    description: |
                      p95 времени от вставки вопроса до готового текста, мс.
                      Это время, которое человек проводит в ожидании после
                      `202`, — включая вызов модели.
                  share_cards_created_24h:
                    type: object
                    description: |
                      Сколько карточек шеринга собрано за 24 часа — по видам
                      (1.6.12): `day`, `wheel`, `insight`, `identity`, `moon`.
                      Ключи есть всегда: ноль значит «не создавали», и это
                      осмысленнее пропущенного ключа. Считается по
                      `share_cards.created_at`, то есть по реальным сборкам:
                      кэш-попадание новую строку не создаёт.
                    additionalProperties: { type: integer }
                    example: { day: 12, wheel: 3, insight: 2, identity: 5, moon: 21 }
        '403': { description: FORBIDDEN }

  /api/v1/admin/alerts:
    get:
      tags: [internal]
      summary: Алерты для внешнего мониторинга
      description: |-
        Доступ только для `ADMIN_TG_ID` из переменной окружения (иначе `403`),
        как у `/admin/metrics`.

        Шесть правил, которые настраиваются в любом uptime-сервисе по `id`
        (`fired: true` — пора будить человека). Значения считаются из тех же
        данных, что и метрики: ничего нового не хранится, истории превышений
        нет — `since` пересчитывается по накопленной сумме в окне.

        | `id` | уровень | условие |
        |---|---|---|
        | `payment_not_arriving` | critical | `pre_checkout_rejected_24h + payment_failed_24h > 0` — человек нажал «купить» и не получил доступ |
        | `telegram_webhook` | critical | `telegram_webhook != ok` дольше 10 минут — это оплата и inline-шаринг |
        | `subscription_cancel_blocked` | critical | `subscription_cancel_no_charge_id_24h > 0` — отменить не можем, а спишется |
        | `llm_spend` | warning | `forecast_cost_rub_24h + questions_cost_rub_24h + compat_cost_rub_24h > 500` ₽ — бюджет GigaChat неизвестен |
        | `generations_failing` | warning | `compat_failed_24h + forecast_failed_24h + questions_failed_24h + pdf_failed_24h > 5` — модель или промпт сломались |
        | `backup_stale` | warning | последний успешный дамп старше 36 часов (или маркера нет вовсе — «не знаем» тоже плохо) |

        Единицы `value`: штуки (`payment_not_arriving`,
        `subscription_cancel_blocked`, `generations_failing`), минуты
        (`telegram_webhook`), рубли (`llm_spend`), часы (`backup_stale`).
        `value: null` — значение неизвестно (не было проверки вебхука, нет
        маркера бэкапа).
      security: [{ TelegramInitData: [] }]
      responses:
        '200':
          description: Текущие значения всех алертов
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AlertsResponse' }
        '403': { description: FORBIDDEN }

# Закрытый список событий, которые отправляет КЛИЕНТ (контракт 1.5.1).
# Совпадает с ANALYTICS_EVENTS в apps/api/src/modules/events/events.dto.ts и с
# enum ClientEvent.name: новое имя добавляется здесь и в коде ОДНИМ PR, иначе
# сервер отбросит весь батч (422) и данные потеряются молча.
#
# Почему имён больше, чем экранов: до 1.5.1 фронт и бэк вели два разных набора
# имён для одних и тех же шагов. Оба приняты, чтобы не терять события, и оба
# помечены в x-event-aliases. В 1.6.0 останется по одному имени на шаг, второй
# будет удалён — это отдельный PR, после того как фронт подтвердит фактические
# имена в отчёте.
# События, которые присылает клиент (`POST /events`). Список закрытый: имя вне
# него — `422` на весь батч. Закрытые `props` у двух событий — `share_sent`
# (1.6.9) и `share_saved` (1.6.12); см. `x-event-strict-props`.
#
# Комментарии внутри списка не ставить: тесты фронта читают его построчно и
# останавливаются на первой строке, которая не `  - имя`.
