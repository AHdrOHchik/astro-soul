# События ТОЛЬКО серверные: клиент их не отправляет (попытка отправить — 422),
# API пишет их в таблицу events сам. В метриках видны счётчиками.
# Состояния инвойса (требование к коду, схемой не выражается).
# `invoices.status`: created → paid | invalidated.
#   • created     — выставлен, оплата принимается;
#   • paid        — оплачен, доступ выдан;
#   • invalidated — аннулирован вместе с удалением данных (`DELETE /me`).
#     Оплата по нему не принимается никогда: `pre_checkout_query` → ok=false,
#     `successful_payment` → отказ, автоматический возврат звёзд, событие
#     `refund_issued` с `props.code = invoice_invalidated`.
# Владелец инвойса удалён, а сам инвойс ещё `created` — запрещённое состояние:
# инвалидация идёт в одной транзакции с `DELETE users`, до неё платёж
# отклоняется по проверке существования пользователя (`user_deleted`).
x-invoice-states:
  created: { payable: true, grants_access: false }
  paid: { payable: false, grants_access: true }
  invalidated: { payable: false, grants_access: false }

x-analytics-server-events:
  - payment_rejected
  - refund_issued
  - subscription_expired
  - subscription_cancelled
  - subscription_cancel_failed
  - forecast_ready
  - forecast_failed
  - forecast_facts_only
  - forecast_cache_hit
  - question_ready
  - question_refused
  - pdf_ready
  - pdf_failed
  - pdf_downloaded
  - share_card_opened
  - share_card_created
# payment_rejected — props: code (no_invoice | amount_mismatch | unknown_plan |
#                    invoice_invalidated | user_deleted | refund_failed)
#                    refund_failed означает: отказ записан, но звёзды вернуть
#                    не удалось — платёж виден в pending_payments_now.
# refund_issued    — props: code (report_failed | admin | delete_with_pending |
#                    invoice_invalidated | user_deleted)
#                    Одно имя для всех путей возврата: и поддержка, и
#                    автовозврат QA-15 пишут `refund_issued`, не `payment_refunded`.
# subscription_expired — props: last_plan
# subscription_cancelled — props: source (endpoint)
#                    Автопродление отключено (1.6.5). `source = endpoint` —
#                    кнопка в приложении (`POST /subscription/cancel`); у
#                    `DELETE /me` этого события нет: там отмена — часть
#                    удаления, и она видна в `account_deleted`.
# forecast_ready       — props: date, chars, warnings, cost_rub
#                    Текст прогноза дня сгенерирован. Повторный запрос в тот же
#                    день даёт `forecast_cache_hit`, а не второе событие.
# forecast_failed      — props: date, error_code
#                    Генерация не удалась (модель, формат, запрещённый текст,
#                    потолок стоимости). Три подряд открывают брейкер.
# forecast_facts_only  — props: date
#                    Экран без подписки: модель не вызывалась, показаны факты.
#                    Отдельное событие, потому что строки в БД у этого запроса нет.
# forecast_cache_hit   — props: date, prompt_version
#                    Прогноз отдан из сохранённого: деньги не потрачены.
# question_ready       — props: topic, question_hash, question_len, chars,
#                    warnings, cost_rub. Текста вопроса в событии нет никогда.
# question_refused     — props: reason (medical | legal | money | death |
#                    third_party | adult), topic. Отказ детерминированный, до
#                    модели: квота не тратится, расход нулевой.
# subscription_cancel_failed — props: code (telegram_error | timeout | no_charge_id),
#                    source (endpoint | delete; у повтора нет)
#                    Отмена автопродления не прошла. При `DELETE /me` `user_id`
#                    события уже NULL (пишется после обезличивания), при отмене
#                    из приложения — заполнен. Повтор идёт в
#                    `pdn_retention_cleanup`; после 5 неудач —
#                    `subscriptions.telegram_cancel_state = 'gave_up'`.
# share_card_created — props: kind, bytes, cached, template_version, build_ms
#                    (есть, когда карточка реально нарисована; у кэш-попадания
#                    его нет). `template_version` (1.6.12) — версия вёрстки,
#                    которая лежит в ключе кэша.
#                    «Мы отдали картинку»: `POST /share/card` отдал файл. Это
#                    НЕ отправка в чат — отправку сообщает клиент (`share_sent`),
#                    иначе метрика «поделились» считала бы генерации, как было
#                    до 1.6.9. Ни получателя, ни текста в событии нет.
# share_card_opened — props: kind, channel (link | miniapp), cached.
#                    Человек перешёл по `t.me/<bot>?start=sh_<short_id>`:
#                    переход сервер видит, отправку — нет.

# Ключи, которых не может быть в `props` события (`POST /events`).
# Совпадает с BANNED_PROP_KEYS в apps/api/src/modules/events/events.dto.ts:
# событие с таким ключом отбрасывается на сервере, оно не попадает в БД и
# не считается в `accepted`. Список закрытый — новый ключ добавляется здесь
# и в коде одним PR.
x-events-forbidden-prop-keys:
  - birth_date
  - birth_time
  - birth_place
  - date
  - time
  - place
  - city
  - query
  - lat
  - lon
  - tz
  - first_name
  - last_name
  - username
  - phone
  - email

# События с закрытым набором свойств (`POST /events`): значение вне списка или
# отсутствующее поле — `422` с `field_errors[{field: "events.props.<ключ>"}]`,
# лишние ключи вырезаются и в БД не попадают.
# Совпадает с STRICT_PROPS в apps/api/src/modules/events/events.dto.ts.
# Остальные клиентские события принимают свободные `props` (кроме запрещённых
# ключей ПДн) — но не свободные имена: список `x-analytics-events` закрыт.
x-event-strict-props:
  share_sent:
    kind: [day, wheel, insight, identity, moon]
    channel: [inline, link]
  share_saved:
    kind: [day, wheel, insight, identity, moon]
    target: [gallery, telegram_story]

# Шаблон ссылки шаринга на конкретную карту. `{username}` — имя бота из
# `BOT_USERNAME` сервера (без `@`), `{chart_id}` — `Chart.chart_id`.
# Бот по `startapp=chart_<id>` открывает мини-апп; карта поднимается через
