# События ТОЛЬКО серверные: клиент их не отправляет (попытка отправить — 422),
# API пишет их в таблицу events сам. В метриках видны счётчиками.
# Состояния инвойса (требование к коду, схемой не выражается).
# `invoices.status`: created → paid | invalidated.
#   • created     — выставлен, оплата принимается;
#   • paid        — оплачен, доступ выдан;
#   • invalidated — аннулирован вместе с удалением данных (`DELETE /me`).
#     Оплата по нему не принимается никогда: `pre_checkout_query` → ok=false,
#     `successful_payment` → отказ, автоматический возврат звёзд, событие
#     `refund_issued` с `props.code = invoice_invalidated`.
# Владелец инвойса удалён, а сам инвойс ещё `created` — запрещённое состояние:
# инвалидация идёт в одной транзакции с `DELETE users`, до неё платёж
# отклоняется по проверке существования пользователя (`user_deleted`).
x-invoice-states:
  created: { payable: true, grants_access: false }
  paid: { payable: false, grants_access: true }
  invalidated: { payable: false, grants_access: false }

x-analytics-server-events:
  - payment_rejected
  - refund_issued
  - subscription_expired
  - subscription_cancel_failed
# payment_rejected — props: code (no_invoice | amount_mismatch | unknown_plan |
#                    invoice_invalidated | user_deleted | refund_failed)
#                    refund_failed означает: отказ записан, но звёзды вернуть
#                    не удалось — платёж виден в pending_payments_now.
# refund_issued    — props: code (report_failed | admin | delete_with_pending |
#                    invoice_invalidated | user_deleted)
#                    Одно имя для всех путей возврата: и поддержка, и
#                    автовозврат QA-15 пишут `refund_issued`, не `payment_refunded`.
# subscription_expired — props: last_plan
# subscription_cancel_failed — props: code (telegram_error | timeout | no_charge_id)
#                    Отмена автопродления при `DELETE /me` не прошла. `user_id`
#                    события уже NULL: пишется после обезличивания, поэтому
#                    связывает не человека, а состояние. Повтор идёт в
#                    `pdn_retention_cleanup`; после 5 неудач —
#                    `subscriptions.telegram_cancel_state = 'gave_up'`.

# Ключи, которых не может быть в `props` события (`POST /events`).
# Совпадает с BANNED_PROP_KEYS в apps/api/src/modules/events/events.dto.ts:
# событие с таким ключом отбрасывается на сервере, оно не попадает в БД и
# не считается в `accepted`. Список закрытый — новый ключ добавляется здесь
# и в коде одним PR.
x-events-forbidden-prop-keys:
  - birth_date
  - birth_time
  - birth_place
  - date
  - time
  - place
  - city
  - query
  - lat
  - lon
  - tz
  - first_name
  - last_name
  - username
  - phone
  - email

