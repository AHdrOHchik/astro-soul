# Раздача собранного мини-аппа (apps/web/dist) за nginx.
#
# Зачем это в репозитории: статику мини-аппа отдаёт не API, и без явных
# заголовков кэширования релиз после смены версии согласия не доезжает до
# пользователя — он видит старый экран с устаревшей `CONSENT_VERSION` и
# получает 422 на «Принять». Файл — рабочий шаблон: скопировать в
# `/etc/nginx/conf.d/` и подставить домен и путь к dist.
#
# Правило простое: `index.html` не кэшируется, файлы с хэшем в имени
# кэшируются навсегда. Vite кладёт в `assets/` только файлы с хэшем
# (`index-a1b2c3d4.js`), поэтому «навсегда» безопасно.

server {
    listen 443 ssl http2;
    server_name app.astro-soul.example.com;

    # ssl_certificate     /etc/letsencrypt/live/app.astro-soul.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/app.astro-soul.example.com/privkey.pem;

    root /srv/astro-soul/apps/web/dist;
    index index.html;

    # Сжатие: мини-апп грузится из Telegram WebView по мобильной сети.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Точка входа: всегда ревалидируем. `no-cache` не запрещает кэш, а требует
    # спросить сервер (ETag/304), поэтому после релиза пользователь получает
    # новый index.html, а не вчерашний.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Файлы с хэшем в имени: содержимое по этому адресу не меняется никогда.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Иконки/манифест: короткий кэш, имя файла не хэшируется.
    location ~* \.(png|ico|webmanifest)$ {
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    # SPA: любой неизвестный путь отдаёт index.html (тоже без кэша).
    location / {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }
}
