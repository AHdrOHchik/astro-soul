name: ci

# Один прогон на PR и на main: линт, типы, тесты, миграции, Python-движок.
# Postgres поднимается сервис-контейнером GitHub Actions, docker compose
# в CI не запускается — только проверяется, что файл валиден.

on:
  push:
    branches: [main]
  pull_request:

# Комментарий с причиной падения — единственный канал, который читается из
# окружений без доступа к логам GitHub.
permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgres://astro:astro@127.0.0.1:5432/astro_soul
  TEST_DATABASE_URL: postgres://astro:astro@127.0.0.1:5432/astro_soul_test
  TELEGRAM_BOT_TOKEN: 123456789:CI-TOKEN-not-a-real-bot
  PSEUDONYM_PEPPER: ci-pepper-0123456789-0123456789-0123456789
  NODE_ENV: test

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: astro
          POSTGRES_PASSWORD: astro
          POSTGRES_DB: astro_soul
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U astro"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.3

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Python-зависимости движка
        run: python -m pip install -e 'packages/astro[dev]'

      - name: Node-зависимости
        run: pnpm install --frozen-lockfile

      - name: Тестовая БД
        run: PGPASSWORD=astro psql -h 127.0.0.1 -U astro -d astro_soul -c 'CREATE DATABASE astro_soul_test'

      # Docker в CI недоступен, но compose-файл обязан оставаться валидным.
      - name: docker compose config
        run: docker compose config -q

      - name: Миграции и планы
        run: |
          pnpm db:migrate
          pnpm db:seed

      # Отдельный шаг до общего `check`: тесты API и общих пакетов должны
      # отработать (и быть видны в логе), даже если `check` упадёт позже
      # на линте/типах фронта.
      # Логи пишем в файлы: без этого красный прогон нечем разобрать
      # (страница логов GitHub из песочницы не читается, а `gh run view
      # --log-failed` отдаёт EOF). Артефакт скачивается через API.
      - name: Тесты API, shared и UI
        shell: bash
        run: |
          set -eo pipefail
          mkdir -p ci-logs
          pnpm --filter @astro-soul/shared run build 2>&1 | tee ci-logs/shared-build.log
          pnpm --filter @astro-soul/api run test 2>&1 | tee ci-logs/api-tests.log
          pnpm --filter @astro-soul/shared run test 2>&1 | tee ci-logs/shared-tests.log
          pnpm --filter @astro-soul/ui run test 2>&1 | tee ci-logs/ui-tests.log

      - name: Линт, типы, тесты
        shell: bash
        # `tee` — чтобы при падении было что показать в PR: у этого шага
        # (линт/типы/тесты панели и веба) нет своего вывода нигде, кроме лога
        # Actions, который из песочницы не читается.
        run: |
          set -eo pipefail
          mkdir -p ci-logs
          pnpm check 2>&1 | tee ci-logs/check.log

      - name: Логи тестов при падении
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs
          path: ci-logs/
          retention-days: 7

      # Артефакт скачать тоже не всегда можно, а вот комментарий читается
      # любым клиентом. Поэтому причина падения пишется в PR одной строкой
      # на тест: комментарий обновляется, а не размножается.
      - name: Причина падения в PR
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const read = (path) => {
              try { return fs.readFileSync(path, 'utf8'); } catch { return ''; }
            };
            const source = read('ci-logs/check.log') + read('ci-logs/api-tests.log') +
              read('ci-logs/shared-tests.log') + read('ci-logs/ui-tests.log');
            const lines = source
              .replace(/\u001b\[[0-9;]*m/g, '')
              .split('\n')
              .filter((line) => /^( FAIL|AssertionError|Error:|TypeError:|\s+×)/.test(line) ||
                /Tests\s+\d+ failed/.test(line));
            const marker = '<!-- ci-failure-report -->';
            const body = [
              marker,
              '### CI: что упало',
              '',
              '```',
              lines.slice(0, 80).join('\n').slice(0, 55_000) || 'падение до запуска тестов (смотри артефакт ci-logs)',
              '```',
            ].join('\n');

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.find((comment) => comment.body?.includes(marker));

            if (existing === undefined) {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            } else {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            }
