name: ci

# Один прогон на PR и на main: линт, типы, тесты, миграции, Python-движок.
# Postgres поднимается сервис-контейнером GitHub Actions, docker compose
# в CI не запускается — только проверяется, что файл валиден.

on:
  push:
    branches: [main]
  pull_request:

# Комментарий с причиной падения — единственный канал, который читается из
# окружений без доступа к логам GitHub.
permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgres://astro:astro@127.0.0.1:5432/astro_soul
  TEST_DATABASE_URL: postgres://astro:astro@127.0.0.1:5432/astro_soul_test
  TELEGRAM_BOT_TOKEN: 123456789:CI-TOKEN-not-a-real-bot
  PSEUDONYM_PEPPER: ci-pepper-0123456789-0123456789-0123456789
  NODE_ENV: test

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: astro
          POSTGRES_PASSWORD: astro
          POSTGRES_DB: astro_soul
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U astro"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.3

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Python-зависимости движка
        run: python -m pip install -e 'packages/astro[dev]'

      - name: Node-зависимости
        run: pnpm install --frozen-lockfile

      - name: Тестовая БД
        run: PGPASSWORD=astro psql -h 127.0.0.1 -U astro -d astro_soul -c 'CREATE DATABASE astro_soul_test'

      # Docker в CI недоступен, но compose-файл обязан оставаться валидным.
      - name: docker compose config
        run: docker compose config -q

      - name: Миграции и планы
        run: |
          pnpm db:migrate
          pnpm db:seed

      # Отдельный шаг до общего `check`: тесты API и общих пакетов должны
      # отработать (и быть видны в логе), даже если `check` упадёт позже
      # на линте/типах фронта.
      # Логи пишем в файлы: без этого красный прогон нечем разобрать
      # (страница логов GitHub из песочницы не читается, а `gh run view
      # --log-failed` отдаёт EOF). Артефакт скачивается через API.
      - name: Тесты API, shared и UI
        shell: bash
        run: |
          set -eo pipefail
          mkdir -p ci-logs
          pnpm --filter @astro-soul/shared run build 2>&1 | tee ci-logs/shared-build.log
          pnpm --filter @astro-soul/api run test 2>&1 | tee ci-logs/api-tests.log
          pnpm --filter @astro-soul/shared run test 2>&1 | tee ci-logs/shared-tests.log
          pnpm --filter @astro-soul/ui run test 2>&1 | tee ci-logs/ui-tests.log
          # Панель и веб — теми же командами, что в `pnpm check`. Явно, а не
          # через `pnpm -r`: иначе непонятно, что именно упало, и зеленеет ли
          # шаг на самом деле.
          pnpm --filter @astro-soul/admin run test 2>&1 | tee ci-logs/admin-tests.log
          pnpm --filter @astro-soul/web run test 2>&1 | tee ci-logs/web-tests.log

      - name: Линт, типы, тесты
        shell: bash
        # `tee` — чтобы при падении было что показать в PR: у этого шага
        # (линт/типы/тесты панели и веба) нет своего вывода нигде, кроме лога
        # Actions, который из песочницы не читается.
        run: |
          set -eo pipefail
          mkdir -p ci-logs
          pnpm check 2>&1 | tee ci-logs/check.log

      - name: Логи тестов при падении
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs
          path: ci-logs/
          retention-days: 7

      # Артефакт скачать тоже не всегда можно, а вот комментарий читается
      # любым клиентом. Поэтому причина падения пишется в PR одной строкой
      # на тест: комментарий обновляется, а не размножается.
      - name: Причина падения в PR
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const read = (path) => {
              try { return fs.readFileSync(path, 'utf8'); } catch { return ''; }
            };
            const source = read('ci-logs/check.log') + read('ci-logs/api-tests.log') +
              read('ci-logs/shared-tests.log') + read('ci-logs/ui-tests.log') +
              read('ci-logs/admin-tests.log') + read('ci-logs/web-tests.log');
            // Строки в логе префиксованы именем пакета (`apps/api test:  FAIL …`),
            // поэтому ищем подстроку, а не начало строки.
            const lines = source
              .replace(/\u001b\[[0-9;]*m/g, '')
              .split('\n')
              .filter((line) =>
                /FAIL |AssertionError|TypeError:|Tests\s+\d+ failed/.test(line) ||
                /^\s*×/.test(line));
            const marker = '<!-- ci-failure-report -->';
            const body = [
              marker,
              '### CI: что упало',
              '',
              '```',
              lines.slice(0, 80).join('\n').slice(0, 55_000) || 'падение до запуска тестов (смотри артефакт ci-logs)',
              '```',
            ].join('\n');

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.find((comment) => comment.body?.includes(marker));

            if (existing === undefined) {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            } else {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            }

  # Б-2 (итерация 45): образ админки. До этого CI проверял только артефакт
  # `apps/admin/dist`; Dockerfile существовал отдельно от проверки, поэтому
  # «образ собирается» было обещанием, а не фактом. Здесь он собирается
  # по-настоящему и проверяется как контейнер: отдаёт index.html, закрыт от
  # индексирования и от встраивания в iframe.
  #
  # Отдельная джоба, а не шаг в `check`: сборка образа не должна удлинять
  # прогон тестов и падать по причинам, не связанным с кодом.
  admin-image:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Сборка образа админки
        run: docker build --file docker/admin.Dockerfile --tag astro-soul-admin:ci .

      - name: Контейнер отдаёт панель и закрыт от индексации/iframe
        run: |
          set -euo pipefail
          docker run --detach --name admin-ci --publish 18090:8080 astro-soul-admin:ci
          ok=0
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18090/ --output index.html; then ok=1; break; fi
            sleep 1
          done
          if [ "$ok" -ne 1 ]; then
            echo "ОШИБКА: контейнер не отдал index.html за 30 секунд" >&2
            docker logs admin-ci >&2 || true
            exit 1
          fi
          grep -q '<div id="root">' index.html || { echo "ОШИБКА: index.html без корня SPA — отдана не панель" >&2; exit 1; }
          curl -fsS http://127.0.0.1:18090/robots.txt | grep -q 'Disallow: /' || { echo "ОШИБКА: robots.txt не запрещает индексацию" >&2; exit 1; }
          headers="$(curl -fsSI http://127.0.0.1:18090/ || true)"
          case "$headers" in
            *X-Frame-Options*) ;;
            *) echo "ОШИБКА: нет X-Frame-Options — панель можно встроить в чужую страницу" >&2; exit 1 ;;
          esac
          echo "admin: образ собран, панель отдаётся, iframe и индексация закрыты"

      - name: Логи контейнера при падении
        if: failure()
        run: docker logs admin-ci || true
