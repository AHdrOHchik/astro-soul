worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server_tokens off;
    sendfile      on;
    tcp_nopush    on;
    keepalive_timeout 65;

    # Временные каталоги в /tmp для совместимости с read_only rootfs и non-root.
    client_body_temp_path /tmp/nginx_client_temp 1 2;
    proxy_temp_path       /tmp/nginx_proxy_temp 1 2;
    fastcgi_temp_path     /tmp/nginx_fastcgi_temp 1 2;
    uwsgi_temp_path       /tmp/nginx_uwsgi_temp 1 2;
    scgi_temp_path        /tmp/nginx_scgi_temp 1 2;

    # Сохраняем клиентский X-Request-Id, если он передан, иначе генерируем свой.
    map $http_x_request_id $req_id {
        default $http_x_request_id;
        ""      $request_id;
    }

    # Секрет вебхука — сегмент пути (`/api/v1/internal/telegram/webhook/<secret>`),
    # поэтому «логировать $uri без query» его НЕ спасает (Б-4, итерация 45).
    # $request_uri не годится тем более: он добавляет ещё и query string. Маска
    # здесь, в одном map: сам факт запроса виден, значение секрета — нет.
    map $uri $uri_logged {
        ~^/api/v1/internal/telegram/webhook/.+  /api/v1/internal/telegram/webhook/***;
        default                                 $uri;
    }

    # Логируем $uri_logged: без query string и без секрета вебхука.
    log_format main_json escape=json
        '{"ts":"$time_iso8601","method":"$request_method","uri":"$uri_logged",'
        '"status":$status,"bytes":$body_bytes_sent,'
        '"duration_s":$request_time,"request_id":"$req_id"}';

    access_log /dev/stdout main_json;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/javascript
        text/javascript
        application/json
        image/svg+xml;

    include /etc/nginx/conf.d/*.conf;
}
