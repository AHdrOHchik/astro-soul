# Админ-панель (Б-2, итерация 45).
#
# Отличия от `default.conf` (мини-апп) — намеренные и перечислены здесь, чтобы
# их не «выровняли» при следующей правке:
#   • `X-Frame-Options: DENY` — панель НЕ открывается в iframe (в отличие от
#     мини-аппа, которому это нужно для Telegram). Встраивание админки на чужую
#     страницу — это clickjacking на ручки бана, возврата и удаления;
#   • `noindex` в `X-Robots-Tag` + `robots.txt` запрет — панель не должна
#     попасть в поиск;
#   • нет `client_max_body_size` с запасом: панель не принимает файлы, 64k
#     хватает любому её телу (JSON с причиной бана);
#   • `/api/` проксируется так же, как в мини-аппе, без срезания префикса.

server {
    listen 8080 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Встроенный DNS Docker: перечитываем IP контейнера api при перезапуске.
    resolver 127.0.0.11 valid=10s ipv6=off;

    client_max_body_size 64k;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    # `/api/v1/*` — тот же origin, без CORS и без срезания префикса.
    location /api/ {
        set $api_upstream http://api:8080;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # X-Forwarded-For перезаписываем, а не дописываем (Б-8 —
        # задача деплоя: доверенный прокси один). Здесь значение то же, что
        # у мини-аппа, чтобы панель не стала вторым, «удобным» источником IP.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $req_id;

        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    120s;
    }

    location = /robots.txt {
        add_header X-Robots-Tag "noindex, nofollow" always;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # Точка входа SPA: ревалидируем всегда — после контрактного изменения
    # старая панель может звать поля, которых больше нет.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri =404;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri $uri/ /index.html;
    }
}
